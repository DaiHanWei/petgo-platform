# ── 「算法参数」独立页（2026-08-26 产品决定；原 Story 16.4 在运营配置页那一块）──
admin.algo.title=算法参数
admin.nav.algoParams=算法参数
admin.algo.notForOps=这一页是首页推荐<b>打分公式的内部参数</b>，留给产品做校准。运营日常要用的顶置、内容打标、限流处置在各自的页面 —— 那些是模型出结果<b>之后</b>的业务规则，改了立刻能看出效果；这一页不是。
admin.algo.section.feedRank=首页推荐算法
admin.algo.why=⚠️ 这些参数<b>第一次校准必然在发版之后</b>：首页点赞与推荐算法同批上线，开发阶段线上没有首页点赞数据，权重与分位数无从校准。改这里<b>无需发版</b>，下一次刷新即生效。
admin.algo.noAbTest=🔴 <b>本平台没有 A/B 实验基建</b>，所以改完这些参数<b>无法判定改对还是改错</b>，只能看整体指标漂移。因此每次改动请记下时间，并与埋点对照 —— 下方「变更记录」就是为此而设。
admin.algo.p95=互动量 95 分位（P95）
admin.algo.p95Note=—— 🔴 <b>系统每 6 小时自动重算</b>（近 30 天），不是手填项，所以这里没有输入框。重算失败会沿用上一次的值，<b>不会回落到 0</b>。
admin.algo.p95LastRun=上次重算
admin.algo.p95Never=尚未跑过（此时由本次候选池现算兜底）
admin.algo.freshnessWeight=新鲜度权重（默认 0.6）
admin.algo.interactionWeight=互动度权重（默认 0.4）
admin.algo.commentWeight=评论权重（相对点赞，默认 2）
admin.algo.exposureDecay=曝光衰减（0–1，默认 0.3）
admin.algo.shuffleStrength=刷新抖动幅度（0–1，默认 0.8；0=关闭，越大下拉刷新换得越狠）
admin.algo.throttleFactor=限流系数（0–1 两端不取，默认 0.2）
admin.algo.seenWindowDays=曝光窗口（天，默认 7）
admin.algo.windowSize=配比窗口（条，默认 10）
admin.algo.throttleNote=🛡 限流系数是被限流内容在打分时乘的那个数，<b>平台级、不逐条调</b>。两端都不取：取 <b>1</b> 等于没处置；取 <b>0</b> 会让被限流的内容分数恒为 0、永远排不进首页 —— 那是<b>下架</b>而不是降权，而限流的定义就是「降权不下架」（直链与作者主页始终照常可访问）。
admin.algo.quotaNote=🛡 下面两组配比<b>各自之和必须等于窗口大小</b>，否则拒绝保存 —— 凑不满或溢出<b>不会报错</b>，只会让首页节奏莫名其妙。属性配比里单项还不得超过窗口的一半，否则必然出现同属性相邻。
admin.algo.attrFunQuota=属性配比 · 趣味（默认 5）
admin.algo.attrEduQuota=属性配比 · 科普（默认 3）
admin.algo.attrLifeQuota=属性配比 · 生活记录（默认 2）
admin.algo.speciesMainQuota=物种配比 · 主物种（默认 6）
admin.algo.speciesOtherQuota=物种配比 · 其他物种（默认 2）
admin.algo.speciesGeneralQuota=物种配比 · 通用（默认 2）
admin.algo.save=保存算法参数
admin.algo.changelog=变更记录
admin.algo.changelogWhy=每一次改动都逐字段留痕。没有 A/B 的情况下，这里的时间是唯一能与埋点指标漂移对上的锚点。
