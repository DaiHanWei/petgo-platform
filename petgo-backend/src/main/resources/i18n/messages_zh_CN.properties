admin.shop.repurchase.scopeNote=本看板评的是两条机制，不是三条：驱虫/疫苗周期提醒（FR-108）已挪到 1.2.0。
admin.shop.repurchase.zeroNote=DEWORM / VACCINE 在本版本恒为 0——这是范围决策，不是数据丢失，也不是埋点坏了。
admin.shop.repurchase.sourceNote=口径以服务端业务库为准（直接读订单行上的归因字段）。PostHog 仅作交叉验证，后台不反拉它的接口。
admin.shop.repurchase.depSixWarning=触发覆盖率为 0，但已有用户买过粮——这几乎可以肯定是商品的每日建议喂量还没录入（DEP-6），而不是复购机制无效。请先补喂量数据再评估。
admin.shop.repurchase.attributionNote=下面的占比直接读订单行上的「入口来源／触发类型」字段——用户真的从那个入口买了，而不是「曝光过」。触发卡曝光数与点击率属客户端事件，在 PostHog 交叉验证。
admin.shop.repurchase.accuracyNote=偏差 = 实际再购日 − 预估耗尽日。正值表示用户比预估晚买（预估偏早），负值表示预估偏晚。只统计已被再次购买超越的触发。
admin.shop.repurchase.oq42=⚠️ A-16 的判据「显著」目前无数值、无窗口、无处置（OQ-42 未拍板）——本看板能给出读数，但还不能替任何人做「继续还是砍掉」的决定。
