admin.tagicon.spec.contentTag=PNG 或 WebP，必须透明底。正方形，边长 {0}–{1} 像素（宽高允许 5% 以内误差），文件 ≤ {2} KB。不支持 JPG（无法存透明）。编辑时不选文件＝保留原图标。⚠️ 它在用户端只有 9×9 那么大（叠在橙红渐变胶囊上），请用一个极简的单色剪影、且颜色要浅（白色最稳）——细节和深色在这个尺寸上一律看不清。上传 128×128 就足够了，不必做到 1024。
admin.tagicon.spec.userTag=PNG 或 WebP，必须透明底。正方形，边长 {0}–{1} 像素（宽高允许 5% 以内误差），文件 ≤ {2} KB。不支持 JPG（无法存透明）。编辑时不选文件＝保留原图标。⚠️ 它在用户端是一枚 14×14 的金色圆形徽章，你上传的图标只占中间 8×8。请用一个极简的**纯白**单色剪影——它叠在金色底上，深色或彩色图标会糊成一团。上传 128×128 就足够了，不必做到 1024。
admin.tagicon.required=新建标签必须上传图标 —— 图标是标签胶囊的固定组成部分，缺了在 App 上只剩一行文字。
admin.tagicon.uploadFailed=图标上传失败，请稍后重试。若反复失败请联系技术（对象存储可能不可用）。

