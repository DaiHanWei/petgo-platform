role.SUPER_ADMIN=Super admin
role.SUPER_ADMIN.desc=Wewenang tertinggi di seluruh platform, otomatis memiliki semua modul. Maksimal 5 akun, dan super admin aktif terakhir tidak bisa dinonaktifkan maupun diturunkan.
role.OPS_MANAGER=Manajer operasional
role.OPS_MANAGER.desc=Penanggung jawab lini operasional: moderasi konten, data dan kualifikasi dokter hewan, penonaktifan pengguna, konfigurasi operasional, persetujuan refund, inventaris dan pemenuhan pesanan, serta audit dan akun (baca saja). Tidak termasuk harga beli, data bisnis, dan pencairan dana.
role.OPERATIONS=Staf operasional
role.OPERATIONS.desc=Operasional harian: moderasi dan penurunan konten, pemeliharaan produk, komunitas dan pengguna (baca saja). Tanpa wewenang persetujuan, pencairan dana, atau penonaktifan.
role.FULFILLMENT=Staf pengiriman
role.FULFILLMENT.desc=Alur pemenuhan pesanan toko: lihat pesanan, kirim, tandai terkirim, tangani pesanan bermasalah, dan kelola keluar-masuk stok. Terbatas pada modul toko — tanpa harga beli, dan tidak bisa mencari pesanan lewat nomor telepon penerima.
role.SUPPORT=Layanan pelanggan
role.SUPPORT.desc=Menangani tiket, mengajukan permintaan refund, menindaklanjuti anomali konsultasi, dan mencari pesanan lewat nomor telepon penerima (setiap penggunaan tercatat di audit). Hanya baca untuk pengguna dan konten; tidak bisa menyetujui atau mencairkan dana.
role.FINANCE=Keuangan
role.FINANCE.desc=Settlement bulanan dan pencairan dokter hewan, catatan pembayaran, pencairan refund, harga beli, dan data bisnis. Satu-satunya peran yang secara bawaan memegang harga beli dan rekonsiliasi margin.
role.CUSTOM=Kustom
role.CUSTOM.desc=Tanpa templat peran — izin dicentang satu per satu. Untuk kasus yang tidak tercakup peran kerja; akun lama otomatis memakai peran ini setelah migrasi.
