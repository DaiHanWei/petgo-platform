# ── 「算法参数」独立页（2026-08-26 产品决定；原 Story 16.4 在运营配置页那一块）──
admin.algo.title=Parameter algoritma
admin.nav.algoParams=Parameter algoritma
admin.algo.notForOps=Halaman ini berisi <b>parameter internal formula skor beranda</b>, disediakan untuk kalibrasi oleh tim produk. Tuas operasional harian — penyematan, pelabelan konten, pembatasan jangkauan — ada di halaman masing-masing: itu adalah aturan bisnis yang diterapkan <b>setelah</b> model menghasilkan hasil, dan efeknya langsung terlihat. Yang di sini tidak.
admin.algo.section.feedRank=Parameter algoritma
admin.algo.why=⚠️ Parameter ini <b>baru bisa dikalibrasi setelah rilis</b>: suka di beranda dan algoritma peringkat dirilis bersamaan, sehingga selama pengembangan tidak ada data suka di produksi dan bobot maupun persentil tidak bisa dikalibrasi lebih dulu. Perubahan di sini <b>tidak perlu rilis baru</b> — langsung berlaku pada penyegaran berikutnya.
admin.algo.noAbTest=🔴 <b>Platform ini tidak memiliki infrastruktur uji A/B</b>, jadi setelah mengubah parameter ini <b>tidak ada cara memastikan perubahannya benar atau salah</b> — hanya pergeseran metrik keseluruhan yang terlihat. Catat waktu setiap perubahan dan cocokkan dengan analitik; log perubahan di laci "Riwayat perubahan" pada kepala halaman dibuat justru untuk itu.
admin.algo.p95=Persentil ke-95 interaksi (P95)
admin.algo.p95Note=— 🔴 <b>Dihitung ulang otomatis setiap 6 jam</b> (30 hari terakhir). Bukan isian manual, jadi tidak ada kotak input. Jika penghitungan gagal, nilai sebelumnya dipertahankan — <b>tidak pernah kembali ke 0</b>.
admin.algo.p95LastRun=Terakhir dihitung ulang
admin.algo.p95Never=Belum pernah dijalankan (sementara dihitung dari kumpulan kandidat saat ini)
admin.algo.freshnessWeight=Bobot kebaruan (bawaan 0,6)
admin.algo.interactionWeight=Bobot interaksi (bawaan 0,4)
admin.algo.commentWeight=Bobot komentar (relatif terhadap suka, bawaan 2)
admin.algo.exposureDecay=Peluruhan paparan (0–1, bawaan 0,3)
admin.algo.shuffleStrength=Kekuatan acak saat refresh (0-1, bawaan 0,8; 0 = mati, makin besar makin banyak konten baru tiap refresh)
admin.algo.throttleFactor=Faktor pembatasan (0–1 eksklusif, bawaan 0,2)
admin.algo.seenWindowDays=Jendela paparan (hari, bawaan 7)
admin.algo.windowSize=Jendela kuota (konten, bawaan 10)
admin.algo.throttleNote=🛡 Faktor pembatasan adalah pengali yang diterapkan pada konten yang dibatasi saat penilaian — <b>berlaku seluruh platform, bukan per konten</b>. Kedua ujungnya tidak boleh: <b>1</b> berarti tidak ada tindakan sama sekali; <b>0</b> akan membuat skor konten selalu 0 dan tidak pernah masuk beranda — itu <b>penurunan konten</b>, bukan penurunan peringkat, padahal definisi pembatasan adalah "turunkan peringkat, jangan turunkan konten" (tautan langsung dan halaman penulis tetap bisa diakses).
