admin.tagicon.spec.contentTag=PNG atau WebP dengan latar transparan. Persegi, sisi {0}\u2013{1}px (selisih maksimal 5%), berkas \u2264 {2} KB. JPG tidak didukung. Membiarkan berkas kosong saat mengedit berarti ikon lama dipertahankan. Catatan: di sisi pengguna ukurannya hanya 9\u00d79 di atas pil gradasi oranye-merah \u2014 pakai siluet satu warna yang sangat sederhana dan terang (putih paling aman); detail dan warna gelap tidak terbaca pada ukuran itu. Ekspor 128\u00d7128 sudah cukup.
admin.tagicon.spec.userTag=PNG atau WebP dengan latar transparan. Persegi, sisi {0}\u2013{1}px (selisih maksimal 5%), berkas \u2264 {2} KB. JPG tidak didukung. Membiarkan berkas kosong saat mengedit berarti ikon lama dipertahankan. Catatan: di sisi pengguna ikon berada di dalam lencana bulat emas 14\u00d714 dan hanya mengisi 8\u00d78 di tengah. Pakai siluet putih polos yang sangat sederhana \u2014 ikon gelap atau berwarna akan tampak kotor di atas emas. Ekspor 128\u00d7128 sudah cukup.
admin.tagicon.required=Label baru wajib punya ikon — ikon adalah bagian tetap dari pil label; tanpa ikon aplikasi hanya menampilkan teks.
admin.tagicon.uploadFailed=Unggah ikon gagal. Coba lagi; jika terus gagal, hubungi tim teknis (penyimpanan objek mungkin tidak tersedia).

