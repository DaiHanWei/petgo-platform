admin.v130.dashboard.metric.cumulative_users.hint=Pengguna asli terdaftar hingga pukul 24:00 hari itu (dulu “total pengguna terpasang”); tren kumulatif
admin.v130.dashboard.metric.posting_users.hint=Penulis unik yang menerbitkan postingan terlihat (terbit dan tidak dihapus) hari itu; cakupan “pengguna asli” mengecualikan penulis virtual
admin.v130.dashboard.metric.new_posts.hint=Postingan terlihat yang terbit hari itu (sedang ditinjau, disembunyikan karena penulis nonaktif, atau dihapus tidak dihitung); cakupan “pengguna asli” mengecualikan penulis virtual
admin.v130.dashboard.metric.new_pet_owners.hint=Pengguna unik yang membuat profil hewan pertamanya hari itu (dihitung per orang, bukan per profil)
admin.v130.dashboard.metric.cumulative_pet_owners.hint=Pengguna unik yang memiliki minimal satu profil hewan per pukul 24:00 hari itu (beberapa profil dihitung sekali)
admin.v130.dashboard.metric.diary_pet_owners.hint=Pengguna unik yang punya profil hewan dan menerbitkan postingan momen kalender tumbuh (diary) terlihat hari itu
admin.v130.dashboard.metric.interacted_posts.hint=Postingan unik yang menerima minimal satu suka atau komentar valid (terlihat dan tidak dihapus) hari itu, apa pun tanggal terbitnya; cakupan “pengguna asli” mensyaratkan penulis dan pemberi interaksi sama-sama asli
admin.v130.dashboard.metric.silent_posts.hint=Postingan terlihat yang terbit hari itu dan mendapat nol suka serta nol komentar valid di hari yang sama; pada cakupan “pengguna asli” penulis dan pemberi interaksi disaring ke pengguna asli
admin.v130.dashboard.metric.engagement_score.hint=Skor interaksi yang terjadi hari itu: suka ×1 + komentar valid ×5 (tanpa memandang kapan postingan terbit)
admin.v130.dashboard.metric.new_posts_score.hint=Jumlah suka ×1 + komentar valid ×5 yang terkumpul hingga pukul 24:00 hari itu untuk postingan yang terbit hari itu; batasnya tetap, angka tidak bertambah kemudian
admin.v130.dashboard.metric.all_posts_avg_score.hint=Rata-rata skor kumulatif (suka ×1 + komentar valid ×5) dari seluruh postingan terlihat yang terbit hingga hari itu; terdilusi oleh basis yang tumbuh, baca sebagai tren
admin.v130.dashboard.metric.interacted_posts_avg_score.hint=Rata-rata suka ×1 + komentar valid ×5 yang baru bertambah hari itu pada postingan yang menerima interaksi hari itu (bukan skor kumulatif)
admin.v130.dashboard.metric.engagement_score_all_time.hint=Akumulasi suka ×1 + komentar valid ×5 sepanjang waktu hingga pukul 24:00 hari itu; bertambah tiap hari, tren total interaksi
admin.v130.dashboard.metric.paying_users_cash.hint=Pengguna asli unik dengan pembayaran tunai yang masuk hari itu (catatan pembayaran berstatus lunas; waktu masuk = pembaruan terakhirnya), semua tujuan QRIS: konsultasi / isi ulang / buka AI / ID HD
admin.v130.dashboard.metric.payments_cash.hint=Jumlah pembayaran tunai yang masuk hari itu, tanpa deduplikasi (beberapa pembayaran oleh satu orang dihitung masing-masing)
admin.v130.dashboard.metric.paying_users_incl_pawcoin.hint=Pengguna asli unik dengan pembayaran konsultasi ∪ buka AI selesai ∪ pembelian ID HD ∪ isi ulang PawCoin hari itu; pembayaran saldo dihitung. Selisih dengan “tunai masuk” = orang yang isi ulang sebelumnya dan bayar pakai saldo hari ini
admin.v130.dashboard.metric.payments_incl_pawcoin.hint=Jumlah transaksi untuk cakupan “termasuk PawCoin”, tanpa deduplikasi; pesanan yang di-refund tetap dihitung pada hari pembayaran (refund tidak menulis ulang fakta pembayaran)
