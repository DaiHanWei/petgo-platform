admin.shop.repurchase.scopeNote=This dashboard evaluates two mechanisms, not three: deworm/vaccine cycle reminders (FR-108) moved to 1.2.0.
admin.shop.repurchase.zeroNote=DEWORM / VACCINE are always 0 in this version - that is a scope decision, not missing data and not broken tracking.
admin.shop.repurchase.sourceNote=Figures come from the server-side business database (attribution stored on order lines). PostHog is cross-check only; the admin never calls its API.
admin.shop.repurchase.depSixWarning=Trigger coverage is 0 while customers have bought food - this is almost certainly missing daily-feeding data on products (DEP-6), not an ineffective mechanism. Fill the feeding data before judging.
admin.shop.repurchase.attributionNote=These shares read the entry-source and trigger-type fields on order lines - the customer actually bought through that entry, not merely saw it. Card impressions and click-through are client events, cross-checked in PostHog.
admin.shop.repurchase.accuracyNote=Deviation = actual repurchase date - estimated depletion date. Positive means the customer bought later than estimated. Only superseded triggers are counted.
admin.shop.repurchase.oq42=A-16's "significant" bar currently has no target, no window and no action (OQ-42 undecided). This dashboard reports the numbers; it cannot yet decide keep-or-kill for anyone.
