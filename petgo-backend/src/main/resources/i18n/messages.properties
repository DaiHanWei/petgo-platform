# 英文基线（Story 11.7 · AC1）—— **无语言后缀**，任何 locale 缺键时回退到这里。
#
# 🔴 为什么需要它：此前配置是 setUseCodeAsDefaultMessage(true)，缺键回退成 **key 本身** ——
#    也就是说任何语言只要漏一条键，线上就是一个 `admin.tags.icon` 这样的键名露在界面上。
#    加了基线之后，最坏情况是「这句是英文」，那是可接受的降级。
