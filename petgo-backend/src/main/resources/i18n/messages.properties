# ⚠️ 本文件是 messages_en.properties 的**副本**，由 L0 测试保证两者键集一致。
#    🛡 改后台文案时**改 messages_en 与 messages_zh_CN**，本文件随之同步 ——
#    不要只改这里，那会让英文界面与基线不一致。
