# ── 「算法参数」独立页（2026-08-26 产品决定；原 Story 16.4 在运营配置页那一块）──
admin.algo.title=Algorithm parameters
admin.nav.algoParams=Algorithm parameters
admin.algo.notForOps=This page holds the <b>internal parameters of the home feed scoring formula</b>, reserved for product calibration. The day-to-day operational levers — pinning, content tagging, throttling — live on their own pages: those are business rules applied <b>after</b> the model produces results, and their effect is immediately visible. These are not.
admin.algo.section.feedRank=Algorithm parameters
admin.algo.why=⚠️ These parameters <b>can only be calibrated after release</b>: home-feed likes and the ranking algorithm ship together, so there is no production like data during development and no way to calibrate weights or percentiles beforehand. Changes here <b>need no release</b> — they take effect on the next refresh.
admin.algo.noAbTest=🔴 <b>There is no A/B testing infrastructure on this platform</b>, so after changing these parameters there is <b>no way to tell whether the change was right or wrong</b> — only overall metric drift is observable. Note the time of every change and line it up against analytics; the "Change history" drawer in the header exists for exactly that.
admin.algo.p95=Interaction 95th percentile (P95)
admin.algo.p95Note=— 🔴 <b>Recomputed automatically every 6 hours</b> (trailing 30 days). It is not a manual field, hence no input box. If a recompute fails the previous value is kept — it <b>never falls back to 0</b>.
admin.algo.p95LastRun=Last recomputed
admin.algo.p95Never=Never run yet (falls back to computing from the current candidate pool)
admin.algo.freshnessWeight=Freshness weight (default 0.6)
admin.algo.interactionWeight=Interaction weight (default 0.4)
admin.algo.commentWeight=Comment weight (relative to likes, default 2)
admin.algo.exposureDecay=Exposure decay (0–1, default 0.3)
admin.algo.shuffleStrength=Refresh shuffle strength (0-1, default 0.8; 0 = off, higher = more rotation per refresh)
admin.algo.throttleFactor=Throttle factor (0–1 exclusive, default 0.2)
admin.algo.seenWindowDays=Exposure window (days, default 7)
admin.algo.windowSize=Quota window (posts, default 10)
admin.algo.throttleNote=🛡 The throttle factor is the multiplier applied to a throttled post at scoring time — <b>platform-wide, not per post</b>. Both ends are excluded: <b>1</b> means no action at all; <b>0</b> would force a throttled post to score 0 forever and never reach the home feed — that is a <b>takedown</b>, not a demotion, and throttling is by definition "demote, do not take down" (direct links and the author profile stay reachable).
admin.algo.quotaNote=🛡 Each of the two quota groups (attribute / species) <b>must sum to the window size</b>, otherwise the save is rejected — an under- or over-filled window <b>raises no error</b>, it just makes the home feed rhythm inexplicable. Within the attribute quotas no single value may exceed half the window, or same-attribute posts are guaranteed to sit next to each other.
admin.algo.attrFunQuota=Attribute quota · Fun (default 5)
admin.algo.attrEduQuota=Attribute quota · Educational (default 3)
admin.algo.attrLifeQuota=Attribute quota · Daily life (default 2)
admin.algo.speciesMainQuota=Species quota · Primary (default 6)
admin.algo.speciesOtherQuota=Species quota · Other (default 2)
admin.algo.speciesGeneralQuota=Species quota · General (default 2)
admin.algo.save=Save algorithm parameters
admin.algo.changelog=Change log
admin.algo.changelogWhy=Every change is recorded field by field. Without A/B testing, the timestamps here are the only anchor that can be lined up against drift in analytics.
admin.algo.col.at=Time (WIB)
admin.algo.col.field=Parameter
admin.algo.col.from=From
admin.algo.col.to=To
admin.algo.col.by=Changed by
admin.algo.changelog.empty=No changes yet.
