admin.tagicon.tooSmall=Icon is {0}\u00d7{1}, too small — the shorter side must be at least {2}px (it renders at ~10 logical px, so a 3x screen needs 33px; {2} leaves headroom).
admin.tagicon.tooBig=Icon is {0}\u00d7{1}, too large — the longer side must not exceed {2}px. Bigger icons only waste user bandwidth.
