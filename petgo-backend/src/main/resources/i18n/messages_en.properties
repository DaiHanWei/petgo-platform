admin.tagicon.spec.contentTag=PNG or WebP with a transparent background. Square, {0}\u2013{1}px per side (up to 5% difference tolerated), file \u2264 {2} KB. JPG is not supported. Leaving the file empty when editing keeps the current icon. Note: it renders at just 9\u00d79 on a warm gradient pill \u2014 use a very simple, light (ideally white) single-colour silhouette; detail and dark colours are unreadable at that size. Exporting at 128\u00d7128 is plenty.
admin.tagicon.spec.userTag=PNG or WebP with a transparent background. Square, {0}\u2013{1}px per side (up to 5% difference tolerated), file \u2264 {2} KB. JPG is not supported. Leaving the file empty when editing keeps the current icon. Note: it renders inside a 14\u00d714 gold circular badge, and your icon occupies only the middle 8\u00d78. Use a very simple pure-white silhouette \u2014 dark or colourful icons turn to mush on the gold. Exporting at 128\u00d7128 is plenty.
admin.tagicon.required=A new tag must have an icon — the icon is a fixed part of the tag pill; without it the app shows text only.
