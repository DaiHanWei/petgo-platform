# ===== 后台岗位角色（V165）。角色→权限码映射见 AdminRole；此处只是它的展示名与职责说明。 =====
admin.accounts.role=Role
admin.accounts.col.role=Role
admin.accounts.saveRole=Change role
admin.accounts.byRole=(granted by role)
role.SUPER_ADMIN=Super admin
role.SUPER_ADMIN.desc=Highest platform privilege, implicitly holds every module. Capped at 5, and the last active super admin can be neither disabled nor demoted.
role.OPS_MANAGER=Operations manager
role.OPS_MANAGER.desc=Owns the operations line: content moderation, vet records and qualifications, user deactivation, operational config, refund approval, inventory and order fulfilment, read-only audit and accounts. Excludes cost prices, business data and payouts.
role.OPERATIONS=Operations specialist
role.OPERATIONS.desc=Day-to-day operations: content moderation and takedowns, product upkeep, read-only community and users. No approval, payout or deactivation actions.
role.FULFILLMENT=Fulfilment specialist
role.FULFILLMENT.desc=The shop fulfilment loop: view orders, ship, mark delivered, handle exceptions, move inventory. Limited to shop modules — no cost prices, and cannot look up orders by recipient phone number.
role.SUPPORT=Customer support
role.SUPPORT.desc=Handles tickets, submits refund requests, follows up consult anomalies, and looks up orders by recipient phone (each use is audited). Read-only on users and content; cannot approve or pay out.
role.FINANCE=Finance
role.FINANCE.desc=Vet monthly settlement and payouts, payment records, refund payouts, cost prices and business data. The only role that holds cost prices and margin reconciliation by default.
role.CUSTOM=Custom
role.CUSTOM.desc=No role template — permissions are ticked one by one. For cases the job roles do not cover; existing accounts default to this role after migration.

