      SELECT sum(d1_retained)::numeric / NULLIF(sum(cohort_size), 0) FROM agg_cohort_retention
      WHERE cohort_type = 'INSTALL' AND cohort_date BETWEEN :week_monday AND :week_monday + 6 AND d1_retained IS NOT NULL;
