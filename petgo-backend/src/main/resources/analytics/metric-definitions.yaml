# 指标口径（analytics-pipeline Story 1.2，架构 D-9 / FR-26）—— 口径文档的唯一来源。
#
# 后端启动时同步进埋点库 metric_definitions 表（表是本文件的投影，AI 查数只读库）。
# 字段与表列一一对应：
#   code        团队编号，如 S1、电商#6（全表唯一，≤32）
#   name        指标名（必填，≤128）
#   definition  定义：算什么、按什么时区 / 周期（必填）
#   sources     来源表 / 事件（字符串列表）
#   exclusions  排除规则
#   known_bias  已知偏差
#   sql_path    汇总 SQL 文件位置（resources/ 下的相对路径）
#   changelog   变更记录 [{date: "YYYY-MM-DD", change: ...}]（日期一律加引号，按字符串存）
#
# 本 story 只放结构与 S1 示例，其余指标随 Epic 4（FR-26）补。
version: 1
metrics:
  - code: S1
    name: "日活（DAU）"
    definition: >-
      WIB 自然日内有 Application Opened 的去重人数。另含（周 = 周一至周日）：周合计 = 每日日活之和；
      周均值 = 周合计 ÷ 天数；周内最高 / 最低日；周增长率 =（本周 − 上周）÷ 上周；工作日（周一至周五）与周末平均日活。
    sources:
      - "观察期：ga4_daily_snapshot.active_users_all（GA4 全版本日活，按设备、含游客；Story 4.2）"
      - "对账通过后（FR-24）：events_detail 的 Application Opened"
    exclusions: >-
      只算生产数据；按人统计时只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
      自建口径（agg_daily_activity.dau_person）：event_date = 统计日、is_production、NOT is_suspicious、source = 'APP'
      （H5 访客不是 App 设备，不算）；按 v_events_person 归属到人之后再排除非 USER / 非 REAL 用户
      （匿名事件经关联表归到兽医 / 虚拟号的也排除）。
    known_bias: >-
      观察期内 S1 取 ga4_daily_snapshot.active_users_all（GA4 全版本日活，按设备、含游客，见 Story 4.2「GA4 日活（含游客）」条目）；
      自建 dau_person 对账通过（见「对账差值与状态」条目）后，是否切换由 Dai 决定（开关 analytics.dau-source = GA4 / SELF），
      切换日期写进本条变更记录（Story 4.7）。
      员工与测试账号算作正常用户；日去重人数不能跨天相加（§4.5.1），周合计是日活之和、不是周去重人数。
      自建口径：按「人」去重（D-10：登录前、登出后的匿名事件按关联表归到账号），从未登录的设备按匿名 id 算一人；
      卸载重装生成新匿名 id，未登录的同一台设备会算两人。分平台各自去重，all 行整体单独去重（同一人两端都用，all 只算一次，各平台相加 ≥ all）。
      Android 跳外部全屏 Activity（系统 Photo Picker、相机、Custom Tabs 登录、外部支付 App）回来会多报一次
      Application Opened（from_background = true；自建上报没有 PostHog 约 700ms 的去抖），按人去重不影响日活，但打开次数偏高。
      冷启动慢的机器上生产标记的环境插件超过 3 秒才返回时，整个会话的事件记为非生产、不计入（宁可少算生产，日活略偏低）。
      之前从未关联过的匿名 id，事后登录兽医 / 虚拟号时才被识别并排除；从未登录的兽医设备无法识别，按游客计入。
      晚到超过 3 天的事件进明细但不回算（D-6）；V1.5.0 之前的版本没有自建数据。
    sql_path: analytics/rollup/activity.sql
    changelog:
      - { date: "2026-11-13", change: "初版骨架" }
      - { date: "2026-11-13", change: "Story 4.1：自建口径落地 agg_daily_activity.dau_person（含游客、按人、分平台 + all），SQL 文件由 dau.sql 改为 activity.sql；注明观察期内以 GA4 为准" }
      - { date: "2026-11-13", change: "Story 4.2：观察期内取 ga4_daily_snapshot.active_users_all；新增日活来源开关 analytics.dau-source（默认 GA4），切换由 Dai 决定、切换日期写进本条（Story 4.7）" }
  - code: "S1-登录"
    name: "登录用户日活"
    definition: >-
      WIB 自然日内，事件发生时已登录（明细 user_id 非空）且有 Application Opened 的去重用户数。
      不经关联表推断（登录前 / 登出后的匿名打开不算），分平台 + all。
    sources:
      - "events_detail：Application Opened（user_id 非空）"
      - "汇总表：agg_daily_activity.dau_logged_in"
    exclusions: >-
      只算生产数据、非可疑、source = 'APP'；只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
    known_bias: >-
      员工与测试账号算作正常用户；all 行整体单独去重，不是各平台相加。
      登出状态下打开 App 不算登录用户日活（但按人归属计入 S1 自建日活）。
      晚到超过 3 天的事件不回算（D-6）；V1.5.0 之前没有自建数据。
    sql_path: analytics/rollup/activity.sql
    changelog:
      - { date: "2026-11-13", change: "Story 4.1：新增" }
  - code: S2
    name: "安装量（新装数）"
    definition: >-
      WIB 自然日内首次出现 Application Installed 的去重人数（agg_daily_install.new_installs）。
      「首次」= 在明细保留期（回看 92 天）内该人最早一条 Application Installed 的 event_date 等于统计日。
      分 android / ios（平台取该人最早那条安装事件的平台）+ all，各平台相加 = all。升级（Application Updated）不算新装（FR-3）。
      周 / 月安装量按日相加即可（每人只在首次安装那天计一次）。
    sources:
      - "events_detail：Application Installed"
      - "identity_links（D-10：未登录时的安装事件归到之后首次登录的账号）"
      - "汇总表：agg_daily_install.new_installs"
    exclusions: >-
      只算生产数据、非可疑、source = 'APP'；按 v_events_person 归属到人之后排除非 USER / 非 REAL 用户（Q5）。
    known_bias: >-
      卸载重装生成新匿名 id：重装后一直未登录的算一次新装；重装后登录了原账号的，安装事件按 D-10 归回原账号，
      若原账号的首次安装仍在保留期内则不再算新装——但登录晚于 3 天重算窗口时，当天已计入的新装不回退。
      「首次」只能在明细保留期（约 3 个月）内判断：更早装过、换了设备的同一用户会再算一次新装。
      员工与测试账号按正常用户算；生产标记的环境插件超过 3 秒才返回的会话记为非生产，不计入（偏低）。
      兽医 / 虚拟号设备登录前的安装按关联表归到该账号后排除；从未登录的兽医设备无法识别，按游客计入。
      晚到超过 3 天的事件进明细但不回算（D-6）；V1.5.0 之前没有自建数据（旧版升级上来的设备报 Application Updated，不算新装）。
    sql_path: analytics/rollup/install.sql
    changelog:
      - { date: "2026-11-13", change: "Story 4.1：新增" }
  - code: S3
    name: "注册数与注册率"
    definition: >-
      注册数 = WIB 自然日内首次出现 signup_succeeded 的去重人数（agg_daily_install.signups），「首次」判断同 S2（回看 92 天）。
      注册率 = 注册数 ÷ 安装量（S2），同一周期，由汇总表现算。分 android / ios + all，各平台相加 = all。
    sources:
      - "events_detail：signup_succeeded（App 唯一上报入口 petgo_app/lib/core/analytics/analytics.dart）"
      - "汇总表：agg_daily_install.signups（分子）、agg_daily_install.new_installs（分母）"
    exclusions: >-
      只算生产数据、非可疑、source = 'APP'；按人归属后排除非 USER / 非 REAL 用户（Q5）。
    known_bias: >-
      注册率的分子分母都按「当期首次」计，分子不要求来自当期安装的人（团队原文口径）。
      「首次」只在明细保留期内判断。员工与测试账号按正常用户算。
      晚到超过 3 天的事件不回算（D-6）；V1.5.0 之前没有自建数据。
    sql_path: analytics/rollup/install.sql
    changelog:
      - { date: "2026-11-13", change: "Story 4.1：新增" }
  - code: S5
    name: "运营位曝光与点击"
    definition: >-
      每个弹窗 / banner 的展示次数、点击次数、点击率，推广 Toko 的另算点击后 7 天已付款 Toko 订单数（团队原文）。
      运营位按 placement_type 分三类、按 placement_token 区分到具体一条：
      ops_popup（运营弹窗）—— 曝光 ops_popup_shown，点击 ops_popup_tapped，另有关闭 ops_popup_closed（不算点击）；
      toko_banner（Toko 横幅）—— 曝光 toko_banner_shown，点击 toko_banner_tapped；
      newbie_coupon（新人券弹窗）—— 曝光 toko_newbie_coupon_popup_shown，点击 toko_newbie_coupon_popup_tapped 且 action = 'register'（action = 'close' 不算点击）。
      曝光规则：露出超过 50% 计一次（与 Toko 横幅原定义一致）——运营弹窗与新人券弹窗在弹窗首帧后（整窗露出）报一次；
      横幅以当前页露出 > 50% 为准，同一次进入 Toko 同一张只报一次。
      点击判定：ops_popup 看 ops_popup_tapped（弹窗 pop 后上报；目标无效时图片不可点、只能点按钮，也算点击）；
      toko_banner 看 toko_banner_tapped（target=NONE 的横幅不可点，点击率按 0 记而不是缺失）；newbie_coupon 看 action = 'register'。
      点击率 = 点击次数 ÷ 曝光次数，按 placement_token、WIB 自然日。
      「是否推广 Toko」由 Story 4.4 读业务库运营位配置的跳转目标决定（FR-17 第 3 条）；新人券弹窗恒属 Toko；
      toko_banner_tapped 另带 target_type。运营推送（ops_notification_campaigns）的打开由 Story 3.2 的 push_opened + campaign_token 覆盖，不在本条。
      汇总（Story 4.4）：agg_daily_placement 按 WIB 日 × placement_type × placement_token 记曝光次数 impressions、点击次数 clicks、
      点击人数 click_persons（按 D-10 归属到人去重）；agg_weekly_placement（周一至周日）/ agg_monthly_placement（WIB 自然月）的
      点击人数与带单数为周期内重新去重（D-12，不是日表相加），曝光 / 点击为周期内求和，is_complete = 周期末 ≤ 计算基准日。
      点击率 = clicks ÷ impressions 现算，例：SELECT placement_token, sum(clicks)::numeric / NULLIF(sum(impressions), 0)
      FROM agg_daily_placement WHERE stat_date BETWEEN … GROUP BY placement_token。
      带单 paid_orders_7d（FR-22）：当期点击过该运营位的登录用户，每次点击之后 7 天内（点击时间 < paid_at ≤ 点击时间 + 7 天）
      付款的 Toko 订单数（业务库 shop_orders.paid_at IS NOT NULL，D-13，付款后退款 / 取消仍算），按订单去重；
      orders_window_complete = 统计日（周期末）+ 7 ≤ 计算基准日，之前带单数仍会增加。业务库与埋点按用户 + 时间在 Java 里匹配，不跨库 SQL。
      是否推广 Toko promotes_toko（FR-17 第 3 条）按计算当时的业务库配置判定：ops_popup 看 ops_popups.target_type ——
      PRODUCT / CATEGORY，或 APP_PAGE 且 target_value = 'TOKO' 为 true，NONE / EXTERNAL / 其他 APP_PAGE（HOME、PUBLISH、KNOW_YOUR_PET、HEALTH）为 false；
      toko_banner 一律 true（shop_banners 只出现在 Toko 页）；newbie_coupon 一律 true（Toko 新人券）；配置已删、查不到 token 为空。
    sources:
      - "events_detail：ops_popup_shown / ops_popup_tapped / ops_popup_closed（placement_type = ops_popup）"
      - "events_detail：toko_banner_shown / toko_banner_tapped（placement_type = toko_banner）"
      - "events_detail：toko_newbie_coupon_popup_shown / toko_newbie_coupon_popup_tapped（placement_type = newbie_coupon）"
      - "placement_token 来源表（业务库）：ops_popup → ops_popups.public_token（App 取 OpsPopupCandidate.token）"
      - "placement_token 来源表（业务库）：toko_banner → shop_banners.public_token（V20261030_0330 加列，App 取 ShopBanner.bannerId）"
      - "placement_token 来源表（业务库）：newbie_coupon → shop_coupons.public_token（新人券模板，GET /shop/coupons/newbie-campaign 下发，App 取 NewbieCampaign.campaignToken）"
      - "汇总表：agg_daily_placement / agg_weekly_placement / agg_monthly_placement（Story 4.4）"
      - "业务库（窄查询，只取 token / 跳转列）：ops_popups(public_token, target_type, target_value)、shop_banners(public_token, target_type)"
      - "业务库（窄查询）：shop_orders(user_id, public_token, paid_at)，paid_at IS NOT NULL = 已付款（D-13）"
    exclusions: >-
      只算生产数据（生产标记）；按人统计时只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
      非运营位弹窗 / 横幅不算：growth_backfill_popup_shown、growth_celebration_shown（成长体系功能弹窗）、
      app_update_prompt_shown（升级提示）、login_guide_*（登录引导）、pet_readonly_banner_shown（名额只读条）——
      它们不是后台运营配置，没有运营位 token。首页只有升级横幅（AppUpdateBanner），没有运营 banner。
    known_bias: >-
      V1.5.0 之前的旧版 App 不带 placement_*，但旧版事件不进自建库（PostHog 已停用，自建只收新版），自建库里不存在缺 placement_* 的旧事件，无需兼容映射。
      运营弹窗另有服务端曝光计数（_reportImpression，只记登录且非兽医用户），与埋点曝光（游客也报）口径不同，两者不能直接对比。
      横幅曝光以「当前页」为单位，自动轮播翻到的每张各算一次曝光。
      新人券弹窗只对游客展示，点击（注册）后到登录完成之间可能流失，点击 ≠ 领券；领券看 toko_coupon_claimed（source = newbie）。
      旧后端未下发横幅 token 时 toko_banner_tapped 不带 banner_id / placement_token；新人券活动 token 解析失败（空串）时不带 placement_token。
      汇总只按 placement_type + placement_token 统计：属性与事件名不一致、缺 token、token 超过 64 字符的事件跳过（条数只进汇总日志）；
      V1.5.0 之前的旧属性（popup_id、banner_id、coupon_id）不兼容。
      带单是「点击后 7 天内的已付款订单」，不代表订单一定由该运营位带来；同一订单可同时计入多个运营位（各运营位分别去重）。
      匿名点击且之后从未登录的人无法匹配订单（按 D-10 归属：点击后登录的匿名点击归到该账号后可匹配）。
      promotes_toko 按计算时的配置判定，回补窗口（10 天）内运营改了跳转会改变历史行；配置已删的为空；新人券不查配置，恒为 true。
      曝光只在新版 App（Story 3.1 之后）统一为「露出超过 50% 计一次」。
      带单重算窗口 10 天（7 天带单 + 3 天晚到，D-6）：之后再晚到的事件不回算。员工与测试账号按正常用户算。
    sql_path: analytics/rollup/placement.sql
    changelog:
      - { date: "2026-11-12", change: "Story 3.1：核对运营位清单（ops_popup / toko_banner / newbie_coupon）、事件名、token 来源表，统一曝光规则与点击判定；新人券弹窗曝光改为首帧后上报" }
      - { date: "2026-11-13", change: "Story 4.4：汇总落地 agg_daily/weekly/monthly_placement（曝光、点击、点击人数周期去重、点击后 7 天已付款 Toko 订单数、推广 Toko 判定），SQL 见 analytics/rollup/placement.sql" }
  - code: "S5-推送"
    name: "推送发送、接收与打开"
    definition: >-
      每条运营推送的发送、接收、打开与打开率，系统推送按类型的打开（FR-23，department-data-summary S5）。
      打开：push_opened（Story 3.2，前台 / 后台 / 冷启动点开推送都报，通知中心列表点击不报），push_type = 推送载荷 type
      （NotificationType 枚举名或 VET_REPLY；缺失为 unknown），运营推送另带 campaign_token = ops_notification_campaigns.public_token。
      agg_daily_push 按 WIB 日 × push_type × campaign_token（非运营推送为空串）记打开次数 opened_count、打开人数 opened_persons（按 D-10 归属到人去重）；
      agg_weekly_push / agg_monthly_push 的打开人数为周期内重新去重（D-12，不是日表相加），发送数 / 打开次数为周期内求和。
      运营推送（push_type = 'OPS_ANNOUNCEMENT'）：一条活动一行，planned_count = 开始发送时解析出的计划人数，
      recipient_count = 接收 = 写入通知中心人数（近似，见已知偏差）；campaign_opened_persons_cum = 从发送日到统计日的去重打开人数
      （只计发送后 analytics.rollup.push-campaign-days 天内，默认 14）。发送后 14 天内每天都有一行（当天没打开记 0），
      所以一条推送的打开率 = 该活动最新一行的 campaign_opened_persons_cum ÷ recipient_count，例：
      SELECT DISTINCT ON (campaign_token) campaign_token, campaign_opened_persons_cum::numeric / NULLIF(recipient_count, 0)
      FROM agg_daily_push WHERE push_type = 'OPS_ANNOUNCEMENT' AND campaign_token <> '' ORDER BY campaign_token, stat_date DESC。
      promotes_toko：活动跳转目标是否推广 Toko，规则同 S5（PRODUCT / CATEGORY / APP_PAGE=TOKO 为 true）。
      券过期推送（COUPON_EXPIRING）：发送数 sent_count = 服务端事件 toko_coupon_expiry_push_sent（source = 'SERVER'，确实推送时才上报）条数，
      每天必有一行（发送 0 次记 0）；打开率 = 打开人数 ÷ 发送数（每人每天至多一条，近似人数）。
      其他系统推送：没有发送记录（见下方 A13 勘察），只统计打开次数与打开人数，sent_count 为空。
      A13 / Q4 系统推送发送记录勘察（Story 4.4，按 V20261105_1620 重建的 ck_notifications_type 全集逐类核对）：
      ① 有发送记录：OPS_ANNOUNCEMENT —— ops_notification_campaigns.recipient_count（写入通知中心）/ failed_count（写入失败或推送重试 3 次仍失败）/
      planned_count，逐人同步推送结果只汇总为计数，关了「促销与活动」的人只进通知中心、人数不单独落库；
      COUPON_EXPIRING —— 服务端事件 toko_coupon_expiry_push_sent（确实推送才报）+ coupon_expiry_notify_log（每人每 WIB 日一行，含只进通知中心的人，可互相核对）。
      ② 只有「计划推送」去重标记（标记在投递之前写，不代表推送已发出，屏蔽 / 虚拟号 / 推送失败也有标记）：LIFECYCLE_D1 / LIFECYCLE_D3 / LIFECYCLE_D7 /
      LIFECYCLE_WINBACK（lifecycle_push_marks）；PET_BIRTHDAY / COMPANION_ANNIVERSARY / MILESTONE_NODE（scheduled_push_marks）；
      PET_DIARY_POSTED（pet_diary_notify_log，每个追更者每宠物每 WIB 日一行）。
      ③ 只有通知中心记录（notifications 行，写入即有，屏蔽推送 / 无推送权限 / 推送失败也有行）：VET_REPLY（问诊回复通知；
      另有 IM 会话消息本身的离线推送由腾讯 IM 发出，后端无任何记录，两者的 push_opened 都记 VET_REPLY）、CONSULT_CLOSED、CONTENT_LIKED、CONTENT_COMMENTED、
      CONTENT_MENTIONED、PET_FOLLOWED、USER_FOLLOWED、PLACE_COMMENTED、PET_GIFT_RECEIVED、GIFT_UNDELIVERED_REFUND、GROWTH_LEVEL_UP、
      PET_SLOT_EXPIRING、PET_SLOT_EXPIRED、CONTENT_REMOVED、REPORT_REVIEWED、CONTENT_REVIEW_APPROVED、CONTENT_REVIEW_REJECTED、
      CONTENT_REVIEW_TIMED_OUT、NAME_RESET、AVATAR_RESET、REFUND_REJECTED、TICKET_RESOLVED、CSAT_SURVEY、IDENTITY_REQUIRE_MODIFY、
      ACCOUNT_WARNED、ACCOUNT_SUSPENDED、SHOP_ORDER_SHIPPED、SHOP_ORDER_EXCEPTION、SHOP_RETURN_UPDATED、SHOP_ORDER_REORDERED、REPURCHASE_FOOD_LOW。
      MILESTONE_SM_NODE 只进通知中心、不发推送。
      ④ 无任何记录：NEW_CONSULT_REQUEST（只推兽医、不写通知中心，兽医按 Q5 排除）。
      推送投递（NotificationPusher → 腾讯 IM 离线推送）是 @Async 发完即弃，成功 / 失败只打日志、不落库。
      结论：除 OPS_ANNOUNCEMENT（接收近似）与 COUPON_EXPIRING（发送数）外，其余系统推送只统计打开数；②③ 的记录不能当作「推送已发出」。
    sources:
      - "events_detail：push_opened（push_type、campaign_token；source = 'APP'）"
      - "events_detail：toko_coupon_expiry_push_sent（source = 'SERVER'，券过期推送发送数）"
      - "业务库（窄查询）：ops_notification_campaigns(public_token, planned_count, recipient_count, target_type, target_value, COALESCE(started_at, scheduled_at, created_at))，status 不是 PENDING / CANCELED"
      - "汇总表：agg_daily_push / agg_weekly_push / agg_monthly_push（Story 4.4）"
    exclusions: >-
      只算生产数据、非可疑；按 v_events_person 归属到人之后只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）——
      兽医点开 VET_REPLY / NEW_CONSULT_REQUEST 推送也报 push_opened，在此排除（Story 3.2 复审 R4）。
      运营推送只算已开始发送的活动（status 不是 PENDING / CANCELED）；「发送时间」= COALESCE(started_at, scheduled_at, created_at)，
      与 OpsNotificationCampaignRepository 一致，换算成 WIB 日期。
    known_bias: >-
      运营推送接收数 recipient_count 是写入通知中心的人数，不是推送送达数：关了「促销与活动」推送的人、推送失败的人
      （failed_count 含推送重试 3 次仍失败）也计入，打开率偏低，口径为「近似」。planned_count 存量活动（V20261015_1209 之前）为空。
      活动发送 14 天（push-campaign-days）后的打开不计入累计打开人数；累计打开人数受明细保留期（约 3 个月）限制；
      该配置写错时累计打开人数停算（列为空）并 TECH 告警，日 / 周 / 月打开数不受影响。
      运营推送打开事件缺 campaign_token 的记在 campaign_token = '' 行，不归属到任何活动。
      没有发送记录的系统推送只有打开数（以上方 A13 勘察结论为准）；需要补发送记录的类型由 Dai 决定。
      同一条推送在 TIMPush 上是否可能回调两次未实测（Story 3.2），若有重复会使打开次数偏高，打开人数不受影响。
      promotes_toko 按计算时的配置判定；活动查不到为空。晚到超过 3 天的打开事件不回算日表（D-6），但仍会计入跟踪期内之后各天的累计打开人数。
      员工与测试账号按正常用户算；V1.5.0 之前没有自建数据。
    sql_path: analytics/rollup/push.sql
    changelog:
      - { date: "2026-11-13", change: "Story 4.4：新增；汇总落地 agg_daily/weekly/monthly_push，A13 / Q4 系统推送发送记录勘察结论写入本条" }
  - code: "电商#6"
    name: "Toko 分析漏斗"
    definition: >-
      团队原文：7 天内按顺序经过每一步的去重用户数：浏览 Toko 标签页（toko_page）→ 商品在列表中展示（toko_product_shown）
      → 浏览商品详情（toko_product_detail_viewed）→ 立即购买或加入购物车（toko_buy_now_tapped / toko_add_to_cart_tapped）
      → 提交订单（toko_order_submitted）→ 点击支付（toko_order_pay_tapped）→ 支付成功。转化率 = 某一步的用户数 ÷ 上一步的用户数。
      实际事件（Story 3.4 按代码核对）：
      第 1 步 PostHog 时期的 $screen = toko_page 改为 screen_viewed 且 screen = 'toko_page'（Story 2.4；电商 #4「打开 Toko 人数」与本步同源，电商 #4 条目建立时同步写此映射）；
      第 2 步 toko_product_shown（ShopProductCard 首次构建即报，页面级按 product_token + zone 去重）；
      第 3 步 toko_product_detail_viewed（详情页 initState，详情加载前）；
      第 4 步 toko_buy_now_tapped 或 toko_add_to_cart_tapped（规格弹层确认后、登录判断与请求之前）；
      第 5 步 toko_order_submitted（下单请求成功后）；
      第 6 步 toko_order_pay_tapped（进入支付）或 toko_order_payment_succeeded（纯 PawCoin / 零元单结算时直接结清、不经过 pay_tapped，由 Story 4.5 认作经过第 6 步）；
      第 7 步 支付成功 = 业务库 shop_orders.paid_at IS NOT NULL（D-13），经订单行的商品 / SKU token 与埋点关联（商品维度）；按人汇总的 agg_*_toko.funnel_s7_paid 按同一用户匹配、不经 token（Story 4.5，见已知偏差）。
      「按顺序」：同一人在 7 天窗口内各步首次发生时间单调不减；按人去重，WIB 自然日。
      商品维度：第 2–6 步都带商品 token —— 第 2–4 步顶层 product_token；第 5 步 items[].product_token（Story 3.4 补）；
      第 6 步 toko_order_pay_tapped 的 items[].product_token（Story 3.4：后端订单详情行新增 productToken / skuToken，App 随之上报）。第 1 步是页面级浏览，不适用商品维度。
    sources:
      - "events_detail：screen_viewed（screen = 'toko_page'）"
      - "events_detail：toko_product_shown / toko_product_detail_viewed / toko_buy_now_tapped / toko_add_to_cart_tapped（product_token）"
      - "events_detail：toko_order_submitted（items[].product_token、items[].sku_id）"
      - "events_detail：toko_order_pay_tapped（items[].product_token、items[].sku_id）/ toko_order_payment_succeeded（纯币单的第 6 步）"
      - "业务库：shop_orders.paid_at IS NOT NULL（支付成功，D-13；按 paid_at 的 WIB 日期归日，付款后退款 / 取消仍算已付款）"
    exclusions: >-
      只算生产数据（生产标记）；按人统计时只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
      toko_tab_viewed 不作为第 1 步（只在 TokoPageV3.initState 报一次，IndexedStack 保活后再进不报）。
      shop_product_masonry.dart 里的同名 toko_product_shown 上报所在组件无调用方（死代码），不影响数据。
    known_bias: >-
      ① 第 1 步：经 context.go('/shop') 进入 Toko 的路径（运营弹窗 / 推送目标 OpsAppPage.toko、购物车空态与订单列表「去逛逛」、
      详情页下架态「Ke Toko」、健康列表入口）走 StatefulShellRoute 切分支、不经点 Tab 上报；Story 2.4 已在 AppShell
      分支切换与外壳新挂载时补报 toko_page（按 Analytics.currentScreen 去重，同一次切换只报一次），自建口径不再因此偏低。
      残留：同一 Toko 分支内再 go('/shop') 不补报（PostHog 时期同样不报）；分支首次建出另有一条 screen = '/shop'（路径模板），
      第 1 步只认 screen = 'toko_page'，不要把 '/shop' 算进来。
      ② 第 2 步不是严格的「露出 > 50%」：卡片在惰性 sliver 里被构建即报，含视口外预构建的少量卡片，曝光数偏高。
      ③ 第 3 步在详情加载前报，商品已下架 / 加载失败也算一次浏览。
      ④ 第 4 步在请求前报，游客放弃登录、加购失败也算（即团队「点了加购」的口径，保持）。
      ⑤ 第 6 步 toko_order_pay_tapped = 进入支付次数：结算后 ?autopay=1 自动拉起支付面板也报（不是用户点击），重试、订单列表重新支付会再报；按人去重不影响人数。
      纯 PawCoin / 零元单不经过 pay_tapped，按上文改认 toko_order_payment_succeeded，否则漏斗在第 6 步不单调。
      ⑥ 旧后端未下发订单行 token、或 SKU 已被物理删除时，toko_order_pay_tapped 不带 items（按人计不受影响，只缺商品维度）；
      toko_order_submitted 的 product_token 取自结算页试算行，取不到时省略。
      汇总（Story 4.5，agg_daily_toko / agg_weekly_toko / agg_monthly_toko 的 funnel_s1_toko_page … funnel_s7_paid）：
      组 = 统计周期内（event_date）首次触发第 1 步的人，t1 = 其周期内最早一次；窗口 [t1, t1 + 7 天]（含两端）；
      第 k 步 = 窗口内、不早于第 k−1 步时间的第一条事件，跳步即止步（有第 3 步无第 2 步不算第 3 步），顺序颠倒不算；
      第 7 步 = 同一用户（按 v_events_person 归属后的用户）存在 paid_at ∈ [第 6 步时间, t1 + 7 天] 的已付款订单 ——
      汇总表按人计、不分商品，不经商品 / SKU token 关联（商品维度如需另算）；匿名人（从未登录）无法到达第 7 步。
      周表 / 月表的组 = 该周 / 该月内首次浏览的人，不是日组相加（D-12），周 / 月只在结束后计算。
      转化率现算：SELECT stat_date, funnel_s2_product_shown::numeric / NULLIF(funnel_s1_toko_page, 0) FROM agg_daily_toko …（逐步相除）。
      is_final = false 的行 7 天窗口未关闭，之后每天随回补刷新；每次运行回补最近 8 个 WIB 日（[昨天 − 7, 昨天]），晚到超过回补窗口的事件不再回算。
      退款 / 取消的订单仍算已付款（D-13）。V1.5.0 之前没有行为事件，新版覆盖率低时各步人数偏低（第 7 步来自业务库，但只在前 6 步都有事件的人里判定，同样偏低）。
    sql_path: analytics/rollup/toko.sql
    changelog:
      - { date: "2026-11-12", change: "Story 3.4：逐步核对触发时机；按代码修正：第 1 步 $screen=toko_page → screen_viewed 且 screen='toko_page'；第 6 步纯币单改认 toko_order_payment_succeeded；toko_order_submitted 与 toko_order_pay_tapped 的 items[] 补 product_token（后端订单详情行加 productToken / skuToken）" }
      - { date: "2026-11-12", change: "Story 4.5：汇总落地 agg_daily/weekly/monthly_toko（toko.sql）；第 6 步合并 toko_order_payment_succeeded（纯 PawCoin / 零元单）为对团队定义的口径补充，需告知电商团队；第 7 步按用户匹配业务库已付款订单" }
  - code: "电商#4"
    name: "打开 Toko 的去重用户数"
    definition: >-
      统计周期内有 screen_viewed 且 screen = 'toko_page' 的去重人数（PostHog 时期的 $screen = toko_page，Story 2.4 改名）。
      按 WIB 自然日 / 周（周一至周日）/ 自然月分别去重：agg_daily_toko / agg_weekly_toko / agg_monthly_toko 的 toko_viewers
      （周 / 月在周期内重新去重，不是日表相加，D-12）。与电商 #6 第 1 步同源，toko_viewers = funnel_s1_toko_page。
    sources:
      - "events_detail：screen_viewed（screen = 'toko_page'；分支首次打开多出的 screen = '/shop' 不计入）"
      - "汇总表：agg_daily_toko / agg_weekly_toko / agg_monthly_toko.toko_viewers（Story 4.5）"
    exclusions: >-
      只算生产数据、非可疑、source = 'APP'；按 v_events_person 归属到人之后只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
    known_bias: >-
      按「人」去重（D-10）：登录前的匿名浏览按关联表归到账号；从未登录的设备按匿名 id 算一人，卸载重装算两人。
      进入方式残留偏差同电商 #6 第 1 步（同一 Toko 分支内再 go('/shop') 不补报）。
      V1.5.0 之前没有自建数据，新版覆盖率低时偏低。周 / 月只在结束后计算；每次运行回补最近 8 个 WIB 日，晚到超过回补窗口的事件不再回算。
      员工与测试账号按正常用户算。
    sql_path: analytics/rollup/toko.sql
    changelog:
      - { date: "2026-11-12", change: "Story 4.5：新增；汇总落地 agg_daily/weekly/monthly_toko.toko_viewers" }
  - code: "电商#5"
    name: "加购 → 支付订单转化率"
    definition: >-
      统计周期内有 toko_add_to_cart_tapped 的去重人数（atc_users，同时就是电商 #7 的「加购的用户数」）中，
      存在某次周期内加购（时刻 t）且同一用户有 paid_at ∈ [t, t + 7 天] 的 Toko 已付款订单的人数（atc_converted_users）。
      不要求订单含该商品（团队定义）。按 WIB 自然日 / 周 / 月分别去重（D-12），写在 agg_daily_toko / agg_weekly_toko / agg_monthly_toko。
      转化率不落表，现算：SELECT stat_date, atc_converted_users::numeric / NULLIF(atc_users, 0) FROM agg_daily_toko ORDER BY stat_date;
      比率类月指标若取「每日比率平均」由日表现算。
    sources:
      - "events_detail：toko_add_to_cart_tapped"
      - "业务库：shop_orders.paid_at IS NOT NULL（D-13；按用户窄查询，经埋点库临时表匹配，不跨库）"
      - "汇总表：agg_daily_toko / agg_weekly_toko / agg_monthly_toko 的 atc_users、atc_converted_users（Story 4.5）"
    exclusions: >-
      只算生产数据、非可疑、source = 'APP'；按 v_events_person 归属到人之后只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
    known_bias: >-
      加购事件在请求前上报，游客放弃登录、加购失败也算加购（团队「点了加购」口径）；从未登录的匿名人无法匹配订单，只进分母。
      退款 / 取消的订单仍算已付款（D-13）。is_final = false 的行 7 天窗口未关闭；每次运行回补最近 8 个 WIB 日，晚到超过回补窗口的事件不再回算。
      V1.5.0 之前没有行为事件，新版覆盖率低时分母偏低。员工与测试账号按正常用户算。
    sql_path: analytics/rollup/toko.sql
    changelog:
      - { date: "2026-11-12", change: "Story 4.5：新增；汇总落地 agg_daily/weekly/monthly_toko.atc_users / atc_converted_users" }
  - code: "产品#2"
    name: "Toko 支付成功率"
    definition: >-
      已付款订单数 ÷ 已提交订单数，按 WIB 自然日 / 周 / 月（agg_daily_toko / agg_weekly_toko / agg_monthly_toko）：
      分母 orders_submitted = 周期内 toko_order_submitted 事件条数（建单成功后才上报，一次建单一条，不去重人）；
      分子 orders_paid = 业务库 shop_orders.paid_at 的 WIB 日期落在周期内的订单数（D-13，下单人 USER + REAL；同时是电商 #1 的已付款订单数）。
      参照列 orders_created_biz = 业务库 created_at 落在周期内的订单数（下单人 USER + REAL）。
      现算：SELECT stat_date, orders_paid::numeric / NULLIF(orders_submitted, 0) FROM agg_daily_toko ORDER BY stat_date;
    sources:
      - "events_detail：toko_order_submitted（分母）"
      - "业务库：shop_orders.paid_at IS NOT NULL（分子）、shop_orders.created_at（参照列）；JOIN users 只算 role = 'USER' 且 account_type = 'REAL'"
      - "汇总表：agg_daily_toko / agg_weekly_toko / agg_monthly_toko 的 orders_submitted、orders_paid、orders_created_biz（Story 4.5）"
    exclusions: >-
      分母：只算生产数据、非可疑、source = 'APP'，按 v_events_person 归属到人之后排除非 USER / 非 REAL 用户。
      分子与参照列：业务库直接按下单人 users.role = 'USER' 且 account_type = 'REAL' 过滤。
    known_bias: >-
      分母只来自 V1.5.0+ 且生产标记的设备，分子覆盖所有版本：新版覆盖率低时比值偏高（可能 > 1）。
      覆盖率未达 90% 前可用 orders_paid ÷ orders_created_biz 作参照。
      分子按付款日归日、分母按提交日归日，跨日付款的订单两者落在不同日期；退款 / 取消的订单仍算已付款（D-13）。
      每次运行回补最近 8 个 WIB 日，晚到超过回补窗口的提交事件不再回算。
    sql_path: analytics/rollup/toko.sql
    changelog:
      - { date: "2026-11-12", change: "Story 4.5：新增；汇总落地 agg_daily/weekly/monthly_toko.orders_submitted / orders_paid / orders_created_biz" }
  - code: "产品#1"
    name: "安装后创建宠物档案的比例"
    definition: >-
      团队原文：有 pet_profile_create_submitted 的去重用户数 ÷ 有 Application Installed 的去重用户数（S2），同一个月。
      按代码修正（D-13，Dai 2026-11-12 拍板）：分子改为当月新装人（分母里的人）中当月有 pet_added（建档请求成功后才上报）的去重人数；
      pet_profile_create_submitted 保留但不用于本指标（点击即报，建档请求失败也会报）。按 WIB 自然月。
    sources:
      - "events_detail：pet_added（分子，建档成功；属性 pet_index、slot_source）"
      - "events_detail：Application Installed（分母，同 S2）"
    exclusions: >-
      只算生产数据（生产标记）；按人统计时只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
      汇总（Story 4.3）：is_production、NOT is_suspicious、source = 'APP'，按 v_events_person 归属到人之后排除非 USER / 非 REAL 用户
      （匿名安装经关联表归到兽医 / 虚拟号的也排除）。
    known_bias: >-
      汇总表 agg_monthly_install_profile（按 WIB 自然月，stat_month = 当月 1 日）：
      new_installs = 首次 Application Installed 落在当月的去重人数（口径同 S2；同一次计算时等于当月 agg_daily_install all 行 new_installs 之和，但日表只在 3 天内回补，之后身份关联变化（匿名安装后来归到已装过的老用户）会让二者略有差异）；
      with_pet_profile = 其中当月（event_date 在本月内）有 pet_added 的人数（Dai 2026-11-12 拍板：分子取当月新装人中建档成功的人，
      不再是「当月有建档事件的全部去重用户」）。不要求建档晚于安装，只要求同月；月末安装、次月建档不计入。
      比例现算：SELECT stat_month, with_pet_profile::numeric / NULLIF(new_installs, 0) FROM agg_monthly_install_profile ORDER BY stat_month;
      is_complete = false 的行是月中「截至昨天」的值；月末次日起写终值，之后 3 天内随回补再刷新，晚到超过 3 天不回算（D-6）。
      第 2 只及以后的宠物也会报 pet_added，按去重人数计不影响；如需「首只」可取 pet_index = 1。
      卸载重装算新装；「首次」只能在明细保留期（约 3 个月）内判断；员工与测试账号按正常用户算。
      V1.5.0 之前没有自建数据（旧版升级上来的设备报 Application Updated，不算新装）。
    sql_path: analytics/rollup/install_profile.sql
    changelog:
      - { date: "2026-11-12", change: "Story 3.4：按代码修正：分子由 pet_profile_create_submitted（点击即报，失败也算）改为 pet_added（建档成功后上报），D-13；需告知产品团队" }
      - { date: "2026-11-13", change: "Story 4.3：落地 agg_monthly_install_profile（install_profile.sql）；分子按 Dai 拍板改为当月新装人中当月有 pet_added 的人数（原「分子不要求来自当月安装的人」作废）；需告知产品团队" }
  - code: "产品#5"
    name: "新用户 W1 留存"
    definition: >-
      团队原文：完成新手引导后，在引导完成后第 7–13 天中任意一天再次打开 App（Application Opened）的用户比例。
      锚点 = 该用户首次 onboarding_completed 的时刻（WIB 日期）；分子 = 锚点后第 7–13 天任一天有 Application Opened 的人。
      Story 3.4 起 onboarding_completed 在养宠状态更新请求成功后才上报（D-13，Dai 2026-11-12 拍板），失败不报。
    sources:
      - "events_detail：onboarding_completed（锚点，首次；属性 pet_status）"
      - "events_detail：Application Opened（回访）"
    exclusions: >-
      只算生产数据（生产标记）；按人统计时只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）。
    known_bias: >-
      唯一触发点是引导流最后一步（pet_status_page）。Story 3.4 之前的 App 版本点击即报（请求失败、失败后放弃的人也算完成引导，重试会多报），
      自建库只收新版 App 事件，因此自建口径不含这部分；与 PostHog 时期数据对比时，PostHog 侧略偏高。
      生效日期：「请求成功后才上报」随 Story 3.4 所在的 App 版本（V1.5.0）上线之日起生效；该日之前进入自建库的 onboarding_completed（如测试包）含「请求失败也上报」的偏差。
      汇总表 agg_cohort_retention（cohort_type = 'ONBOARDING'，cohort_date = 组日期 Y）：cohort_size = 首次 onboarding_completed 恰在 Y 的人数，
      w1_retained = 其中在 [Y+7, Y+13] 任意一天有 Application Opened 的人数；Y+13 晚于计算基准日（WIB 昨天）时为空。
      「首次」只在明细保留期内判断：同一人重装后再走一次引导，只按第一次分组。
      周值（当周每日组按组人数加权平均，只算已满 13 天的组），现算不入库：
      SELECT sum(w1_retained)::numeric / NULLIF(sum(cohort_size), 0) FROM agg_cohort_retention
      WHERE cohort_type = 'ONBOARDING' AND cohort_date BETWEEN :week_monday AND :week_monday + 6 AND w1_retained IS NOT NULL;
      Application Opened 冷启动和回前台都会报，当天有一次即算打开；员工与测试账号按正常用户算；
      每次汇总回补最近 16 天的组（13 天观察 + 3 天晚到），晚到超过 3 天不回算（D-6）；V1.5.0 之前无数据，上线后前 13 天的组 W1 不完整。
    sql_path: analytics/rollup/retention.sql
    changelog:
      - { date: "2026-11-12", change: "Story 3.4：按代码修正：onboarding_completed 改为请求成功后上报、失败不报（D-13）；锚点取首次 onboarding_completed；需告知产品团队" }
      - { date: "2026-11-13", change: "Story 4.3：落地 agg_cohort_retention（ONBOARDING 组，retention.sql）；补按周加权现算 SQL 与已知偏差" }
  - code: "市场#1"
