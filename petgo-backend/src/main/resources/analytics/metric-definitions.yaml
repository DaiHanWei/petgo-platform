      - "汇总表：agg_cohort_retention（cohort_type = 'INSTALL'：cohort_size、d1_retained）"
    exclusions: >-
      只算生产数据、非可疑、source = 'APP'；只算 users.role = 'USER' 且 account_type = 'REAL'（Q5）：按 v_events_person 归属到人之后排除，匿名事件经关联表归到兽医 / 虚拟号的也排除。
    known_bias: >-
      组人数与 S2 同口径（同一次计算时 = agg_daily_install all 行同日 new_installs；本表回补 16 天、日表只回补 3 天，晚到 4–15 天的安装事件或身份关联会让二者略有差异）。d1_retained 为空 = 未满 1 天（X+1 晚于计算基准日 WIB 昨天）。
