# 事件清单（analytics-pipeline Story 1.2，架构 D-7）—— 埋点事件的唯一来源。
#
# 用途：
#   - 明细层只保留这里登记过的属性键（D-4）；未登记的事件照样进原始层，标 unknown_event、不进明细。
#   - 注销擦除时删掉 user_identifier: true 的属性键（A10）。
#   - 后端启动时同步进埋点库 event_catalog 表，供 AI 查数理解事件含义（表是本文件的投影）。
#
# 规则：
#   - 新增事件三步：在本文件登记 → 加 Dart 事件常量 → 比对测试变绿。
#   - 事件下线把 status 改成 RETIRED，不要删条目（删了表里的行也会被删，历史数据就没了注释）。
#   - 事件名原样；只有 3 个生命周期事件用 Segment 写法（带空格、首字母大写），其余 snake_case。
#   - 属性一律 snake_case；只登记经 Analytics.scrub() 之后仍会上报的键。
#   - 名字是 on / off / yes / no / true / false 这类词时必须加引号（yaml 1.1 会把它们解析成布尔，加载会报错）。
#   - 凡属性值是某个用户的内部 id / 公开 token / 哈希（不论本人还是对方），标 user_identifier: true。宁可多标。
#   - 格式约定（App 侧 Story 2.6 的比对测试按行解析，不要改写法）：
#       每个事件首行 `  - name: <事件名>`；属性一律单行 `      - { name: ..., type: ..., description: ... }`。
#   - 按 domain 分组、组内按事件名排序。
#   - source: APP | SERVER | H5；status: ACTIVE | PLANNED | RETIRED；
#     type: string | int | number | bool | list | map。
version: 1
events:

  # ======== app (12)
  - name: "Application Installed"
    source: APP
    status: PLANNED
    domain: app
    description: "新装首启（Story 2.3）：既无自建安装标记、也无旧版本地数据时发"
    properties:
      - { name: version, type: string, description: "App 版本号（PackageInfo.version）" }
      - { name: build, type: string, description: "App 构建号（PackageInfo.buildNumber）" }
  - name: "Application Opened"
    source: APP
    status: PLANNED
    domain: app
    description: "冷启动或每次回到前台（Story 2.3）；静默推送唤醒不报"
