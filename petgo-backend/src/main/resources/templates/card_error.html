<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex,nofollow"/>
    <title>TailTopia</title>

    <!--/* 加载失败页（V1.1.6 Story 1.3 新增，视觉稿 E4）。此前**根本没有这个模板** ——
         服务端异常时访客看到的是 Spring 的默认错误页。

         ⚠️ **与失效页（card_gone）的语义必须分清**：
           · card_gone = **终局**：档案没了，重试多少次都一样 → 按钮是「去逛别的」
           · 本页      = **暂时**：网络/服务异常，等会儿可能就好 → 按钮是「再试一次」
         两者不可共用一套文案或按钮。

         本页由 shared/error/H5ErrorController 渲染，且**只对 /p/ 与 /m/ 两条 H5 链路生效**；
         API 与运营后台的错误响应一律不受影响（见该控制器注释）。 */-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --v:#845EC9; --v3:#6C48AE; --vt:#F8F2FF;
            --ink:#2E2A45; --ink2:#544864; --muted:#9690A6;
            --paper:#FFFCF4;
            --font:'Poppins',system-ui,sans-serif;
            --display:'Archivo','Poppins',system-ui,sans-serif;
            --hand:'Caveat',cursive;
        }
        * { box-sizing:border-box; }
        html, body { margin:0; padding:0; height:100%; }
        body { background:var(--paper); color:var(--ink); font-family:var(--font);
            line-height:1.5; -webkit-font-smoothing:antialiased; }

        .paper { min-height:100%; max-width:440px; margin:0 auto;
            padding:14px 16px calc(96px + env(safe-area-inset-bottom, 0px));
            display:flex; flex-direction:column; }
        .top { margin-bottom:6px; }
        .top .mark { height:22px; display:block; opacity:.9; }

        .state { flex:1; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:0 30px 84px; text-align:center; }

        .blank { width:186px; margin:0 auto; background:#fff; padding:10px 10px 0;
            border-radius:5px; transform:rotate(-2.4deg);
            box-shadow:0 1px 2px rgba(46,42,69,.10), 0 6px 14px rgba(46,42,69,.1),
                0 18px 34px rgba(46,42,69,.09); }
        .blank .ph { width:166px; height:166px; border-radius:1px; background:#EFEBF5;
            outline:1px solid rgba(0,0,0,.1); outline-offset:-1px;
            display:flex; align-items:center; justify-content:center; }
        .blank .cp { font-family:var(--hand); font-size:18px; color:#B7AECA;
            text-align:center; padding:8px 2px 13px; }

        .stitle { font-family:var(--display); font-variation-settings:'wdth' 104,'wght' 800;
            font-size:23px; line-height:1.18; letter-spacing:-.015em; color:var(--ink);
            margin-top:26px; text-wrap:balance; }
        .ssub { font-size:13px; line-height:1.6; color:var(--ink2); margin-top:10px; text-wrap:pretty; }

        .ctabar { position:fixed; left:0; right:0; bottom:0; z-index:20;
            padding:26px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            background:linear-gradient(to top, var(--paper) 46%, rgba(255,252,244,.92) 68%, rgba(255,252,244,0)); }
        .ctainner { max-width:440px; margin:0 auto; text-align:center; }
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto;
            border:none; border-radius:999px; height:50px; padding:0 30px; font-size:14.5px;
            font-weight:700; font-family:var(--font); cursor:pointer; white-space:nowrap;
            background:var(--vt); color:var(--v3);
            box-shadow:0 1px 2px rgba(108,72,174,.08), 0 4px 12px rgba(108,72,174,.12),
                0 12px 24px rgba(108,72,174,.08);
            transition:scale 180ms cubic-bezier(.2,0,0,1); }
        .btn:active { scale:.96; }

        @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
    </style>
</head>
<body>
<div class="paper">
    <div class="top"><img class="mark" src="/brand/logo.svg" alt="TailTopia"/></div>

    <div class="state">
        <div class="blank">
            <div class="ph">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#BDB2D0"
                     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/>
                    <path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.52"/>
                    <path d="M2 8.82a15 15 0 0 1 4.18-2.64"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/>
                    <path d="m2 2 20 20"/>
                </svg>
            </div>
            <div class="cp">belum muncul&hellip;</div>
        </div>
        <div class="stitle">Gagal memuat<br/>halaman</div>
        <div class="ssub">Periksa koneksi internetmu, lalu coba lagi.</div>
    </div>
</div>

<div class="ctabar">
    <div class="ctainner">
        <button class="btn" id="retryBtn" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6C48AE"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
            </svg>
            Coba lagi
        </button>
    </div>
</div>

<script th:inline="none">
  // Retry = re-request the SAME url the visitor came for, not the home page.
  // location.reload() would re-issue the failed request; use replace() so the
  // failed attempt does not pile up in history.
  document.getElementById('retryBtn').addEventListener('click', function () {
    window.location.replace(window.location.href);
  });
</script>
</body>
</html>
