<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <!-- 分享页对外但不进搜索引擎索引（与名片 /p、里程碑 /m 同范式，强制 noindex） -->
    <meta name="robots" content="noindex,nofollow"/>
    <title th:text="${ogTitle}">TailTopia</title>

    <!-- Open Graph：仅标题/描述，**无图** —— 沿用名片与里程碑两页的既有边界，
         不把宠物图交给第三方抓取与缓存。 -->
    <meta property="og:type" content="article"/>
    <meta property="og:title" th:content="${ogTitle}"/>
    <meta property="og:description" th:content="${body}"/>
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" th:content="${ogTitle}"/>
    <meta name="twitter:description" th:content="${body}"/>

    <style>
        :root { --ink: #2E2A45; --ink2: #544864; --muted: #9690A6; --violet: #845EC9; --tint: #F8F2FF; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
            background: var(--tint); color: var(--ink);
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
        }
        .wrap { width: 100%; max-width: 480px; padding: 20px 16px 108px; }
        .brand { height: 22px; margin-bottom: 14px; }
        .card { background: #fff; border-radius: 18px; overflow: hidden;
                box-shadow: 0 8px 24px rgba(46,42,69,.10); }
        .pad { padding: 16px; }
        .author { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
                  background: var(--violet); color: #fff; display: flex; align-items: center;
                  justify-content: center; font-weight: 700; flex: none; }
        .name { font-size: 14px; font-weight: 700; }
        .date { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
        .chip { margin-left: auto; font-size: 11px; font-weight: 700; padding: 4px 9px;
                border-radius: 8px; background: var(--tint); flex: none; }
        .body { font-size: 15px; line-height: 1.6; margin-top: 12px; white-space: pre-wrap;
                word-break: break-word; }
        .shot { width: 100%; display: block; }
        .shots img + img { margin-top: 2px; }
        .cta {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
            width: calc(100% - 32px); max-width: 448px;
            display: block; text-align: center; text-decoration: none;
            background: var(--violet); color: #fff; font-size: 15px; font-weight: 700;
            padding: 15px 18px; border-radius: 14px;
            box-shadow: 0 8px 22px rgba(132,94,201,.34);
        }
        .note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 14px; }
    </style>
</head>
<body>
<!-- 🛡 本页只有这一条内容。**不放**任何通往该宠物档案 / 作者主页 / 其它内容的链接
     —— 单条分享就是单条（AD-15 Rule 5）。唯一的出口是底部「下载 App」。 -->
<div class="wrap">
    <img class="brand" src="/brand/wordmark_brand.svg" alt="TailTopia"/>

    <div class="card">
        <div class="shots" th:if="${hasImages}">
            <img class="shot" th:each="img : ${images}" th:src="${img}" alt=""/>
        </div>
        <div class="pad">
            <div class="author">
                <img class="avatar" th:if="${hasAvatar}" th:src="${authorAvatarUrl}" alt=""/>
                <div class="avatar" th:unless="${hasAvatar}">🐾</div>
                <div>
                    <div class="name" th:text="${authorName}">—</div>
                    <div class="date" th:text="${dateLabel}">—</div>
                </div>
                <div class="chip" th:text="${typeLabel}" th:style="'color:' + ${typeColor}">—</div>
            </div>
            <div class="body" th:if="${hasBody}" th:text="${body}">—</div>
        </div>
    </div>

    <div class="note">Dibagikan dari TailTopia 🐾</div>
</div>

<a class="cta" id="downloadCta" th:href="${downloadUrl}"
   th:attr="data-ios=${iosUrl},data-android=${androidUrl},data-deeplink=${deepLink}"
   th:text="${downloadCta}">Download</a>

<script>
    // 唤起链：先试深链把已装 App 的人送进站内，没唤起成功再落应用商店。
    //
    // 🔴 Bug 20260910-487（2026-09-11 修）：此前本页只做「iOS→App Store / Android→Play」的
    //    平台分流，**从不尝试唤起 App** —— 装了 App 的人点分享链接一律被送去商店，
    //    永远进不了站内那一条内容。名片页（card.html）一直有这条链，本页漏了。
    //
    // 🛡 判「唤起成功」用的是 pagehide，不是计时器猜：App 接管时页面会隐藏，
    //    这是名片页已经跑通的同一个信号，**不要在这里另发明一套时序**，两套迟早对不上。
    (function () {
        var el = document.getElementById('downloadCta');
        if (!el) { return; }
        var ua = navigator.userAgent || '';
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);

        // 桌面：没有 App 可唤起，保持默认下载页，连监听都不挂。
        if (!isIOS && !isAndroid) { return; }

        function go(url) { window.location.href = url; }
        function guard(fn, ms) {
            var t = setTimeout(fn, ms);
            window.addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
            return t;
        }
        // 安卓唤起用 intent://，由系统决定"唤起还是兜底"，不靠页面自己掐表。
        // fallback 必须是 http(s)（Chrome 的硬性要求），所以给 Play 网页地址而不是 market://。
        function toIntent(deep, fallbackWeb) {
            var rest = deep.replace(/^tailtopia:\/\//, '');
            return 'intent://' + rest + '#Intent;scheme=tailtopia;package=com.tailtopia.app;'
                 + 'S.browser_fallback_url=' + encodeURIComponent(fallbackWeb) + ';end';
        }

        el.addEventListener('click', function (e) {
            var deep = el.dataset.deeplink;
            var ios = el.dataset.ios;
            var androidWeb = el.dataset.android;
            // 没有深链可用（理论上不会）→ 退回原来的平台分流，别把按钮点成死的。
            if (!deep) {
                if (isIOS && ios) { el.href = ios; }
                else if (isAndroid && androidWeb) { el.href = androidWeb; }
                return;
            }
            e.preventDefault();

            // 🔴 安卓走 intent:// 而不是直接 go(deep)（2026-09-11）。
            //
            // `tailtopia://post` 的 intent-filter 是**本次**才加进 AndroidManifest 的 ——
            // 已装老版本 App 的人系统根本不认这个 scheme。而分享链接在印尼大量是从
            // WhatsApp / Instagram 的内置 WebView 点开的，那些 WebView 遇到未知 scheme
            // 会直接跳 ERR_UNKNOWN_URL_SCHEME 错误页：**页面一被替换，下面的兜底定时器
            // 跟着死**，用户停在报错页 —— 比修复前"一律去商店"更糟。
            //
            // intent:// 把这件事交给 Android 系统：装了新版→唤起；老版本或没装→走
            // browser_fallback_url。所以这一支**不需要**自己的定时器，也不该有。
            if (isAndroid) {
                go(toIntent(deep, androidWeb));
                return;
            }
            guard(function () { go(ios); }, 900);
            go(deep);
        });
    })();
</script>
</body>
</html>
