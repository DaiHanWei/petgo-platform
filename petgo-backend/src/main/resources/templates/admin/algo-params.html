<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.algo.title}">算法参数 · TailTopia 运营后台</title>
    <!-- ⚠️ 每个页面自己带样式表与 i18n 标题：th:replace 用的是外层文档的 head，layout 片段不会替你补。 -->
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <!-- 模板 D 配置卡（dirty / diff 确认 / 422 红边）与变更记录抽屉（admin-drawer.js，[data-drawer-open] 入口） -->
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<!--/* D3「算法参数」独立页（2026-08-26 产品决定，原属 Story 16.4 的运营配置页一块）→ V1.3.0 Story 6.4 套模板 D（AD-11 / D-10）：
     单卡「算法参数」14 项一行一项两栏排布（PRD 写 11 项，以代码 14 个输入为准），保存 = 确认弹层复述改前改后（6.3 同款三态）、校验错误行内；
     页尾常驻变更表删除 → 页头「变更记录」按钮开抽屉（fragments/drawer-algo-changes.html，按参数 / 时间段筛选，每页 20）。
     🔴 从「运营配置」搬出来单独成页，是因为它是打分公式内部参数，改了之后没有任何机制能判定对错（无 A/B 实验基建）。
     🛡 权限独立（config.algo_param_view / _edit），不给运营，留给产品做校准；POST /admin/algo-params 与全部校验不变。 */-->
<div th:replace="~{admin/layout :: page(~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
    <div class="banner err" th:if="${error}" th:text="${error}">err</div>

    <div class="wb-title-row">
        <h1 th:text="#{admin.algo.title}">算法参数</h1>
        <button type="button" class="btn btn-neutral btn-sm" th:attr="data-drawer-open=@{/admin/algo-params/changes/drawer}" data-drawer-res="algo"
                th:text="#{admin.algo.changelog}">变更记录</button>
    </div>
    <!-- ⚠️ utext（不转义）：文案里带 <b>。HTML 模板里的文案不要写 Markdown 的 `**`。 -->
    <p class="hint" data-notice="algo-not-for-ops" th:utext="#{admin.algo.notForOps}">
      这一页是首页推荐打分公式的内部参数，留给产品做校准。运营日常要用的顶置、打标、限流处置在各自的页面。</p>

    <!--/* card 也是 htmx 保存成功的返回 fragment（:: saved = card + toast oob，HX-Retarget #cfg-algo 原位替换） */-->
    <th:block th:fragment="card" th:with="action=@{/admin/algo-params},hxPost=@{/admin/algo-params},cardId='cfg-algo',confirmDiff=true,
                       canEdit=${#authorization.expression('hasRole(''SUPER_ADMIN'') or hasAuthority(''config.algo_param_edit'')')},
                       readonly=${!#authorization.expression('hasRole(''SUPER_ADMIN'') or hasAuthority(''config.algo_param_edit'')')},
                       readonlyNote=#{admin.v130.config.readonly(#{perm.config.algo_param_edit})}">
      <div th:replace="~{admin/fragments/tpl-d-config-card :: configCard(~{::algo-title}, ~{::algo-form}, #{admin.algo.save})}">
        <span th:fragment="algo-title" th:text="#{admin.algo.section.feedRank}">算法参数</span>
        <div th:fragment="algo-form" data-section="feed-rank">
          <p class="muted" data-notice="feed-rank-why" th:utext="#{admin.algo.why}">⚠️ 这些参数<b>第一次校准必然在发版之后</b>。</p>
          <!-- 🔴 没有 A/B 实验基建时，「谁在什么时候改了什么」是唯一能与指标漂移对上的锚点。 -->
          <p class="muted" data-notice="algo-no-ab" th:utext="#{admin.algo.noAbTest}">⚠️ 本平台没有 A/B 实验基建。</p>
          <p class="muted" data-notice="p95-dynamic">
            <b th:text="#{admin.algo.p95}">互动量 95 分位（P95）</b>:
            <span th:text="${feedRank.interactionP95}">0</span>
            <span th:utext="#{admin.algo.p95Note}">系统每 6 小时自动重算，不是手填项。</span>
            <span th:text="#{admin.algo.p95LastRun}">上次重算</span>:
            <span th:text="${feedRank.p95RecomputedAt} != null ? ${@adminTime.wib(feedRank.p95RecomputedAt)} : #{admin.algo.p95Never}">-</span>
          </p>

          <!-- AC2：14 项一行一项、两栏排布填满卡宽（.cfg-grid-2） -->
          <div class="cfg-grid-2">
            <label class="field"><span th:text="#{admin.algo.freshnessWeight}">新鲜度权重（默认 0.6）</span>
              <input class="inp field-full" type="number" step="0.01" min="0" name="freshnessWeight" th:value="${feedRank.freshnessWeight}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.interactionWeight}">互动度权重（默认 0.4）</span>
              <input class="inp field-full" type="number" step="0.01" min="0" name="interactionWeight" th:value="${feedRank.interactionWeight}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.commentWeight}">评论权重（相对点赞，默认 2）</span>
              <input class="inp field-full" type="number" step="0.1" min="0" name="commentWeight" th:value="${feedRank.commentWeight}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.exposureDecay}">曝光衰减（0–1，默认 0.3）</span>
              <input class="inp field-full" type="number" step="0.05" min="0" max="1" name="exposureDecay" th:value="${feedRank.exposureDecay}" th:disabled="${!canEdit}"/></label>
            <!-- 刷新抖动（2026-09-01 产品拍板「下拉刷新要明显换一批」）：0=关闭回到纯分数排序。 -->
            <label class="field"><span th:text="#{admin.algo.shuffleStrength}">刷新抖动幅度（0–1，默认 0.8；0=关闭）</span>
              <input class="inp field-full" type="number" step="0.05" min="0" max="1" name="shuffleStrength" th:value="${feedRank.shuffleStrength}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.throttleFactor}">限流系数（0–1 两端不取，默认 0.2）</span>
              <input class="inp field-full" type="number" step="0.05" min="0.05" max="0.95" name="throttleFactor" th:value="${feedRank.throttleFactor}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.seenWindowDays}">曝光窗口（天，默认 7）</span>
              <input class="inp field-full" type="number" min="1" name="seenWindowDays" th:value="${feedRank.seenWindowDays}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.windowSize}">配比窗口（条，默认 10）</span>
              <input class="inp field-full" type="number" min="2" name="windowSize" th:value="${feedRank.windowSize}" th:disabled="${!canEdit}"/></label>
            <!-- 两组配比说明放在配比行之前（占满整行） -->
            <p class="hint cfg-grid-full" data-notice="quota-sum" th:utext="#{admin.algo.quotaNote}">🛡 两组配比各自之和必须等于窗口大小。</p>
            <label class="field"><span th:text="#{admin.algo.attrFunQuota}">属性配比 · 趣味（默认 5）</span>
              <input class="inp field-full" type="number" min="0" name="attrFunQuota" th:value="${feedRank.attrFunQuota}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.attrEduQuota}">属性配比 · 科普（默认 3）</span>
              <input class="inp field-full" type="number" min="0" name="attrEduQuota" th:value="${feedRank.attrEduQuota}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.attrLifeQuota}">属性配比 · 生活记录（默认 2）</span>
              <input class="inp field-full" type="number" min="0" name="attrLifeQuota" th:value="${feedRank.attrLifeQuota}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.speciesMainQuota}">物种配比 · 主物种（默认 6）</span>
              <input class="inp field-full" type="number" min="0" name="speciesMainQuota" th:value="${feedRank.speciesMainQuota}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.speciesOtherQuota}">物种配比 · 其他物种（默认 2）</span>
              <input class="inp field-full" type="number" min="0" name="speciesOtherQuota" th:value="${feedRank.speciesOtherQuota}" th:disabled="${!canEdit}"/></label>
            <label class="field"><span th:text="#{admin.algo.speciesGeneralQuota}">物种配比 · 通用（默认 2）</span>
              <input class="inp field-full" type="number" min="0" name="speciesGeneralQuota" th:value="${feedRank.speciesGeneralQuota}" th:disabled="${!canEdit}"/></label>
            <!-- AC1：右栏底部「不对普通运营开放 / 生效范围」提醒（占右栏一格，紧跟 14 项之后） -->
            <p class="hint cfg-grid-right" data-notice="algo-scope" th:utext="#{admin.v130.algo.scope}">🛡 不对普通运营开放；改这里无需发版，下一次刷新即生效。</p>
          </div>
          <p class="hint" data-notice="throttle-factor" th:utext="#{admin.algo.throttleNote}">🛡 限流系数是被限流内容在打分时乘的那个数。</p>
        </div>
      </div>
    </th:block>

    <th:block th:fragment="saved">
        <th:block th:replace="~{admin/algo-params :: card}"></th:block>
        <div class="toast" role="status" hx-swap-oob="beforeend:#admin-toast-host" th:text="${toast}">已保存</div>
    </th:block>

    <!-- 变更记录抽屉（AC3）：admin-drawer.js 的 [data-drawer-open] 按钮式入口装进 #algo-drawer .drawer-body -->
    <div th:replace="~{admin/fragments/tpl-shared :: drawer('algo', ~{::algo-drawer-title})}">
        <span th:fragment="algo-drawer-title" th:text="#{admin.v130.algo.drawer.title}">变更记录</span>
    </div>
  </div>
</div>
</body>
</html>
