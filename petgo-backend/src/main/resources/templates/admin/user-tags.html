<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  用户标签管理（V1.1.6 Story 11.3 · AB-12A → V1.3.0 Story 8.2 套模板 B · tpl-b-list，UI 稿 3-7～3-11）。
  🔴 「同时只展示 3 个、按分配时间倒序」的实现在 App 侧的 UserTagQueryService，
     分配记录里的「展示 / 不展示 + 原因」一列**直接问它**，后台不自己排序 ——
     各写一遍的表现是「后台说会展示这三个、App 上却是另三个」，运营手里没有任何线索能查。
  🛡 生效判定查询时按 [starts_at, ends_at) 算，ends_at 为空 = 永久；无状态列、无扫描器。

  🔴 8.2 的改动是**页面组织**，不是机制：主表只留标签一张表，编辑 / 分配记录 / 加人全部进抽屉；
     页尾原先并排的「新建标签」「批量分配」「分配记录（按标签 / 按用户筛选）」三块已删。
     5 个 POST 端点的路径与参数逐字未动（与 7.4 内容标签同一改法、同一动线）。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.utags.title}">用户标签 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='utag'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.utags.title}">用户标签</h1>
            <button type="button" class="btn btn-primary btn-sm"
                    th:attr="data-drawer-open=@{/admin/user-tags/new/drawer},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    data-drawer-res="utag"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.tag_manage')"
                    th:text="#{admin.utags.newTag}">＋ 新建标签</button>
        </div>
        <p class="muted" th:text="#{admin.utags.subtitle}">给用户挂身份标签。</p>

        <!-- 🔴 展示上限说明（11.3 AC3）。**这段不可删** ——
             不提示的话，运营分配了标签、以为用户身上就能看见，实际被顶掉了，
             他会以为是 bug，然后重复分配。（抽屉的分配记录页签里也有一份，见 drawer-user-tag。） -->
        <div class="banner warn" id="userTagCapNotice"
             th:text="${#messages.msg('admin.utags.capNotice', maxVisible, maxVisible + 1)}">
            用户端同时只展示 3 个标签……
        </div>

        <!--/* 旧书签 ?userId= 的落点（Story 8.2 · AC1）：「按用户看分配记录」这个维度随筛选区块一并退役。
               🔴 **不静默忽略**：静默忽略的话运营看到的是一张「他要找的那个人不在里面」的全量标签表，
                  会以为数据没了。说清楚它去哪了，比让他自己猜强。 */-->
        <div class="banner warn" th:if="${legacyUserId != null}" data-notice="utags-legacy-user"
             th:text="#{admin.v130.utags.legacyUserView(${legacyUserId})}">
            「按用户看」已并入标签抽屉的分配记录页签。
        </div>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::utag-filters}, ~{::utag-summary}, ~{::utag-table}, ~{::utag-drawer})}">
            <!--/* 本页没有筛选项（标签是低基数数据，一屏看得完）。这里只放一个隐形的刷新监听：
                   抽屉内建标签 / 改标签 / 上下线 / 分配 / 取消分配成功 → HX-Trigger admin:user-tag-list-refresh
                   → 整表重拉（「生效中分配数」与摘要条都要跟着变；新建的行也只能靠重拉才会出现）。
                   ⚠️ 它必须留在 #utags-rows **之外** —— 放里面会被自己那次 swap 连听众一起换掉。 */-->
            <span th:fragment="utag-filters" hidden data-utag-refresh
                  th:attr="hx-get=@{/admin/user-tags}" hx-trigger="admin:user-tag-list-refresh from:body"
                  hx-target="#utags-rows" hx-swap="innerHTML"></span>

            <div th:fragment="utag-summary" th:replace="~{admin/fragments/user-tags-list :: sumbar(false)}"></div>

            <div th:fragment="utag-table" id="utags-rows">
                <div th:replace="~{admin/fragments/user-tags-list :: rows(false)}"></div>
            </div>

            <div th:fragment="utag-drawer" class="drawer-title" th:text="#{admin.v130.utags.drawer.title}">标签详情</div>
        </div>

        <!--/* ?open=<id> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL
               （与 B1～B6 同一机制）。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="utag"
              th:attr="data-drawer-deeplink=@{/admin/user-tags/{id}/drawer(id=${open})}"></span>

        <!--/* 旧书签 ?tagId=<id>：原意是「看这个标签的分配记录」。
               ⚠️ **不能**走上面那个 deeplink 兜底 —— 那条分支只在 URL 带 ?open= 时才跑，
                  旧书签上没有 ?open=，结果会是一声不响什么都不发生。
                  这里用 [data-drawer-open][data-drawer-autoopen]（?create=1 用的同一条通道），
                  加载时按给定 URL 直接开抽屉，并停在分配记录页签。 */-->
        <span hidden th:if="${legacyTagId != null}" data-drawer-res="utag" data-drawer-autoopen="true"
              data-drawer-autoclear="tagId"
              th:attr="data-drawer-open=@{/admin/user-tags/{id}/drawer(id=${legacyTagId},tab='assignments')}"></span>
    </div>

    <!--/* 用户候选（HTMX 局部，GET /admin/user-tags/pick 的返回体）。
           🔴 已注销账号不会出现在这里 —— 查询层就滤掉了。
           🔴 2026-09-02（实机截图）：必须留在 content 片段**之外**（外层 th:replace 之内）——
           定义在 content 里的话，整页渲染时片段本体会在页面底部**再游离渲染一遍**
           （一整排带勾选框的用户名浮在页面最底下）。 */-->
    <div th:fragment="candidates" th:remove="tag">
        <p class="hint" th:if="${#lists.isEmpty(candidates)}"
           th:text="#{admin.utags.pickEmpty}">没有匹配的用户。</p>
        <label th:each="c : ${candidates}" class="pick-row">
            <input type="checkbox" name="pickedUserIds" th:value="${c.id}"/>
            <span th:text="${c.id}">1</span>
            <span th:text="${c.name}">昵称</span>
            <!--/* ⚠️ 状态只标注、不隐藏：运营有时确实要给封号账号挂标签，
                   但不标注就等于让他在不知情的情况下分配。 */-->
            <span class="muted" th:if="${c.deactivated}"
                  th:text="#{admin.utags.pickDeactivated}">已停用</span>
            <span class="muted" th:if="${c.virtualAccount}"
                  th:text="#{admin.utags.pickVirtual}">虚拟账号</span>
            <!--/* 🔴 「满 3 会顶掉最早的那个」的预告（AC3）。**必须在选人的这一刻给**：
                   分配完再说，运营已经不知道被顶掉的是谁了。
                   ⚠️ 只提示、不禁选 —— 顶掉最早的常常正是运营想要的效果。 */-->
            <span class="badge badge-danger" th:if="${c.activeTagCount >= maxVisible}"
                  data-notice="pick-at-cap"
                  th:text="#{admin.v130.utags.pickAtCap(${c.activeTagCount})}">已挂 3 个，分配后会顶掉最早的</span>
            <span class="muted" th:if="${c.activeTagCount > 0 and c.activeTagCount < maxVisible}"
                  th:text="#{admin.v130.utags.pickHasTags(${c.activeTagCount})}">已挂 1 个</span>
        </label>
    </div>
</div>
</body>
</html>
