<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  C1 Toko 对账（V1.3.0 Story 10.2 AC4，模板 C · tpl-c-report；原 V1.4.0 Story 8.3 AB-13D）。
  四张核对卡字段现状原样（见 fragments/cards-shop-reconciliation.html）；①「两段之和 = 实付」不平 → 整卡红框。
  🔒 独立权限位 shop.finance_view。数据源为业务库，非 PostHog。
  🔴 **本页没有任何写操作，也没有导出端点**（AC4 明确不新增）—— 模板 C 的 data-readonly 标识由壳给出。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.recon.title}">对账 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.shop.recon.title}">对账</h1></div>
        <p class="muted" th:text="#{admin.shop.recon.hint}">数据源为业务库，不是分析平台。PawCoin 段与 QRIS 段分别列出。</p>

        <div th:replace="~{admin/fragments/tpl-c-report :: report(~{::rc-range}, ~{::rc-cards}, ~{::rc-detail})}">
            <!-- 期间切换：htmx 只换卡区（#recon-cards），页头与只读标识不重绘 -->
            <form th:fragment="rc-range" class="filter-bar" data-autosubmit method="get"
                  th:action="@{/admin/shop/reconciliation}" th:attr="hx-get=@{/admin/shop/reconciliation}"
                  hx-target="#recon-cards" hx-swap="outerHTML" hx-push-url="true">
                <label class="field"><span th:text="#{admin.shop.orders.filter.from}">起始日期</span>
                    <input type="date" name="from" class="inp" th:value="${from}"/>
                </label>
                <label class="field"><span th:text="#{admin.shop.orders.filter.to}">截止日期</span>
                    <input type="date" name="to" class="inp" th:value="${to}"/>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.common.filter}">筛选</button>
            </form>

            <div th:fragment="rc-cards" th:replace="~{admin/fragments/cards-shop-reconciliation :: cards}"></div>

            <!-- ⚠️ DEP-8 未闭合，页面须写明：这一页给的是业务口径读数，不能当税务申报依据 -->
            <p th:fragment="rc-detail" class="hint" th:text="#{admin.shop.recon.dep8}">⚠️ DEP-8 未闭合。</p>
        </div>
    </div>
</div>
</body>
</html>
