<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  A1 统一复核工作台（V1.3.0 Story 2.4，模板 A · tpl-a-workbench）。
  四页签：内容送审 / 内容举报 / 名称审核 / 头像审核（ReviewTab），各带待处理计数；左栏两态（待处理 / 已处理）；
  右栏三卡（快照 / 上下文 / 操作）由 fragments/review-detail.html 按页签渲染；处置走各自既有写端点（路径 / 参数 / 权限零变更），
  htmx 分支返回 fragments/review-done.html（data-next-id → admin-workbench.js 自动下一条）。
  🔴 无键盘 ↑/↓（D-14）。人工复核总开关移到右上齿轮弹层（仅超管）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.review.title}">人工复核 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-workbench.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row">
            <h1 th:text="#{admin.review.title}">人工复核</h1>
            <!-- 齿轮：人工复核总开关（AC6，仅超管；POST /admin/settings/manual-review 不变） -->
            <details class="account-menu review-gear" sec:authorize="hasRole('SUPER_ADMIN')">
                <summary th:title="#{admin.v130.review.gear.title}">⚙️</summary>
                <div class="account-menu-panel">
                    <div class="name" th:text="#{admin.v130.review.gear.title}">人工复核总开关</div>
                    <p class="muted" th:text="#{admin.v130.review.gear.scope}">影响范围：开启后，机审拿不准的新发布内容进入本队列等待放行；关闭则机审判完直接发布。</p>
                    <p>
                        <span class="badge" th:classappend="${manualReviewEnabled} ? 'badge-ok' : 'badge-neutral'"
                              th:text="${manualReviewEnabled} ? #{admin.review.switch.on} : #{admin.review.switch.off}">未激活</span>
                    </p>
                    <form th:action="@{/admin/settings/manual-review}" method="post">
                        <input type="hidden" name="enabled" th:value="${!manualReviewEnabled}"/>
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${manualReviewEnabled} ? 'btn-neutral' : 'btn-primary'"
                                th:text="${manualReviewEnabled} ? #{admin.review.switch.disable} : #{admin.review.switch.enable}">开启</button>
                    </form>
                </div>
            </details>
        </div>
        <p class="muted" th:text="#{admin.review.intro}">本页汇总需要人工判断的待办。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-a-workbench :: workbench(~{::rv-tabs}, ~{::rv-filters}, ~{::rv-queue}, ~{::rv-detail}, ~{::rv-actions})}">
            <!-- 页签行：四页签 + 紫计数（切页签 = 整页 GET，保留筛选） -->
            <div th:fragment="rv-tabs" class="tabs" id="review-tabs">
                <a th:each="t : ${tabs}" class="tab" th:classappend="${t == filters.tab} ? 'tab--on'"
                   th:href="@{/admin/manual-review(tab=${t.param()},state=${filters.state()},q=${filters.q})}">
                    <span th:text="#{${t.titleKey()}}">页签</span>
                    <span class="tab-count" th:id="'review-tab-count-' + ${t.param()}" th:text="${counts.get(t)}">0</span>
                </a>
            </div>
            <!-- 筛选行：两态 + 类别 / 优先级 / 子类型（下拉自动提交）+ 关键词（显式查询钮） -->
            <form th:fragment="rv-filters" class="filter-bar review-filters" th:action="@{/admin/manual-review}" method="get" data-autosubmit>
                <input type="hidden" name="tab" th:value="${filters.tab.param()}"/>
                <label><span th:text="#{admin.v130.review.state}">状态</span>
                    <select name="state" class="sel">
                        <option value="pending" th:selected="${!filters.handled}" th:text="#{admin.v130.review.state.pending}">待处理</option>
                        <option value="handled" th:selected="${filters.handled}" th:text="#{admin.v130.review.state.handled}">已处理</option>
                    </select>
                </label>
                <label th:if="${filters.tab.name() == 'REPORT'}"><span th:text="#{admin.v130.review.filter.category}">违规类别</span>
                    <select name="category" class="sel">
                        <option value="" th:text="#{admin.tickets.filter.all}">全部</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:selected="${c.name() == filters.category}" th:text="${c}">CAT</option>
                    </select>
                </label>
                <label th:if="${filters.tab.name() == 'SUBMISSION'}"><span th:text="#{admin.v130.review.filter.priority}">优先级</span>
                    <select name="priority" class="sel">
                        <option value="" th:text="#{admin.tickets.filter.all}">全部</option>
                        <option th:each="p : ${ {'P0','P1','P2'} }" th:value="${p}" th:selected="${p == filters.priority}" th:text="${p}">P0</option>
                    </select>
                </label>
                <label th:if="${filters.tab.hasSubTypeFilter()}"><span th:text="#{admin.v130.review.filter.subType}">对象</span>
                    <select name="subType" class="sel">
                        <option value="" th:text="#{admin.tickets.filter.all}">全部</option>
                        <option value="user" th:selected="${filters.subType == 'user'}" th:text="#{admin.v130.review.subType.user}">用户</option>
                        <option value="pet" th:selected="${filters.subType == 'pet'}" th:text="#{admin.v130.review.subType.pet}">宠物</option>
                    </select>
                </label>
                <label><span th:text="#{admin.review.filter.q}">账号</span>
                    <input type="text" name="q" class="inp" th:value="${filters.q}" th:placeholder="#{admin.review.filter.qPlaceholder}"/>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.tickets.filter.submit}">查询</button>
            </form>
            <!-- 左栏队列 -->
            <div th:fragment="rv-queue" th:replace="~{admin/fragments/review-queue :: list}"></div>
            <!-- 右栏初始空态 -->
            <div th:fragment="rv-detail" th:replace="~{admin/fragments/tpl-a-workbench :: detail-empty}"></div>
            <div th:fragment="rv-actions"><span class="muted" th:text="#{admin.v130.review.actions.hint}">操作区随所选单据渲染</span></div>
        </div>
        <!-- 刻意不放 data-detail-empty-template：队列清空时右栏保留 review-done 的「队列已清空 + 其他队列还有 N 条」（AC8）。 -->
    </div>
</div>
</body>
</html>
