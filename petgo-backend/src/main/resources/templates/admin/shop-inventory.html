<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  B18 库存管理（V1.3.0 Story 10.4 AC1 / AC2，模板 B + 抽屉；原 Story 1.4 的列表 + 页尾四张常驻表单卡）。
  🔴 库存增减只能通过入库单、报损与盘点调整产生，**不提供直接编辑库存数字的入口**（AB-10C）：
     直接改数会使库存与采购成本脱钩，令毛利核算失真。这条口径在重构中一步都没松。
  🔴 四个操作从「页尾四张卡 + 各自一个 SKU 下拉」收进**抽屉页签**：抽屉绑定被点开的那一行，
     skuId 走隐藏字段 —— 在报损卡里选错 SKU 这件事在结构上就不存在了（流水 append-only，落错不可撤销）。
  抽屉取数复用 GET /admin/shop/inventory/{skuId}/movements 的 HX-Request 分支，**零新端点**（D-43）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.inventory.title}">库存管理 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='shop-inventory'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.shop.inventory.title}">库存管理</h1>
        </div>
        <p class="muted" th:text="#{admin.shop.inventory.hint}">库存增减只能通过入库单、报损与盘点调整产生，不提供直接编辑库存数字的入口——直接改数会使库存与采购成本脱钩，令毛利核算失真。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{}, ~{::inv-sum}, ~{::inv-table}, ~{::inv-drawer-title})}">
            <div th:fragment="inv-sum" th:replace="~{admin/fragments/shop-inventory-list :: sumbar(false)}"></div>
            <div th:fragment="inv-table" id="shop-inventory-rows">
                <div th:replace="~{admin/fragments/shop-inventory-list :: rows}"></div>
            </div>
            <div th:fragment="inv-drawer-title" class="drawer-title"
                 th:text="#{admin.v130.shopInventory.drawer.title}">库存操作</div>
        </div>
        <!--/* ?open=<skuId> 深链兜底：行在当前页时 admin-drawer.js 直接找 tr[data-id]，
               但 SKU 多到翻页之后（从商品页 / 工单跳过来最常见）那一行根本不在首屏 ——
               没有这个落点就只能静默什么都不发生。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="shop-inventory"
              th:attr="data-drawer-deeplink=@{/admin/shop/inventory/{id}/movements(id=${open})}"></span>
    </div>
</div>
</body>
</html>
