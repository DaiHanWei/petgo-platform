<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  A2 被举报用户（V1.3.0 Story 2.5，模板 A · tpl-a-workbench）。本页只管用户举报（ACCOUNT_REPORT，账号级处置）；
  内容 / 名称 / 头像归 A1（manual-review.html）。两态页签（待处置 / 已处置）+ 举报类型 / 关键词筛选；左栏队列（行首勾选框 = 批量模式）；
  右栏四区由 fragments/tickets-detail.html 渲染，处置区两段式（chips → 参数区）；处置走各自既有写端点（warn 多一个必填 reason），
  htmx 分支返回 fragments/tickets-done.html（data-next-id → admin-workbench.js 自动下一条；限流类 refresh → 停留本条）。
  批量：勾选 ≥2 浮出批量条（批量封号 / 批量驳回，真表单 POST /admin/tickets/batch，PRG 回来即清勾选 + 计数刷新）。
  🔴 无键盘 ↑/↓（D-14）。勾选态 / chips / 重拉右栏这些页内 JS 内联在本页（不改 2-3b 公共文件）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.tickets.title}">被举报用户 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-workbench.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row">
            <h1 th:text="#{admin.tickets.title}">被举报用户</h1>
        </div>
        <p class="muted" th:text="#{admin.tickets.subtitle}">仅用户举报（账号级警告 / 封号）。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <!-- 批量失败明细必须真的列出来（AC5）：只报「失败 N 条」运营无从重试。 -->
        <div class="banner" th:if="${batchFailures != null and !#lists.isEmpty(batchFailures)}">
            <p><b th:text="#{admin.tickets.batch.failed}">以下工单处理失败，可重新勾选后重试：</b></p>
            <ul><li th:each="f : ${batchFailures}" th:text="${f}">工单 X：原因</li></ul>
        </div>

        <!-- 批量作用域包住批量条 + 工作台（admin-core.js 的 [data-batch-scope] 逻辑按作用域找勾选框）。
             ⚠️ 批量 form **不包住工作台**：右栏处置 fragment 里有自己的 <form>，嵌套会被解析器丢掉（旧模板踩过）——
             勾选框用 form="ticket-batch-form" 远程关联。批量条只提供封号 / 驳回两钮（批量警告入口不渲染，AC6）。 -->
        <div id="tickets-scope" data-batch-scope>
        <form id="ticket-batch-form" th:action="@{/admin/tickets/batch}" method="post">
            <div class="batch-bar" hidden data-batch-bar
                 sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.dispose_account')">
                <span th:text="#{admin.tickets.batch.selected}">已选</span>
                <b data-batch-count>0 / 50</b>
                <button type="button" class="btn btn-sm btn-danger" data-batch-action data-open-dialog="batch-suspend-dialog"
                        sec:authorize="hasRole('SUPER_ADMIN') or (hasAuthority('content.dispose_account') and hasAuthority('user.deactivate'))"
                        th:text="#{admin.tickets.batch.suspend}">批量封号</button>
                <button type="submit" class="btn btn-sm btn-neutral" data-batch-action data-confirm-button name="action" value="DISMISS"
                        th:attr="data-confirm=#{admin.v130.tickets.confirm.batchDismiss}"
                        th:text="#{admin.tickets.batch.dismiss}">批量无需处置</button>
                <button type="button" class="btn btn-sm btn-neutral" data-batch-clear th:text="#{admin.v130.tickets.batch.cancel}">取消勾选</button>
            </div>
            <dialog id="batch-suspend-dialog">
                <h3 th:text="#{admin.tickets.batch.suspend.confirm.title}">确认批量封号</h3>
                <p class="muted" th:text="#{admin.tickets.batch.suspend.confirm.body}">以下账号将被停用，他们会收到通知：</p>
                <ul data-batch-suspend-list></ul>
                <p>
                    <button type="submit" class="btn btn-danger btn-sm" name="action" value="SUSPEND" th:text="#{admin.tickets.batch.suspend.confirm.ok}">确认封号</button>
                    <button type="button" class="btn btn-neutral btn-sm" data-close-dialog th:text="#{admin.tickets.batch.suspend.confirm.cancel}">取消</button>
                </p>
            </dialog>
        </form>

            <div th:replace="~{admin/fragments/tpl-a-workbench :: workbench(~{::tk-tabs}, ~{::tk-filters}, ~{::tk-queue}, ~{::tk-detail}, ~{::tk-actions})}">
                <!-- 页签行：待处置 / 已处置 + 计数（切页签 = 整页 GET，保留筛选） -->
                <div th:fragment="tk-tabs" class="tabs" id="tickets-tabs">
                    <a class="tab" th:classappend="${!filters.handled} ? 'tab--on'"
                       th:href="@{/admin/tickets(state='pending',reason=${filters.reason},q=${filters.q})}">
                        <span th:text="#{admin.v130.tickets.tab.pending}">待处置</span>
                        <span class="tab-count" id="tickets-tab-count-pending" th:text="${counts.get('pending')}">0</span>
                    </a>
                    <a class="tab" th:classappend="${filters.handled} ? 'tab--on'"
                       th:href="@{/admin/tickets(state='handled',reason=${filters.reason},q=${filters.q})}">
                        <span th:text="#{admin.v130.tickets.tab.handled}">已处置</span>
                        <span class="tab-count" id="tickets-tab-count-handled" th:text="${counts.get('handled')}">0</span>
                    </a>
                </div>
                <!-- 筛选行：举报类型（下拉自动提交）+ 关键词（账号 id / 昵称，显式查询钮）；整页 GET，保留两态。 -->
                <form th:fragment="tk-filters" class="filter-bar tk-filters" th:action="@{/admin/tickets}" method="get" data-autosubmit>
                    <input type="hidden" name="state" th:value="${filters.state()}"/>
                    <label><span th:text="#{admin.v130.tickets.filter.reason}">举报类型</span>
                        <select name="reason" class="sel">
                            <option value="" th:text="#{admin.tickets.filter.all}">全部</option>
                            <option th:each="r : ${reasons}" th:value="${r}" th:selected="${r.name() == filters.reason}" th:text="#{'admin.v130.tickets.reason.' + ${r.name()}}">SPAM</option>
                        </select>
                    </label>
                    <label><span th:text="#{admin.tickets.filter.account}">被举报账号</span>
                        <input type="text" name="q" class="inp" th:value="${filters.q}" th:placeholder="#{admin.tickets.filter.account.hint}"/>
                    </label>
                    <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.tickets.filter.submit}">筛选</button>
                </form>
                <div th:fragment="tk-queue" th:replace="~{admin/fragments/tickets-queue :: list}"></div>
                <div th:fragment="tk-detail" th:replace="~{admin/fragments/tpl-a-workbench :: detail-empty}"></div>
                <div th:fragment="tk-actions"><span class="muted" th:text="#{admin.v130.review.actions.hint}">操作区随所选单据渲染</span></div>
            </div>
        </div>

        <script>
        // 页内 JS（Story 2.5，不改公共文件）：① 批量条浮出（≥2）+ 右栏折叠摘要 ② 处置 chips 两段式 ③ 参数齐全才可提交
        // ④ 限流 / 解除后重拉当前右栏（data-refresh-detail）。无 ↑/↓ 键盘绑定（D-14）。
        (function () {
            var scope = document.getElementById('tickets-scope');
            if (!scope) { return; }
            function checked() { return scope.querySelectorAll('input[data-batch-item]:checked').length; }
            function paint() {
                var n = checked();
                var bar = scope.querySelector('[data-batch-bar]');
                if (bar) { bar.hidden = n < 2; }
                var wb = scope.querySelector('[data-workbench]');
                if (wb) { wb.classList.toggle('wb--collapsed', n >= 1); }
            }
            scope.addEventListener('change', function (e) {
                if (e.target && e.target.matches && e.target.matches('input[data-batch-item], [data-batch-all]')) { setTimeout(paint, 0); }
            });
            scope.addEventListener('click', function (e) {
                // 勾选框点击不触发行选中（admin-workbench.js 的 document 级 click 只排除 a/button）
                if (e.target && e.target.closest && e.target.closest('.q-check')) { e.stopPropagation(); }
                var clear = e.target && e.target.closest ? e.target.closest('[data-batch-clear]') : null;
                if (clear) {
                    scope.querySelectorAll('input[data-batch-item]:checked').forEach(function (c) { c.checked = false; c.dispatchEvent(new Event('change', { bubbles: true })); });
                    paint();
                }
                // chips：单选，选中后展开对应参数区
                var chip = e.target && e.target.closest ? e.target.closest('button[data-chip]') : null;
                if (chip && !chip.disabled) {
                    var host = chip.closest('.tk-actions');
                    host.querySelectorAll('button[data-chip]').forEach(function (c) { c.classList.toggle('chip--on', c === chip); c.setAttribute('aria-selected', c === chip ? 'true' : 'false'); });
                    host.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== chip.getAttribute('data-chip'); });
                    var focus = host.querySelector('[data-panel]:not([hidden]) textarea, [data-panel]:not([hidden]) input[type="radio"]');
                    if (focus) { focus.focus(); }
                }
            });
            // 参数齐全才可提交：textarea 非空 / radio 选中
            function syncPanel(form) {
                var btn = form.querySelector('[data-requires-target]');
                if (!btn) { return; }
                var txt = form.querySelector('[data-requires-text]');
                var radios = form.querySelector('[data-requires-radio]');
                var ok = true;
                if (txt) { ok = ok && !!txt.value.trim(); }
                if (radios) { ok = ok && !!radios.querySelector('input[type="radio"]:checked'); }
                btn.disabled = !ok;
            }
            scope.addEventListener('input', function (e) {
                var f = e.target && e.target.closest ? e.target.closest('form[data-panel]') : null;
                if (f) { syncPanel(f); }
            });
            scope.addEventListener('change', function (e) {
                var f = e.target && e.target.closest ? e.target.closest('form[data-panel]') : null;
                if (f) { syncPanel(f); }
            });
            document.body.addEventListener('htmx:afterSwap', function (e) {
                var t = e.detail && e.detail.target;
                if (!t || !t.querySelectorAll) { return; }
                t.querySelectorAll('form[data-panel]').forEach(syncPanel);
                // 限流 / 解除限流成功：停留本条，重拉当前右栏
                var refresh = t.querySelector ? t.querySelector('[data-refresh-detail]') : null;
                if (refresh) {
                    refresh.remove();
                    // 以右栏自带的 data-report-id 为准（不依赖 .q-row.on：勾选别的行不该换条）
                    var cur = scope.querySelector('.tk-detail[data-report-id]');
                    var id = cur && cur.getAttribute('data-report-id');
                    if (id && window.htmx) { window.htmx.ajax('GET', '/admin/tickets/' + encodeURIComponent(id) + '/detail', { target: '.wb-detail-body', swap: 'innerHTML' }); }
                }
                paint();
            });
            document.addEventListener('DOMContentLoaded', paint);
        })();
        </script>
    </div>
</div>
</body>
</html>
