<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  内容标签管理（V1.1.6 Story 11.2 · AB-10C → V1.3.0 Story 7.4 套模板 B · tpl-b-list，UI 稿 2-14～2-18）。
  打标机制（含「只有公开内容可打标」的校验）与生效判定早在 Story 5.2 就随 ContentTagQueryService 落地；
  本页是它的入口。🛡 生效判定一律查询时按 [starts_at, ends_at) 算，ends_at 为空 = 永久；无状态列、无扫描器。

  🔴 7.4 的改动是**页面组织**，不是机制：主表只留标签一张表，编辑 / 分配记录 / 打标全部进抽屉；
     页尾原先并排的「新建标签」「给内容打标」「分配记录」三块已删 —— 同屏两个叫「名称」的输入框
     指的却是两件事（新标签的名字 / 选哪个已有标签），运营正是在那里读不懂。
     5 个 POST 端点的路径与参数逐字未动。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.tags.title}">内容标签 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='tag'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.tags.title}">内容标签</h1>
            <button type="button" class="btn btn-primary btn-sm"
                    th:attr="data-drawer-open=@{/admin/content-tags/new/drawer},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    data-drawer-res="tag"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.tag_manage')"
                    th:text="#{admin.tags.newTag}">＋ 新建标签</button>
        </div>
        <p class="muted" th:text="#{admin.tags.subtitle}">为公开内容挂荣誉标签。</p>

        <!--/* 🔴 排序副作用提示（AC4）。**这段不可删** ——
               不提示的两个后果：① 把打标后的数据上涨误读成「这条内容本来就这么火」；
               ② 取消打标后曝光回落被误判为线上故障。
               ⚠️ 权重数值以算法文档为准；算法侧调整后本处文案需同步。 */-->
        <div class="banner warn" id="tagRankWarn" th:text="#{admin.tags.rankWarn}">
            打标同时是一个流量动作……
        </div>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::tag-filters}, ~{::tag-summary}, ~{::tag-table}, ~{::tag-drawer})}">
            <!--/* 本页没有筛选项（标签是低基数数据，一屏看得完）。这里只放一个隐形的刷新监听：
                   抽屉内建标签 / 改标签 / 上下线 / 打标 / 取消打标成功 → HX-Trigger admin:tag-list-refresh
                   → 整表重拉（「生效中分配数」与摘要条都要跟着变；新建的行也只能靠重拉才会出现）。
                   ⚠️ 它必须留在 #tags-rows **之外** —— 放里面会被自己那次 swap 连听众一起换掉。 */-->
            <span th:fragment="tag-filters" hidden data-tag-refresh
                  th:attr="hx-get=@{/admin/content-tags}" hx-trigger="admin:tag-list-refresh from:body"
                  hx-target="#tags-rows" hx-swap="innerHTML"></span>

            <div th:fragment="tag-summary" th:replace="~{admin/fragments/tags-list :: summary(false)}"></div>

            <div th:fragment="tag-table" id="tags-rows">
                <div th:replace="~{admin/fragments/tags-list :: rows(false)}"></div>
            </div>

            <div th:fragment="tag-drawer" class="drawer-title" th:text="#{admin.v130.tags.drawer.title}">标签详情</div>
        </div>

        <!--/* ?open=<id> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL（与 B1 / B2 / B3 同一机制） */-->
        <span hidden th:if="${open != null}" data-drawer-res="tag"
              th:attr="data-drawer-deeplink=@{/admin/content-tags/{id}/drawer(id=${open})}"></span>
    </div>

    <!--/* 内容候选（HTMX 局部，GET /admin/content-tags/pick 的返回体）。复用顶置那条「只返回可公开展示内容」的分页查询。
           🔴 2026-09-02：必须留在 content 片段**之外**（外层 th:replace 之内）——
           定义在 content 里的话，整页渲染时片段本体会在页面底部再游离渲染一遍（用户标签页同一个 bug 被实机截图抓到）。 */-->
    <div th:fragment="candidates" th:remove="tag">
        <p class="hint" th:if="${#lists.isEmpty(candidates)}" th:text="#{admin.tags.pickEmpty}">没有可打标的公开内容。</p>
        <label th:each="c : ${candidates}" class="pick-row">
            <!--/* 🔴 required：候选列表在 480px 抽屉里离提交钮很远，只填时间就点「打标」是常见操作。
                   不拦住的话请求会带着空 postId 发出去 → 缺参数 400（不是 422）→ htmx 丢弃响应
                   → err 槽空白、按钮弹回，界面上什么都不发生。服务端另有校验，这里是第一道。 */-->
            <input type="radio" name="postId" th:value="${c.id}" required/>
            <span th:text="${c.id}">1</span>
            <span th:text="#{'admin.contentType.' + ${c.type}}">Moment</span>
            <span th:text="${c.summary}">摘要</span>
            <span class="muted" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd', 'Asia/Jakarta')}">日期</span>
        </label>
    </div>

    <!--/* 整枚胶囊预览片段（2026-08-28）。数值逐项照 UI 稿 `.deco-badge`：
           padding 4/10、全圆角、135° 双色渐变、双层红投影、白色粗体 9.5px、图标 9px。
           ⚠️ 改这里请对着稿改 —— 它的全部意义就是「后台看到的 = 用户看到的」，
              与 ContentTagChip 有任何一处对不上，预览就成了另一种误导。
           k = 放大倍数（1 = 用户实际大小，2 = 便于检查细节）。

           ⚠️ 带参数的片段必须放在**外层 th:replace 之内、content 片段之外**：
              外层 div 带 th:replace ⇒ 它的整个内容被丢弃、只由 ~{::content} 选出片段，
              所以放这里整页渲染时不会被求值。放到外层 div **之外**（</body> 前）
              反而会被渲染 ⇒ 那时 k 未绑定，页面直接 500（已踩过）。 */-->
    <span th:fragment="chip(t, k)"
          th:style="'display:inline-flex;align-items:center;gap:' + ${4 * k} + 'px;'
                  + 'padding:' + ${4 * k} + 'px ' + ${10 * k} + 'px;border-radius:999px;'
                  + 'font-size:' + ${9.5 * k} + 'px;font-weight:700;color:#fff;'
                  + 'white-space:nowrap;vertical-align:middle;margin-right:8px;'
                  + 'box-shadow:0 ' + ${1 * k} + 'px ' + ${2 * k} + 'px rgba(240,66,90,.22),'
                  + '0 ' + ${3 * k} + 'px ' + ${8 * k} + 'px rgba(240,66,90,.22);'
                  + 'background:' + ${t.badgeCss()}">
        <img th:if="${#strings.startsWith(t.icon, 'http')}" th:src="${t.icon}" alt=""
             th:width="${9 * k}" th:height="${9 * k}"/>
        <span th:unless="${#strings.startsWith(t.icon, 'http')}" th:text="${t.icon}"
              th:style="'font-size:' + ${9 * k} + 'px;line-height:1'"></span>
        <span th:text="${t.name}">Terbaik Minggu Ini</span>
    </span>
</div>
</body>
</html>
