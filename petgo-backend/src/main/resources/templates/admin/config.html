<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  D2 运营配置（Story 9.2 → V1.3.0 Story 6.3 整体套模板 D，AB-19A「不动任何功能」）：四张配置卡各自成表单、自带保存钮
  （未修改禁用 → 修改激活 +「已修改」标 → 高危确认复述改动字段旧值 → 新值 → 提交）；组头不标红「高危」（D-8）。
  卡顺序按 UI 稿 7-1：问诊定价 · KTP 模块高清图解锁定价 · PawCoin（含充值档位两表 + 新建）· 分享奖励。
  卡内容各在 fragments/config-card-*.html（也是 htmx 成功 / 422 的返回目标）；端点 / 参数 / @PreAuthorize 逐字不变（Story 2.1 底账）。
  改值只影响后续（历史落快照）；变更留审计。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.config.title}">运营配置 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <!--/* 配置卡 dirty / diff 确认 / htmx（CSRF 头、toast 计时、422 放行）由 admin-core.js 统一处理 */-->
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.config.title}">运营配置</h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <p class="hint" th:text="#{admin.config.hint}">改动仅影响后续新成交；历史订单按成交快照不变。每次修改记入变更日志与审计哈希链。</p>

        <!--/* 🛡 页面准入已放宽到任意 config.* 读权限（Story 18.3 · AC5 修订，见 AdminConfigController.PAGE_AUTH）：
             只持 config.share_reward_* 的人也能进来关总开关。所以定价 / KTP / PawCoin / 档位这些**非分享奖励卡**必须补上 config.view 门。 */-->
        <th:block sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.view')">
            <div th:replace="~{admin/fragments/config-card-pricing :: card}"></div>
            <div th:replace="~{admin/fragments/config-card-ktp :: card}"></div>
            <div class="cfg-group" data-card-group="pawcoin">
                <div th:replace="~{admin/fragments/config-card-pawcoin :: card}"></div>
                <div th:replace="~{admin/fragments/config-card-pawcoin :: tiers}"></div>
            </div>
        </th:block>

        <!--/* 分享奖励（V1.1.6 Story 18.3 · AB-3M）：独立权限码；edit 码也放进门里——应急操作员可能只握 share_reward_edit */-->
        <th:block sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.share_reward_view') or hasAuthority('config.share_reward_edit')">
            <div th:replace="~{admin/fragments/config-card-share-reward :: card}"></div>
        </th:block>
    </div>
</div>
</body>
</html>
