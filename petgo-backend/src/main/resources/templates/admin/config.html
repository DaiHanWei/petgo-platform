<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- 运营配置（Story 9.2）：定价 / PawCoin / 充值档位。改值只影响后续（历史落快照）；变更留审计。 -->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.config.title}">运营配置 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.config.title}">运营配置</h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <p class="hint" th:text="#{admin.config.hint}">改动仅影响后续新成交；历史订单按成交快照不变。每次修改记入变更日志与审计哈希链。</p>

        <!-- 🛡 页面准入已放宽到任意 config.* 读权限（Story 18.3 · AC5 修订，见 AdminConfigController.PAGE_AUTH）：
             只持 config.share_reward_* 的人也能进来关总开关。所以定价 / PawCoin / 档位这些
             **非分享奖励块**必须补上 config.view 门 —— 否则放宽准入就顺带把兽医定价与分成放出去了。 -->
        <th:block sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.view')">
        <!-- 定价（AB-8A/8F）——仅 config.edit 可改；否则只读 -->
        <h2 th:text="#{admin.config.pricing}">定价配置</h2>
        <form class="card" method="post" th:action="@{/admin/config/pricing}"
              sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.edit')">
            <label class="field"><span th:text="#{admin.config.vetConsultPrice}">兽医单次咨询价（IDR）</span>
                <input class="field-full" type="number" name="vetConsultPrice" min="0" th:value="${pricing.vetConsultPrice}"/>
            </label>
            <label class="field"><span th:text="#{admin.config.vetShareRate}">兽医分成（%，0–100）</span>
                <input class="field-full" type="number" name="vetShareRate" min="0" max="100" th:value="${pricing.vetShareRate}"/>
            </label>
            <label class="field"><span th:text="#{admin.config.aiUnlockPrice}">AI 详情解锁价（IDR）</span>
                <input class="field-full" type="number" name="aiUnlockPrice" min="0" th:value="${pricing.aiUnlockPrice}"/>
            </label>
            <label class="field"><span th:text="#{admin.config.idHdDownloadPrice}">身份证高清图下载价（IDR）</span>
                <input class="field-full" type="number" name="idHdDownloadPrice" min="0" th:value="${pricing.idHdDownloadPrice}"/>
            </label>
            <label class="field"><span th:text="#{admin.config.monthlyFreeQuota}">每月AI问诊免费额度（0–35）</span>
                <input class="field-full" type="number" name="monthlyFreeQuota" min="0" max="35" th:value="${pricing.monthlyFreeQuota}"/>
            </label>
            <button type="submit" class="btn btn-primary btn-sm mt-sm" th:text="#{admin.config.btn.savePricing}">保存定价</button>
        </form>
        <p class="hint" sec:authorize="!hasRole('SUPER_ADMIN') and !hasAuthority('config.edit')"
           th:text="#{admin.config.pricingReadonly(${pricing.vetConsultPrice}, ${pricing.vetShareRate}, ${pricing.aiUnlockPrice}, ${pricing.idHdDownloadPrice}, ${pricing.monthlyFreeQuota})}">
            当前定价（只读，需 config.edit 权限修改）
        </p>

        <!-- PawCoin（AB-6A/6C）-->
        <h2>PawCoin</h2>
        <form method="post" th:action="@{/admin/config/pawcoin}"
              sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.edit')">
            <label><span th:text="#{admin.config.premiumRate}">退款转币溢价（%，0–50）</span>
                <input type="number" name="premiumRate" min="0" max="50" th:value="${pawcoin.premiumRate}"/></label>
            <label><span th:text="#{admin.config.premiumFixed}">退款转币固定溢价（koin，≥0）</span>
                <input type="number" name="premiumFixed" min="0" th:value="${pawcoin.premiumFixed}"/></label>
            <label><span th:text="#{admin.config.topupPaused}">暂停充值</span>
                <input type="checkbox" name="topupPaused" value="true" th:checked="${pawcoin.topupPaused}"/></label>

            <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.config.btn.savePawcoin}">保存 PawCoin 配置</button>
        </form>
        </th:block>

        <!-- ══ V1.1.6 Story 18.3 · AB-3M：分享奖励 ══
             🛡 独立 form + 独立权限码（AC5）：关总开关不该顺带要「改兽医定价与分成」的权限。
             🛡 落库仍是同一张 pawcoin_config 单行、同一个 PAWCOIN diff 审计组（AC1/AC6）。
             ⚠️ edit 码也放进门里：应急操作员可能只握 share_reward_edit，进得了页也要看得到这一块。 -->
        <div sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.share_reward_view') or hasAuthority('config.share_reward_edit')"
             th:with="ov=${shareRewardOverview}">
            <h2 th:text="#{admin.config.shareReward}">分享奖励</h2>

            <!-- 🔴 AC2：白嫖倍数必须与配置**同屏**。两个数分开看都合理，
                 放一起才看得出风险 —— 「月上限 30 / HD 解锁 60 = 两个月白嫖一次」。 -->
            <p class="hint" data-notice="share-reward-freeride">
                <span th:text="#{admin.config.shareReward.hdPrice}">当前 HD 解锁价</span>:
                <b th:text="${ov.hdPrice()}">5000</b> ·
                <span th:text="#{admin.config.shareReward.monthlyCap}">月度上限</span>:
                <b th:text="${ov.monthlyCap()}">2000</b> &rArr;
                <b th:if="${ov.monthsPerHdUnlock() != null}"
                   th:text="|#{admin.config.shareReward.monthsPrefix} ${ov.monthsPerHdUnlock()} #{admin.config.shareReward.monthsSuffix}|">攒满 2.5 个月额度可换一次 HD 解锁</b>
                <b th:if="${ov.monthsPerHdUnlock() == null}"
                   th:text="#{admin.config.shareReward.noGrant}">月度上限为 0 ⇒ 不发币</b>
            </p>

            <!-- ⚠️ AC3：不给当月消耗，运营改这个数就是拍脑袋。WIB 字样显式标出。 -->
            <p class="hint" data-notice="share-reward-usage">
                <b th:text="${ov.period()}">2026-08</b>
                <span th:text="#{admin.config.shareReward.wib}">（WIB 自然月）</span> ·
                <span th:text="#{admin.config.shareReward.granted}">已发放</span>
                <b th:text="${ov.grantedThisMonth()}">0</b> ·
                <span th:text="#{admin.config.shareReward.atCap}">达上限账号数</span>
                <b th:text="${ov.accountsAtCap()}">0</b>
            </p>

            <!-- ⚠️ class="card" 不是装饰：本块四个标签都很长（「身份证分享每日次数上限（0 = 不发）」），
                 不加它标签是 inline 的，会在一行里排不下而**从中间断开**——
                 实机截图上「身份证」被挤到上一行行尾、「分享每日次数上限」掉到下一行。
                 .card 让 label 变 block，与上面「定价配置」同一形状。 -->
            <form class="card" method="post" th:action="@{/admin/config/share-reward}"
                  sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.share_reward_edit')">
                <!-- 🔴 总开关：发现被刷要能立刻全线关掉，优先于任何渠道层配置。 -->
                <label><span th:text="#{admin.config.shareRewardEnabled}">分享奖励总开关</span>
                    <input type="checkbox" name="shareRewardEnabled" value="true"
                           th:checked="${pawcoin.shareRewardEnabled}"/></label>
                <label><span th:text="#{admin.config.shareRewardMonthlyCap}">月度免费获取上限</span>
                    <input type="number" name="shareRewardMonthlyCap" min="0" step="1"
                           th:value="${pawcoin.shareRewardMonthlyCap}"/></label>
                <label><span th:text="#{admin.config.idCardShareReward}">身份证分享每次发放</span>
                    <input type="number" name="idCardShareReward" min="0" step="1"
                           th:value="${pawcoin.idCardShareReward}"/></label>
                <label><span th:text="#{admin.config.idCardShareDailyCap}">身份证分享每日次数上限</span>
                    <input type="number" name="idCardShareDailyCap" min="0" step="1"
                           th:value="${pawcoin.idCardShareDailyCap}"/></label>
                <button type="submit" class="btn btn-primary btn-sm"
                        th:text="#{admin.config.btn.saveShareReward}">保存分享奖励配置</button>
            </form>
        </div>

        <!-- 充值档位（AB-6B）——保底 ≥1 启用。同上：非分享奖励块，补 config.view 门。 -->
        <th:block sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.view')">
        <h2 th:text="#{admin.config.tiers}">充值档位</h2>
        <p class="hint" th:text="#{admin.config.hint.tiers}">至少保留 1 个启用档位；停用不影响历史订单。</p>
        <table>
            <thead>
            <tr><th th:text="#{admin.config.col.tier}">档位</th><th th:text="#{admin.config.col.amount}">金额（IDR）</th><th th:text="#{admin.common.status}">状态</th><th th:text="#{admin.common.actions}">操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tiers}">
                <td th:text="${t.tierKey}">10k</td>
                <td th:text="${t.amountIdr}">10000</td>
                <td th:text="${t.enabled} ? #{admin.common.enabled} : #{admin.common.disabled}">启用</td>
                <td sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.edit')">
                    <form method="post" th:action="@{/admin/config/tiers/{id}/enabled(id=${t.id})}" style="display:inline">
                        <input type="hidden" name="enabled" th:value="${!t.enabled}"/>
                        <button type="submit" class="btn btn-neutral btn-sm"
                                th:text="${t.enabled} ? #{admin.common.disable} : #{admin.common.enable}">切换</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        </th:block>

    </div>
</div>
</body>
</html>
