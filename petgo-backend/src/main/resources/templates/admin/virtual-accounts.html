<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  运营发布身份管理（Story 9.8 / V1.1.6 Story 12.1 → V1.3.0 Story 8.3 双区块各套一次模板 B，UI 稿 3-12 / 3-13）。
  两区：
    【虚拟账号】（A-6）无登录，复用 content_posts.author_id 发种子 —— 权限 virtual_account.*
    【运营真实账号】（AB-3I）公司人格化 IP 号 —— **独立**权限码 seed.publish_as_real
  🔴 两套权限刻意不合并：**能管虚拟账号 ≠ 能以真人身份发言**。整区 sec:authorize 与控制器逐字一致。
  🛡 虚拟账号侧的既有能力一处未改；两个整页确认路由（disable / remove）并入弹层后退役（AC3）。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.publishIdentity.pageTitle}">运营发布身份 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <!--/* ⚠️ res 必须设在**这里**（content 这一层），不能写在下面那个带 th:replace 的 div 上：
           th:replace 优先级 100、th:with 600 —— 同标签时 th:with 被静默忽略，
           抽屉容器会渲染成 id="item-drawer"，而抽屉 JS / oob 选择器 / 深链全按 virtual-drawer 找，
           表现是「点行什么都不发生」。（AdminTemplateStructureTest 已加守门。） */-->
    <div th:fragment="content" th:remove="tag" th:with="res='virtual'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.publishIdentity.pageTitle}">运营发布身份</h1>
            <button type="button" class="btn btn-primary btn-sm"
                    th:attr="data-drawer-open=@{/admin/virtual-accounts/new/drawer},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    data-drawer-res="virtual"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('virtual_account.manage')"
                    th:text="#{admin.virtualAccounts.create}">＋ 新建虚拟账号</button>
        </div>
        <p class="hint" th:text="#{admin.publishIdentity.pageHint}">这一页管两类发布身份：虚拟账号与运营真实账号。</p>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <!--/* ===================== 区块一 · 虚拟账号 ===================== */-->
        <h2 th:text="#{admin.virtualAccounts.title}">虚拟账号</h2>
        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::virtual-filters}, ~{::virtual-summary}, ~{::virtual-table}, ~{::virtual-drawer})}">
            <!--/* 筛选栏：关键词（走显式「查询」钮）+ 物种下拉（data-autosubmit，只作用于 select）。
                   ⚠️ 关键词参数叫 vq 不叫 q —— q 是区块二「搜索并纳入」的候选搜索（V1.1.6 既有，
                      参数名不能动）。共用一个 q 的话，在上面找一个马甲会顺手把下面的候选表刷成另一批人。
                   ⚠️ 刷新监听挂在这里（#virtual-rows 之外）：放里面会被自己那次 swap 连听众一起换掉。 */-->
            <form th:fragment="virtual-filters" class="filter-bar" data-autosubmit
                  th:action="@{/admin/virtual-accounts}" method="get"
                  th:attr="hx-get=@{/admin/virtual-accounts}" hx-target="#virtual-rows" hx-swap="innerHTML"
                  hx-push-url="true">
                <label class="field">
                    <span th:text="#{admin.v130.publishIdentity.searchLabel}">关键词</span>
                    <input type="search" name="vq" class="inp" th:value="${vq}"
                           th:placeholder="#{admin.v130.publishIdentity.searchPlaceholder}" style="width:240px"/>
                </label>
                <label class="field">
                    <span th:text="#{admin.species.filter}">按账号物种定位筛选</span>
                    <select name="species" class="sel">
                        <option value="" th:text="#{admin.species.all}">全部</option>
                        <option th:each="sp : ${speciesOptions}" th:value="${sp}" th:text="${sp}"
                                th:selected="${species == sp}">GENERAL</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.users.search}">查询</button>
                <!--/* 🔴 hx-include="closest form" 不能省：筛选值若烤进 hx-get 就是**页面渲染那一刻**的值，
                       而筛选本身走 htmx 局部 swap（整页不重载、这个 span 不会被重渲染）。
                       结果是：筛完 → 在抽屉里改点东西 → 刷新事件按**加载时**的空筛选重拉，
                       表格无声无息跳回全量，运营刚才的筛选就没了。GET 请求 htmx 默认不带 closest form。 */-->
                <span hidden data-virtual-refresh
                      th:attr="hx-get=@{/admin/virtual-accounts}"
                      hx-include="closest form"
                      hx-trigger="admin:virtual-account-list-refresh from:body"
                      hx-target="#virtual-rows" hx-swap="innerHTML"></span>
            </form>

            <div th:fragment="virtual-summary" th:replace="~{admin/fragments/virtual-accounts-list :: sumbar(false)}"></div>

            <div th:fragment="virtual-table" id="virtual-rows">
                <div th:replace="~{admin/fragments/virtual-accounts-list :: rows(false)}"></div>
            </div>

            <div th:fragment="virtual-drawer" class="drawer-title"
                 th:text="#{admin.v130.publishIdentity.drawer.title}">虚拟账号详情</div>
        </div>

        <!--/* ===================== 区块二 · 运营真实账号 =====================
               整区门控 seed.publish_as_real，与 virtual_account.manage 完全解耦。
               🛡 本表达式与控制器 @PreAuthorize(REAL_AUTH) 必须逐字一致。
               ⚠️ 本区**不用 tpl-b-list**：它没有抽屉（AC2 只有候选表 + 池内表 + 确认弹层），
                  套一个永远打不开的抽屉壳只会在页面上留一段死标记（tpl-b-list 的 noDrawer 是为
                  只读列表页准备的，这里连筛选栏槽位也用不上）。 */-->
        <div sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('seed.publish_as_real')">
            <h2 th:text="#{admin.publishIdentity.realSection}">运营真实账号</h2>
            <p class="hint" th:text="#{admin.publishIdentity.realHint}">
                只接纳公司资产性质的人格化 IP 号，不接纳员工私人账号。</p>

            <h3 th:text="#{admin.publishIdentity.search}">搜索并纳入</h3>
            <!--/* 显式「搜索」钮（AC2）：候选搜索会把一批真人账号列出来，不该即输即查。 */-->
            <form class="filter-bar" th:action="@{/admin/virtual-accounts}" method="get"
                  th:attr="hx-get=@{/admin/virtual-accounts(section='candidates')}"
                  hx-target="#identity-candidates" hx-swap="innerHTML">
                <label class="field">
                    <span th:text="#{admin.publishIdentity.searchField}">用户 ID 或昵称</span>
                    <input type="search" name="q" class="inp" th:value="${q}" maxlength="50"/>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm"
                        th:text="#{admin.publishIdentity.btn.search}">搜索</button>
            </form>

            <div id="identity-candidates">
                <div th:replace="~{admin/fragments/publish-identities :: candidates}"></div>
            </div>
            <!--/* 纳入的 422 / 403 落点。**必须无条件渲染**：挂在候选行的表单里的话，
                   候选表一换（搜索 / 纳入成功）目标就没了，htmx 连请求都不会发。 */-->
            <p id="identity-inline-err" class="lst-inline-error" aria-live="polite"></p>

            <h3 th:text="#{admin.publishIdentity.realList}">身份池内的真实账号</h3>
            <div th:replace="~{admin/fragments/publish-identities :: rows(false)}"></div>
        </div>

        <!--/* 确认弹层的宿主（AC3）：停用虚拟账号 / 移出真实账号都把弹层片段拉到这里，
               片段自带 data-autoopen，admin-core.js 在 htmx swap 之后把它 showModal。 */-->
        <div id="confirm-host"></div>

        <!--/* ?open=<id> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="virtual"
              th:attr="data-drawer-deeplink=@{/admin/virtual-accounts/{id}/drawer(id=${open})}"></span>
    </div>
</div>
</body>
</html>
