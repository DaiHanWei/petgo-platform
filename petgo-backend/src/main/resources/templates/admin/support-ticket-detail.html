<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- 客服工单详情（Story 4.7）。support.handle 门控。结案「已联系+已解决」→ RESOLVED + 结案/CSAT 通知。 -->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.ticket.title}">工单详情 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.ticket.title}">工单详情</h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <p><a class="btn btn-neutral btn-sm" th:href="@{/admin/support-tickets}" th:text="#{admin.common.backToList}">返回列表</a></p>

        <table>
            <tr><th th:text="#{admin.ticket.ticket}">工单</th><td th:text="${ticket.ticketToken}">tok</td></tr>
            <tr><th th:text="#{admin.ticket.subject}">标题</th><td th:text="${ticket.subject}">subject</td></tr>
            <tr><th th:text="#{admin.ticket.body}">正文</th><td th:text="${ticket.body}">body</td></tr>
            <tr><th th:text="#{admin.ticket.contact}">联系方式</th><td><span th:text="${ticket.contactType}">EMAIL</span> · <span th:text="${ticket.contactValue}">x</span></td></tr>
            <tr><th th:text="#{admin.ticket.needContact}">需联系</th><td th:text="${ticket.needContact} ? #{admin.common.yes} : #{admin.common.no}">是</td></tr>
            <tr><th th:text="#{admin.ticket.contacted}">已联系</th><td th:text="${ticket.contacted} ? #{admin.common.yes} : #{admin.common.no}">否</td></tr>
            <tr><th th:text="#{admin.common.status}">状态</th><td th:text="${ticket.status}">OPEN</td></tr>
            <tr><th th:text="#{admin.ticket.labels}">标签</th><td th:text="${#strings.listJoin(ticket.labels, ', ')} ?: '—'">—</td></tr>
            <!-- Story 3-2：同时显示类型 —— 两类订单号长得不一样，但不写明类型的话
                 「TOKO-20260916-000042」出现在一个本该是问诊单的位置时没人会觉得不对。 -->
            <tr><th th:text="#{admin.ticket.relatedOrder}">关联订单</th>
                <td th:if="${ticket.relatedOrderToken == null}">—</td>
                <td th:unless="${ticket.relatedOrderToken == null}">
                    <span th:text="${ticket.relatedOrderType == 'SHOP'} ? #{admin.ticket.orderType.shop} : #{admin.ticket.orderType.consult}">问诊单</span>
                    · <span th:text="${ticket.relatedOrderToken}">tok</span>
                </td></tr>
            <tr th:if="${ticket.refundToken != null}"><th th:text="#{admin.ticket.refund}">退款单</th>
                <td><a th:href="@{/admin/refunds/{t}(t=${ticket.refundToken})}" th:text="${ticket.refundToken}">tok</a>
                    · <span th:text="${ticket.refundNeedDecision}">PENDING</span></td></tr>
            <tr><th th:text="#{admin.ticket.attachments}">附件</th>
                <td>
                    <!-- 附件后台内预览（bug 20260728-387）：短 TTL 签名 URL，data-lightbox 走全局灯箱 -->
                    <span th:if="${#lists.isEmpty(ticket.attachmentUrls)}" th:text="${ticket.attachmentCount}">0</span>
                    <img th:each="url : ${ticket.attachmentUrls}" th:src="${url}" data-lightbox
                         alt="attachment" style="max-height:120px;max-width:160px;margin:2px;cursor:zoom-in"/>
                </td></tr>
            <tr><th>CSAT</th><td><span th:text="${ticket.csatScore} ?: '—'">—</span> <span th:text="${ticket.csatComment} ?: ''"></span></td></tr>
            <tr><th th:text="#{admin.ticket.resolvedAt}">结案时间</th>
                <td th:text="${ticket.resolvedAt != null} ? ${@adminTime.wib(ticket.resolvedAt)} : '—'">—</td></tr>
        </table>

        <!-- AB-5B 客服判定（bug 20260728-384/388）：关联订单 → 批准/驳回退款需求 -->
        <div sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('support.handle')"
             th:if="${ticket.status == 'OPEN' or ticket.status == 'IN_PROGRESS'}">
            <h3 th:text="#{admin.ticket.relatedOrder}">关联订单</h3>
            <form method="post" th:action="@{/admin/support-tickets/{t}/link-order(t=${ticket.ticketToken})}">
                <!-- 🔴 必须 th:selected 回显当前类型：重新关联一张电商工单时若默认跳回
                     CONSULT，客服把电商 token 粘对了也只会拿到「订单不存在」404，
                     而错误信息完全看不出是类型选错了。 -->
                <select name="orderType">
                    <option value="CONSULT" th:selected="${ticket.relatedOrderType != 'SHOP'}"
                            th:text="#{admin.ticket.orderType.consult}">问诊单</option>
                    <option value="SHOP" th:selected="${ticket.relatedOrderType == 'SHOP'}"
                            th:text="#{admin.ticket.orderType.shop}">电商订单</option>
                </select>
                <input type="text" name="orderToken" th:placeholder="#{admin.ticket.ph.orderToken}" placeholder="订单号（orderToken）" required/>
                <button class="btn btn-sm" type="submit" th:text="${ticket.relatedOrderToken == null} ? #{admin.ticket.btn.linkOrder} : #{admin.ticket.btn.relinkOrder}">关联订单</button>
            </form>
        </div>
        <div sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('refund.submit')"
             th:if="${(ticket.status == 'OPEN' or ticket.status == 'IN_PROGRESS')
                      and ticket.relatedOrderToken != null
                      and ticket.relatedOrderType == 'CONSULT'
                      and (ticket.refundNeedDecision == null or ticket.refundNeedDecision == 'PENDING')}">
            <h3 th:text="#{admin.ticket.section.refundDecision}">退款需求判定</h3>
            <form method="post" th:action="@{/admin/support-tickets/{t}/refund-approve(t=${ticket.ticketToken})}"
                  style="display:inline"
                  th:attr="onsubmit='return confirm(&quot;' + #{admin.ticket.confirm.refundApprove(${ticket.relatedOrderToken})} + '&quot;)'">
                <button class="btn btn-sm" type="submit" th:text="#{admin.ticket.btn.refundApprove}">批准退款需求</button>
            </form>
            <form method="post" th:action="@{/admin/support-tickets/{t}/refund-reject(t=${ticket.ticketToken})}"
                  style="display:inline"
                  th:attr="onsubmit='return confirm(&quot;' + #{admin.ticket.confirm.refundReject} + '&quot;)'">
                <button class="btn btn-neutral btn-sm" type="submit" th:text="#{admin.ticket.btn.refundReject}">驳回退款需求</button>
            </form>
        </div>

        <!-- 结案（仅 OPEN/IN_PROGRESS 可）：勾「已联系+已解决」-->
        <div sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('support.handle')"
             th:if="${ticket.status == 'OPEN' or ticket.status == 'IN_PROGRESS'}">
            <h3 th:text="#{admin.ticket.section.resolve}">结案</h3>
            <form method="post" th:action="@{/admin/support-tickets/{t}/resolve(t=${ticket.ticketToken})}">
                <button class="btn btn-sm" type="submit" th:text="#{admin.ticket.btn.resolve}">已联系 + 已解决（结案）</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
