<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  支付记录通用查询（Story 9.6 · AB-8E → V1.3.0 Story 8.5 套模板 B · tpl-b-list，UI 稿 4-3）。
  按用户跨类型只读查 payment_intents。8.5 的改动是页面组织：汇总卡→摘要条三格、点行开抽屉；
  筛选参数名（userId / purpose / status / from / to / page）与导出的权限、参数逐字未动。
  ⚠️ 筛选表单仍是**整页 GET**（AC1 要求显式「查询」钮）：所以下面刷新槽里那串烤进去的筛选值
     永远等于当前这一页的筛选 —— 换筛选必然整页重载，不存在「筛选变了、槽位没变」的窗口。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.payments.title}">支付记录查询 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <!--/* ⚠️ res 设在这一层，不能写在下面那个带 th:replace 的 div 上（优先级 100 vs 600，
           同标签时 th:with 被静默丢弃 —— 见 AdminTemplateStructureTest 的守门）。 */-->
    <div th:fragment="content" th:remove="tag" th:with="res='payment'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.payments.title}">支付记录查询</h1>
            <!--/* 🔴 文案是「导出当前结果」：这个端点接收与列表**同一套**筛选参数，
                   导出的就是屏幕上正在看的那一份（与兽医订单页的「导出全部」刻意不同）。
                   ⚠️ sec:authorize 与控制器的 EXPORT_AUTH 逐字一致，否则按钮在、点了 403。 */-->
            <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('payment.list_export')"
               class="btn btn-neutral btn-sm" data-no-drawer
               th:href="@{/admin/payments/export.xlsx(userId=${userId},purpose=${purpose},status=${status},from=${from},to=${to})}"
               th:text="#{admin.v130.payments.exportCurrent}">导出当前结果</a>
        </div>
        <p class="hint" th:text="#{admin.payments.hint.all}">按时间倒序分页展示全部支付记录；可按用途、状态、时间段、用户 ID 组合筛选。</p>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::payment-filters}, ~{::payment-summary}, ~{::payment-table}, ~{::payment-drawer})}">
            <form th:fragment="payment-filters" method="get" th:action="@{/admin/payments}">
                <label class="field"><span th:text="#{admin.common.userId}">用户 ID</span>
                    <input type="number" name="userId" class="inp" th:value="${userId}"/></label>
                <label class="field"><span th:text="#{admin.payments.col.purpose}">用途</span>
                    <select name="purpose" class="sel">
                        <option value="" th:text="#{admin.payments.filter.allPurposes}">全部用途</option>
                        <option th:each="o : ${purposeOptions}" th:value="${o}"
                                th:selected="${purpose == o.name()}"
                                th:text="#{'admin.payments.purpose.' + ${o}}">VET_CONSULT</option>
                    </select></label>
                <label class="field"><span th:text="#{admin.common.status}">状态</span>
                    <select name="status" class="sel">
                        <option value="" th:text="#{admin.payments.filter.allStatuses}">全部状态</option>
                        <option th:each="o : ${statusOptions}" th:value="${o}"
                                th:selected="${status == o.name()}"
                                th:text="#{'admin.payments.status.' + ${o}}">PAID</option>
                    </select></label>
                <!--/* 🛡 WIB 字样必须在输入框旁：后台一律按雅加达时间解释，而运营在 UTC+8 ——
                       不标注就会按自己的表理解这个区间。「止」**含当天**（服务层取次日 00:00 为上界），
                       否则起止选同一天会查不到东西。 */-->
                <label class="field"><span th:text="#{admin.payments.filter.dateRange}">时间段（WIB，含止当天）</span>
                    <input type="date" name="from" class="inp" th:value="${from}"/>
                    <input type="date" name="to" class="inp" th:value="${to}"/>
                    <span class="muted">WIB</span></label>
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.payments.btn.search}">查询</button>
                <a th:href="@{/admin/payments}" class="btn btn-sm" data-no-drawer
                   th:text="#{admin.payments.btn.reset}">清空筛选</a>
            </form>

            <div th:fragment="payment-summary" th:replace="~{admin/fragments/payments-list :: sumbar(false)}"></div>

            <div th:fragment="payment-table" th:remove="tag">
                <!--/* ⚠️ 口径说明放在 #payments-rows **外面**：整表重拉是 innerHTML 换掉这个容器，
                       放在里面的话刷新一次它就没了（而它正是这一页最需要一直看得见的一句）。 */-->
                <div id="payments-rows">
                    <div th:replace="~{admin/fragments/payments-list :: rows(false)}"></div>
                </div>
                <p class="hint" data-notice="payments-summary-scope" th:text="#{admin.payments.sum.note}">
                    「成功金额」只计已支付、且经收款渠道真正到账的金额。</p>
            </div>

            <div th:fragment="payment-drawer" class="drawer-title"
                 th:text="#{admin.v130.payments.drawer.title}">支付意图</div>
        </div>

        <!--/* 模拟回调（仅 stag）改了状态之后整表重拉：状态列与摘要条的「已支付 / 现金收入」都会变。
               ⚠️ 筛选值是渲染时烤进去的静态串 —— 这里成立，因为筛选走整页 GET（换筛选必然重渲染这一段）；
                  页码也一并带上，否则刷新会把运营从第 3 页扔回第 1 页。 */-->
        <span hidden id="payments-refresh" th:if="${stag}"
              th:attr="hx-get=@{/admin/payments(page=${page},userId=${userId},purpose=${purpose},status=${status},from=${from},to=${to})}"
              hx-trigger="admin:payment-list-refresh from:body"
              hx-target="#payments-rows" hx-swap="innerHTML"></span>

        <!--/* ?open=<publicToken> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="payment"
              th:attr="data-drawer-deeplink=@{/admin/payments/{t}/drawer(t=${open})}"></span>
    </div>
</div>
</body>
</html>
