<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<!-- 支付记录通用查询（Story 9.6，AB-8E）。按用户跨类型只读查 payment_intents。 -->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.payments.title}">支付记录查询 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.payments.title}">支付记录查询</h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <p class="hint" th:if="${userId == null}" th:text="#{admin.payments.hint.all}">按时间倒序分页展示全部支付记录（跨类型：兽医咨询 / 充值 / AI 解锁 / 高清图）；如需精确排查可按用户 ID 过滤。</p>
        <p class="hint" th:if="${userId != null}" th:text="#{admin.payments.hint.filtered(${userId})}">当前按用户 ID 过滤；清空用户 ID 再查询可返回最近记录列表。</p>
        <form method="get" th:action="@{/admin/payments}">
            <label><span th:text="#{admin.common.userId}">用户 ID</span> <input type="number" name="userId" th:value="${userId}"/></label>
            <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.payments.btn.search}">查询</button>
            <a th:if="${userId != null}" th:href="@{/admin/payments}" class="btn btn-sm" th:text="#{admin.payments.btn.backRecent}">返回最近记录</a>
        </form>
        <table th:if="${payments != null}">
            <thead>
            <tr><th th:text="#{admin.common.user}">用户</th><th th:text="#{admin.payments.col.paymentNo}">支付号</th><th th:text="#{admin.payments.col.purpose}">用途</th><th th:text="#{admin.common.channel}">渠道</th><th th:text="#{admin.common.amount}">金额</th><th th:text="#{admin.payments.col.currency}">币种</th><th th:text="#{admin.common.status}">状态</th><th th:text="#{admin.common.time}">时间</th><th th:text="#{admin.common.actions}">操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td th:text="${p.userId}">0</td>
                <td th:text="${p.displayNo != null ? p.displayNo : p.publicToken}" th:title="${p.publicToken}">no</td>
                <td th:text="${p.purpose}">VET_CONSULT</td>
                <td th:text="${p.channel}">QRIS</td>
                <td th:text="${p.amount}">0</td>
                <td th:text="${p.currency}">IDR</td>
                <td th:text="${p.status}">PAID</td>
                <td th:text="${p.createdAtLabel}">t</td>
                <td>
                    <!-- ⚠️ stag 专用：仅 simulatorEnabled(stag env flag) 开 + PENDING 订单才渲染操作按钮 -->
                    <div th:if="${simulatorEnabled and p.status == 'PENDING'}" class="sim-actions">
                        <form method="post" style="display:inline"
                              th:action="@{/admin/payments/{t}/simulate(t=${p.publicToken})}">
                            <input type="hidden" name="target" value="SUCCESS"/>
                            <button type="submit" class="btn btn-sm btn-primary">成功</button>
                        </form>
                        <form method="post" style="display:inline"
                              th:action="@{/admin/payments/{t}/simulate(t=${p.publicToken})}">
                            <input type="hidden" name="target" value="FAILED"/>
                            <button type="submit" class="btn btn-sm">失败</button>
                        </form>
                        <form method="post" style="display:inline"
                              th:action="@{/admin/payments/{t}/simulate(t=${p.publicToken})}">
                            <input type="hidden" name="target" value="EXPIRED"/>
                            <button type="submit" class="btn btn-sm">过时</button>
                        </form>
                    </div>
                    <span th:unless="${simulatorEnabled and p.status == 'PENDING'}" class="muted">—</span>
                </td>
            </tr>
            <tr th:if="${payments.isEmpty()}"><td colspan="9" th:text="${userId == null} ? #{admin.payments.empty} : #{admin.payments.emptyForUser}">暂无支付记录</td></tr>
            </tbody>
        </table>
        <div class="pager" th:if="${userId == null and payments != null and totalPages > 0}">
            <a th:if="${hasPrev}" th:href="@{/admin/payments(page=${page - 1})}" class="btn btn-sm" th:text="#{admin.audit.prev}">上一页</a>
            <span th:text="#{admin.audit.page(${page + 1}, ${totalPages}, ${totalElements})}">分页</span>
            <a th:if="${hasNext}" th:href="@{/admin/payments(page=${page + 1})}" class="btn btn-sm" th:text="#{admin.audit.next}">下一页</a>
        </div>
    </div>
</div>
</body>
</html>
