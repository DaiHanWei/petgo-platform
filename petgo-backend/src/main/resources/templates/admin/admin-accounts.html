<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  B24 后台账号（Story 1.5 → V1.3.0 Story 6.5 套模板 B + 抽屉，AD-11）。两级权限：SUPER_ADMIN 隐式全权；STAFF 按勾选 permission_code。
  门控在控制器 @PreAuthorize；页面 sec:authorize 隐藏入口仅体验。
  摘要条：账号总数 · 启用中 · 已停用 · 超管数/5 → 表（显示名 / Lark 邮箱 / 岗位角色 / 类型 / 状态 / 创建时间）→ 点行开抽屉
  GET /admin/accounts/{id}/drawer（fragments/drawer-admin-account.html：改名 / 换绑 / 改角色 / 改权限 / 停用 / 激活，全部 hx-post 原端点）。
  「创建账号」收进右上按钮 → 第二个抽屉（account-new，表单预渲染在页内：无 JS 时也能提交，字段与 createAdminAccountForm 不变）。
  写端点全部来自 Epic 1，本 story 一个不加；新增只读 GET …/drawer、…/new/drawer。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.accounts.title}">后台账号 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='accounts'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.accounts.title}">后台账号</h1>
            <button type="button" class="btn btn-primary btn-sm" data-drawer-open="" data-drawer-res="account-new"
                    th:attr="data-drawer-autoopen=${openCreate} ? 'true' : null"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('admin.create_account')"
                    th:text="#{admin.accounts.create}">创建账号</button>
        </div>
        <p class="muted" th:text="#{admin.accounts.subtitle}">两级权限：超级管理员隐式全权；普通账号按勾选模块权限授权。</p>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{}, ~{::ac-summary}, ~{::ac-table}, ~{::ac-drawer})}">
            <div th:fragment="ac-summary" th:replace="~{admin/admin-accounts :: sumbar(false)}"></div>

            <div th:fragment="ac-table" id="accounts-rows">
                <table>
                    <thead>
                    <tr>
                        <th th:text="#{admin.accounts.col.name}">显示名</th>
                        <th th:text="#{admin.accounts.col.email}">Lark 邮箱</th>
                        <th th:text="#{admin.accounts.col.role}">岗位角色</th>
                        <th th:text="#{admin.accounts.col.type}">类型</th>
                        <th th:text="#{admin.accounts.col.status}">状态</th>
                        <th th:text="#{admin.v130.accounts.col.createdAt}">创建时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!--/* ⚠️ th:each 与 th:replace 不能同标签：replace 的优先级(100)高于 each(200)，each 根本不会跑，
                           ${a} 以 null 进片段 → 整页 500。外面套一层 th:block（fragments/places-list.html:53 同一范式）。 */-->
                    <th:block th:each="a : ${accounts}"><tr th:replace="~{admin/admin-accounts :: row(${a}, false)}"></tr></th:block>
                    </tbody>
                </table>
            </div>

            <div th:fragment="ac-drawer" class="drawer-title" th:text="#{admin.v130.accounts.drawer.title}">账号详情</div>
        </div>

        <!--/* 创建账号抽屉（第二个抽屉容器；表单预渲染，字段与 createAdminAccountForm 不变；校验错误时整页回显在此）。
               ⚠️ 门必须挂在**外层** th:block：sec:authorize 优先级(300)低于 th:replace(100)，写在同一标签上会被静默忽略，
                  只读账号也会拿到整份建号表单与权限码全集（config.html:27 是正确写法）。 */-->
        <th:block sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('admin.create_account')">
            <div th:replace="~{admin/fragments/tpl-shared :: drawerWithBody('account-new', ~{::ac-new-title}, ~{::ac-new-body})}">
                <span th:fragment="ac-new-title" th:text="#{admin.accounts.create}">创建账号</span>
                <div th:fragment="ac-new-body" th:replace="~{admin/fragments/drawer-admin-account :: createForm}"></div>
            </div>
        </th:block>
    </div>

    <!--/* 摘要条（oob=true：抽屉内停用 / 重新激活后随处置响应一并换，否则「启用中 / 已停用」会停在旧值） */-->
    <div th:fragment="sumbar(oob)" class="sum" id="accounts-summary" th:attr="hx-swap-oob=${oob} ? 'true' : null">
        <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.accounts.summary.total}">账号总数</div><div class="sum-value" th:text="${summary.total}">0</div></div>
        <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.accounts.summary.active}">启用中</div><div class="sum-value" th:text="${summary.active}">0</div></div>
        <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.accounts.summary.disabled}">已停用</div><div class="sum-value" th:text="${summary.disabled}">0</div></div>
        <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.accounts.summary.superAdmins}">超管数</div>
            <div class="sum-value"><span th:text="${summary.superAdmins}">1</span><span class="muted"> / 5</span></div></div>
    </div>

    <!-- 表格行（oob=true 时按 id 原位替换：抽屉内处置成功后带回） -->
    <tr th:fragment="row(a, oob)" th:id="'account-row-' + ${a.id}" th:attr="data-id=${a.id},data-drawer-url=@{/admin/accounts/{id}/drawer(id=${a.id})},hx-swap-oob=${oob} ? 'true' : null"
        th:classappend="${a.status.name() == 'DISABLED'} ? 'row-muted'" tabindex="0">
        <td><span th:text="${a.displayName}">名</span> <span class="muted rv-small" th:text="'#' + ${a.id}">#1</span></td>
        <td th:text="${a.larkEmail}">x@y</td>
        <td>
            <span class="tag role-tag" th:classappend="'role-' + ${a.role}"
                  th:text="${a.roleCustom()} ? ${a.roleName ?: a.role} : #{${a.roleNameKey()}}" th:title="${a.selectedValue()}">运营专员</span>
            <span class="muted" th:if="${a.roleCustom()}" th:text="#{admin.accounts.role.customBadge}">自定义</span>
        </td>
        <td><span class="badge" th:classappend="${a.accountType.name() == 'SUPER_ADMIN'} ? 'badge-warn' : 'badge-muted'"
                  th:text="${a.accountType.name() == 'SUPER_ADMIN'} ? #{admin.v130.accounts.type.superAdmin} : #{admin.v130.accounts.type.staff}">超管</span></td>
        <td>
            <span th:if="${a.status.name() == 'ACTIVE'}" class="status-active" th:text="#{admin.v130.accounts.status.active}">启用</span>
            <span th:if="${a.status.name() == 'DISABLED'}" class="status-disabled" th:text="#{admin.v130.accounts.status.disabled}">已停用</span>
        </td>
        <td class="nowrap" th:text="${a.createdAt != null} ? ${@adminTime.wib(a.createdAt)} : '-'">-</td>
    </tr>
</div>
</body>
</html>
