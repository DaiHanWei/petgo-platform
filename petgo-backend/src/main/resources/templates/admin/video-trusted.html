<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  视频免审名单（专题线 video · Story 1.1 · FR-22，决策 V-25）。只读列表：加入 / 移出在用户抽屉「处置」页签完成
  （video.trusted.manage 门控）。点昵称跳到用户列表并自动开该用户抽屉。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.nav.videoTrusted}">视频免审名单 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.nav.videoTrusted}">视频免审名单</h1>
        <p class="muted" th:text="#{admin.videoTrusted.subtitle}">名单内账号发视频免审、直接公开。加入 / 移出请在用户详情的「处置」页签操作。</p>

        <!--/* 按总条数判空：手动访问越界页码时 rows 为空但名单不空，不能说「名单为空」（code-review 2026-10-16）。 */-->
        <p class="muted" th:if="${page.totalElements == 0}" th:text="#{admin.videoTrusted.empty}">名单为空。</p>
        <table th:if="${!#lists.isEmpty(rows)}" class="tags-table" id="video-trusted-rows">
            <thead>
            <tr>
                <th th:text="#{admin.videoTrusted.col.user}">用户</th>
                <th th:text="#{admin.videoTrusted.col.userId}">用户 ID</th>
                <th th:text="#{admin.videoTrusted.col.vipLevel}">会员等级</th>
                <th th:text="#{admin.videoTrusted.col.addedBy}">加入人</th>
                <th th:text="#{admin.videoTrusted.col.addedAt}">加入时间（WIB）</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <!--/* 昵称链接到用户抽屉：抽屉要 user.view。只有名单权限的账号看纯文本，免得点进去 403（code-review 2026-10-16）。
                       ⚠️ 维护名单（加入 / 移出）在用户抽屉里做，所以实际操作还需要 user.view。 */-->
                <td th:with="nick=${r.nickname() != null and !r.nickname().isBlank()} ? ${r.nickname()} : #{admin.videoTrusted.noNickname}">
                    <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.view')"
                       th:href="@{/admin/users(open=${r.userId()})}" th:text="${nick}">昵称</a>
                    <span sec:authorize="!(hasRole('SUPER_ADMIN') or hasAuthority('user.view'))" th:text="${nick}">昵称</span>
                </td>
                <td th:text="${r.userId()}">1</td>
                <td>
                    <b th:text="${r.vipLevel()}">10</b>
                    <span class="muted" th:if="${r.vipLevel() < 10}" th:text="#{admin.videoTrusted.levelTooLow}">（等级不足 10，无法发视频）</span>
                </td>
                <td th:text="${r.addedBy()}">运营</td>
                <td th:text="${@adminTime.wib(r.addedAt())}">-</td>
            </tr>
            </tbody>
        </table>

        <div class="pager" th:if="${page != null and page.totalElements > 0}" th:attr="data-page=${page.number}">
            <a th:if="${page.hasPrevious()}" th:href="@{/admin/video-trusted(page=${page.number - 1})}"
               th:text="#{admin.audit.prev}">← 上一页</a>
            <span th:text="#{admin.audit.page(${page.number + 1}, ${page.totalPages}, ${page.totalElements})}">分页</span>
            <a th:if="${page.hasNext()}" th:href="@{/admin/video-trusted(page=${page.number + 1})}"
               th:text="#{admin.audit.next}">下一页 →</a>
        </div>
    </div>
</div>
</body>
</html>
