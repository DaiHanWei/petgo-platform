<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  运营后台外壳（Story 3.1；1.6 外化 i18n + 换肤）。侧栏导航 + 顶栏（语言切换 + 退出）。
  样式全在 static/admin/admin.css（各业务页在自身 <head> 引入；本 layout 仅提供 page 片段）。
  用法：业务页 th:replace="~{admin/layout :: page(~{::content})}"。
-->
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div class="layout" th:fragment="page(content)">
    <nav>
        <div class="brand" th:text="#{admin.brand}">🐾 TailTopia 运营</div>
        <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'"
           th:text="#{admin.nav.dashboard}">概览</a>
        <details class="nav-section"
                 th:attr="open=${active == 'seed' or active == 'tickets' or active == 'content' or active == 'comments' or active == 'manual-review' or active == 'users'} ? 'open' : null">
            <summary th:classappend="${active == 'seed' or active == 'tickets' or active == 'content' or active == 'comments' or active == 'manual-review' or active == 'users'} ? 'active'"
                     th:text="#{admin.nav.group.content}">内容</summary>
            <div class="nav-sub">
                <a th:href="@{/admin/seed-post}" th:classappend="${active == 'seed'} ? 'active'"
                   th:text="#{admin.nav.seed}">种子内容发布</a>
                <!-- 批量内容工作台（V1.1.6 Story 13.2）。与单条发布同一门：
                     🛡 与 AdminSeedBatchWorkspaceController 的 @PreAuthorize 逐字一致。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('virtual_account.manage')"
                   th:href="@{/admin/seed-batches}" th:classappend="${active == 'seed-batches'} ? 'active'"
                   th:text="#{admin.nav.seedBatches}">批量内容</a>
                <!-- 排期管理（V1.1.6 Story 13.5）。🛡 与 AdminContentScheduleController 的门逐字一致。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('virtual_account.manage')"
                   th:href="@{/admin/content-schedules}" th:classappend="${active == 'content-schedules'} ? 'active'"
                   th:text="#{admin.nav.contentSchedules}">排期管理</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.proactive_takedown')"
                   th:href="@{/admin/content}" th:classappend="${active == 'content'} ? 'active'"
                   th:text="#{admin.nav.content}">内容管理</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.proactive_takedown')"
                   th:href="@{/admin/comments}" th:classappend="${active == 'comments'} ? 'active'"
                   th:text="#{admin.nav.comments}">评论管理</a>
                <!-- ⚠️ 这个条件必须与 ManualReviewAdminController.QUEUE_AUTH 保持一致
                     （2026-08-20 一并放宽到 content.takedown）。两边不一致时的表现最难查：
                     权限放行了、直接敲 URL 能进，但侧栏里没有这个链接 ——
                     运营只会得出「我没有这个功能」。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.manual_review') or hasAuthority('content.takedown')"
                   th:href="@{/admin/manual-review}" th:classappend="${active == 'manual-review'} ? 'active'"
                   th:text="#{admin.nav.review}">人工复核</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.view')"
                   th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'active'"
                   th:text="#{admin.nav.users}">用户</a>
                <!-- ⚠️ 顺序由产品指定（2026-08-20）：种子内容发布 → 内容管理 → 评论管理 →
                     人工复核 → 用户 → **被举报用户**。别按字母序或「新加的往后排」自行调整。
                     被举报用户排在末位是因为它是账号级处置（警告/封号），与前面几项的内容维度不同。 -->
                <!-- V1.1.4 Story 3.1：统一队列**完全替代**旧的举报队列（/admin/reports 已重定向到这里）。
                     2026-08-19 再拆：本项只留**用户举报**（账号级处置：警告/封号），
                     内容举报与名称/头像审核移入「人工复核」——按「能不能在本页处置」分家，
                     此前账号标识字段挤在这里只能看不能处置。名称/头像审核页已删除（列表并入人工复核）。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.view_tickets')"
                   th:href="@{/admin/tickets}" th:classappend="${active == 'tickets'} ? 'active'"
                   th:text="#{admin.nav.tickets}">被举报用户</a>
            </div>
        </details>
        <!-- 内容运营（后台 PRD 模块 15）：顶置坑位 / 装饰标签。
             ⚠️ 刻意**另起一个分组**，不塞进上面的「内容」分组 —— 那个分组的次序是产品
             2026-08-20 逐项指定过的（种子内容发布→内容管理→评论管理→人工复核→用户→被举报用户），
             往中间插一项会打乱它，且渲染烟测 contentNavKeepsTheProductSpecifiedOrder 正盯着那个顺序。
             本分组后续由 Story 11.2（装饰标签）继续加项。 -->
        <details class="nav-section"
                 sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.pin_view') or hasAuthority('content.tag_view') or hasAuthority('content.stats_view')"
                 th:attr="open=${active == 'content-pins' or active == 'content-tags'} ? 'open' : null">
            <summary th:classappend="${active == 'content-pins' or active == 'content-tags'} ? 'active'"
                     th:text="#{admin.nav.group.contentOps}">内容运营</summary>
            <div class="nav-sub">
                <!-- 🛡 本条件必须与 AdminContentPinController 的 @PreAuthorize(VIEW) **逐字一致**：
                     两边走散时，权限放行了、敲 URL 能进，但侧栏没链接 —— 运营只会以为自己没这个功能，
                     而日志、403、报错一概没有，无从下手。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.pin_view')"
                   th:href="@{/admin/content-pins}" th:classappend="${active == 'content-pins'} ? 'active'"
                   th:text="#{admin.nav.contentPins}">顶置管理</a>
                <!-- 🛡 与 AdminContentTagController 的 @PreAuthorize(VIEW) 逐字一致 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.tag_view')"
                   th:href="@{/admin/content-tags}" th:classappend="${active == 'content-tags'} ? 'active'"
                   th:text="#{admin.nav.contentTags}">装饰标签</a>
                <!-- 内容互动积分（V1.1.6 Story 15.1）。
                     🛡 与 AdminContentStatsController.VIEW 逐字一致 ——
                     不一致的表现是"看得见入口点进去 403"或"有权限却看不到入口"。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.stats_view')"
                   th:href="@{/admin/content-stats}" th:classappend="${active == 'content-stats'} ? 'active'"
                   th:text="#{admin.nav.contentStats}">内容互动积分</a>
            </div>
        </details>
        <!-- 用户运营（后台 PRD 模块 12）：用户标签。
             ⚠️ 刻意**不并入上面的「内容运营」** —— 用户标签挂在人身上、不是内容，
             并入会让分组名与内容不符；而改「内容运营」这个名字要连带改四处（侧栏名/页内标题/
             页面说明/权限显示名），代价更大。 -->
        <details class="nav-section"
                 sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.tag_view')"
                 th:attr="open=${active == 'user-tags'} ? 'open' : null">
            <summary th:classappend="${active == 'user-tags'} ? 'active'"
                     th:text="#{admin.nav.group.userOps}">用户运营</summary>
            <div class="nav-sub">
                <!-- 🛡 与 AdminUserTagController 的 @PreAuthorize(VIEW) 逐字一致 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.tag_view')"
                   th:href="@{/admin/user-tags}" th:classappend="${active == 'user-tags'} ? 'active'"
                   th:text="#{admin.nav.userTags}">用户标签</a>
            </div>
        </details>
        <details class="nav-section"
                 th:attr="open=${active == 'vets' or active == 'online' or active == 'failed-requests' or active == 'ratings'} ? 'open' : null">
            <summary th:classappend="${active == 'vets' or active == 'online' or active == 'failed-requests' or active == 'ratings'} ? 'active'"
                     th:text="#{admin.nav.group.vet}">兽医（Epic 5）</summary>
            <div class="nav-sub">
                <a th:href="@{/admin/vets}" th:classappend="${active == 'vets'} ? 'active'"
                   th:text="#{admin.nav.vets}">兽医账号</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('vet.view')"
                   th:href="@{/admin/vets/online}" th:classappend="${active == 'online'} ? 'active'"
                   th:text="#{admin.nav.online}">在线状态</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('vet.view')"
                   th:href="@{/admin/failed-requests}" th:classappend="${active == 'failed-requests'} ? 'active'"
                   th:text="#{admin.nav.failedRequests}">未成功请求</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('rating.view')"
                   th:href="@{/admin/ratings}" th:classappend="${active == 'ratings'} ? 'active'"
                   th:text="#{admin.nav.ratings}">兽医评分</a>
            </div>
        </details>
        <details class="nav-section" sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('consult.view_anomalies') or hasAuthority('consult.view_sessions')"
                 th:attr="open=${active == 'anomalies' or active == 'consult-sessions'} ? 'open' : null">
            <summary th:classappend="${active == 'anomalies' or active == 'consult-sessions'} ? 'active'"
                     th:text="#{admin.nav.group.consult}">问诊异常</summary>
            <div class="nav-sub">
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('consult.view_anomalies')"
                   th:href="@{/admin/anomalies}" th:classappend="${active == 'anomalies'} ? 'active'"
                   th:text="#{admin.nav.anomalies}">异常工单</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('consult.view_sessions')"
                   th:href="@{/admin/consult-sessions}" th:classappend="${active == 'consult-sessions'} ? 'active'"
                   th:text="#{admin.nav.sessions}">历史会话查询</a>
            </div>
        </details>
        <details class="nav-section" sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('support.handle')"
                 th:attr="open=${active == 'support-tickets'} ? 'open' : null">
            <summary th:classappend="${active == 'support-tickets'} ? 'active'"
                     th:text="#{admin.nav.group.support}">客服</summary>
            <div class="nav-sub">
                <a th:href="@{/admin/support-tickets}" th:classappend="${active == 'support-tickets'} ? 'active'"
                   th:text="#{admin.nav.supportTickets}">客服工单</a>
            </div>
        </details>
        <details class="nav-section"
                 sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('refund.submit') or hasAuthority('refund.approve') or hasAuthority('refund.payout')"
                 th:attr="open=${active == 'refunds'} ? 'open' : null">
            <summary th:classappend="${active == 'refunds'} ? 'active'"
                     th:text="#{admin.nav.group.refund}">退款</summary>
            <div class="nav-sub">
                <a th:href="@{/admin/refunds}" th:classappend="${active == 'refunds'} ? 'active'"
                   th:text="#{admin.nav.refunds}">退款管理</a>
            </div>
        </details>
        <details class="nav-section" sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.view') or hasAuthority('order.view') or hasAuthority('settlement.view') or hasAuthority('payment.view') or hasAuthority('risk.view') or hasAuthority('virtual_account.manage') or hasAuthority('seed.publish_as_real')"
                 th:attr="open=${active == 'config' or active == 'consult-orders' or active == 'ai-orders' or active == 'settlements' or active == 'payments' or active == 'red-overage' or active == 'virtual-accounts'} ? 'open' : null">
            <summary th:classappend="${active == 'config' or active == 'consult-orders' or active == 'ai-orders' or active == 'settlements' or active == 'payments' or active == 'red-overage' or active == 'virtual-accounts'} ? 'active'"
                     th:text="#{admin.nav.group.ops}">运营</summary>
            <div class="nav-sub">
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.view')"
                   th:href="@{/admin/config}" th:classappend="${active == 'config'} ? 'active'"
                   th:text="#{admin.nav.config}">运营配置</a>
                <!-- 🔴 算法参数独立成页、独立权限：不给运营（2026-08-26 产品决定）。
                     侧栏这条与控制器 @PreAuthorize 引用同一个 AdminPermissions 常量。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('config.algo_param_view')"
                   th:href="@{/admin/algo-params}" th:classappend="${active == 'algo-params'} ? 'active'"
                   th:text="#{admin.nav.algoParams}">算法参数</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('order.view')"
                   th:href="@{/admin/consult-orders}" th:classappend="${active == 'consult-orders'} ? 'active'"
                   th:text="#{admin.nav.consultOrders}">兽医订单</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('order.view')"
                   th:href="@{/admin/ai-orders}" th:classappend="${active == 'ai-orders'} ? 'active'"
                   th:text="#{admin.nav.aiOrders}">AI 订单</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('settlement.view')"
                   th:href="@{/admin/settlements}" th:classappend="${active == 'settlements'} ? 'active'"
                   th:text="#{admin.nav.settlements}">兽医月结</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('payment.view')"
                   th:href="@{/admin/payments}" th:classappend="${active == 'payments'} ? 'active'"
                   th:text="#{admin.nav.payments}">支付记录</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('risk.view')"
                   th:href="@{/admin/red-overage}" th:classappend="${active == 'red-overage'} ? 'active'"
                   th:text="#{admin.nav.redOverage}">红色超额</a>
                <!-- 🛡 本表达式与 AdminVirtualAccountController 的 VIEW_AUTH **逐字一致**。
                     必须含 seed.publish_as_real：只持有该码的人（管真实发布身份、不管虚拟账号）
                     否则会看得见入口、点进去 403。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('virtual_account.view') or hasAuthority('virtual_account.manage') or hasAuthority('seed.publish_as_real')"
                   th:href="@{/admin/virtual-accounts}" th:classappend="${active == 'virtual-accounts'} ? 'active'"
                   th:text="#{admin.nav.virtualAccounts}">运营发布身份</a>
            </div>
        </details>
        <details class="nav-section"
                 sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('admin.view_logs') or hasAuthority('admin.create_account')"
                 th:attr="open=${active == 'audit-logs' or active == 'accounts'} ? 'open' : null">
            <summary th:classappend="${active == 'audit-logs' or active == 'accounts'} ? 'active'"
                     th:text="#{admin.nav.group.security}">安全</summary>
            <div class="nav-sub">
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('admin.view_logs')"
                   th:href="@{/admin/audit-logs}" th:classappend="${active == 'audit-logs'} ? 'active'"
                   th:text="#{admin.nav.audit}">操作审计</a>
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('admin.create_account')"
                   th:href="@{/admin/accounts}" th:classappend="${active == 'accounts'} ? 'active'"
                   th:text="#{admin.nav.accounts}">后台账号</a>
            </div>
        </details>
    </nav>
    <main>
        <div class="topbar">
            <span class="lang">
                <span th:text="#{admin.topbar.lang}">语言</span>:
                <a href="?lang=zh_CN" th:text="#{admin.topbar.lang.zh}">中文</a>
                /
                <a href="?lang=en" th:text="#{admin.topbar.lang.en}">EN</a>
                /
                <a href="?lang=id" th:text="#{admin.topbar.lang.id}">ID</a>
            </span>
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="logout" th:text="#{admin.topbar.logout}">退出登录</button>
            </form>
        </div>
        <!-- 全站 toast（仅有 ${toast} flash 时出现，admin.js 定时自动消失，bug 346）。 -->
        <div class="toast" role="status" th:if="${toast}" th:text="${toast}">toast</div>
        <div th:replace="${content}">页面内容占位</div>
    </main>
</div>
</body>
</html>
