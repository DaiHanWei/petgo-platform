<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  运营后台外壳（Story 3.1；1.6 外化 i18n + 换肤；V1.3.0 Story 2.2 G0 重构）。
  · 侧栏：fragments/nav.html，由 AdminPageCatalog 驱动（GlobalModelAdvice 注入 navGroups）——本文件不再手写导航与 sec:authorize。
  · 顶栏：语言切换（当前语言 .on）+ STAG 角标（stag profile 才有 ${stag}）+ 账号菜单（显示名 · 角色徽标，取登录时 principal，D-2）。
  · htmx 统一在本壳末尾引入（各业务页不再各自引；admin-core.js 的 htmx 全局钩子依赖此顺序，D-31 不升级 1.9.12）。
  · CSRF：page 片段里放 <span data-csrf …>，admin-core.js 的 htmx:configRequest 统一注入 X-CSRF-TOKEN。
  样式全在 static/admin/admin.css（各业务页在自身 <head> 引入；本 layout 仅提供 page 片段）。
  用法：业务页 th:replace="~{admin/layout :: page(~{::content})}"。
-->
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div class="layout" th:fragment="page(content)">
    <nav th:replace="~{admin/fragments/nav :: nav(${active}, ${navGroups})}"></nav>
    <main>
        <div class="topbar">
            <span class="lang">
                <span th:text="#{admin.topbar.lang}">语言</span>:
                <a href="?lang=zh_CN" th:classappend="${#locale.toString() == 'zh_CN'} ? 'on'" th:text="#{admin.topbar.lang.zh}">中文</a>
                /
                <a href="?lang=en" th:classappend="${#locale.toString() == 'en'} ? 'on'" th:text="#{admin.topbar.lang.en}">EN</a>
                /
                <a href="?lang=id" th:classappend="${#locale.toString() == 'id'} ? 'on'" th:text="#{admin.topbar.lang.id}">ID</a>
            </span>
            <span class="topbar-right">
                <!-- STAG 角标（UI 稿 0-4）：仅 stag profile（StagFlag bean）渲染，生产不渲染 -->
                <span class="stag-badge" th:if="${stag}" th:text="#{admin.v130.topbar.stag}">STAG · 测试环境</span>
                <!-- 账号菜单（UI 稿 0-3）：显示名 · 角色徽标；下拉 = 显示名 / Lark 邮箱 / 岗位角色 + 退出登录 -->
                <details class="account-menu" th:if="${topbarEmail != null}">
                    <summary th:title="#{admin.v130.topbar.account}">
                        <span class="avatar" th:text="${#strings.isEmpty(topbarName)} ? '·' : ${#strings.substring(topbarName, 0, 1)}">H</span>
                        <span class="name" th:text="${topbarName}">Hex</span>
                        <span class="tag role-tag" th:text="#{${topbarRoleKey}}">超级管理员</span>
                        <span class="caret">▾</span>
                    </summary>
                    <div class="account-menu-panel">
                        <div class="name" th:text="${topbarName}">Hex</div>
                        <div class="muted" th:text="${topbarEmail}">hex@tailtopia.id</div>
                        <div class="muted" th:text="#{${topbarRoleKey}}">超级管理员</div>
                        <form th:action="@{/admin/logout}" method="post">
                            <button type="submit" class="logout" th:text="#{admin.topbar.logout}">退出登录</button>
                        </form>
                    </div>
                </details>
                <form th:unless="${topbarEmail != null}" th:action="@{/admin/logout}" method="post">
                    <button type="submit" class="logout" th:text="#{admin.topbar.logout}">退出登录</button>
                </form>
            </span>
        </div>
        <!-- 全站 toast（仅有 ${toast} flash 时出现，admin.js 定时自动消失，bug 346）。 -->
        <div class="toast" role="status" th:if="${toast}" th:text="${toast}">toast</div>
        <div th:replace="${content}">页面内容占位</div>
    </main>
    <!-- CSRF（供 admin-core.js 的 htmx:configRequest 统一注入；fetch 上传页仍各自保留 <meta name="_csrf">） -->
    <span data-csrf hidden th:attr="data-csrf-token=${_csrf?.token},data-csrf-header=${_csrf?.headerName}"></span>
    <!-- htmx 1.9.12（D-31 不升级）统一在此引入：先于 defer 的 admin-core.js 初始化 -->
    <script th:src="@{/admin/vendor/htmx.min.js}"></script>
</div>
</body>
</html>
