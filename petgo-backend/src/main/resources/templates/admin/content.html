<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  B1 内容管理（Story 4.2 → V1.3.0 Story 7.1 套模板 B · tpl-b-list，UI 稿泳道 2 帧 2-1～2-5）。
  筛选栏（下拉即选即查 data-autosubmit；文本框走「查询」钮）→ 摘要条五格（随筛选联动）→ 表格（每页 20，创建时间倒序）→ 分页；
  点行开 480px 抽屉 GET /admin/content/{id}/drawer（?open=<id> 深链，D-23：旧整页详情路由已删、不做跳转）。
  处置动作（下架 / 恢复 / 物种覆写 / 限流 / 解除）全在抽屉里，端点与参数一律不变（fragments/drawer-content.html）。
  🔴 2026-08-28 产品撤掉「内容互动积分」整页：点赞列（口径随 dateBasis）与 CSV 导出并入本页（D-12），不要再造统计页。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.content.title}">内容管理 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='content'">
        <h1 th:text="#{admin.content.title}">内容管理</h1>
        <p class="muted" th:text="#{admin.content.note}">无举报时也可主动处置违规内容；下架/恢复均留审计。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::ct-filters}, ~{::ct-summary}, ~{::ct-table}, ~{::ct-drawer})}">
            <!--/* 筛选 + 搜索：下拉即选即查（data-autosubmit），文本框走「查询」钮；参数名与 4.2 逐字不变 */-->
            <form th:fragment="ct-filters" class="filter-bar" data-autosubmit th:action="@{/admin/content}" method="get"
                  th:attr="hx-get=@{/admin/content}" hx-target="#content-rows" hx-swap="innerHTML" hx-push-url="true">
                <!--/* 抽屉内处置成功 → HX-Trigger admin:content-list-refresh：按当前筛选 + 当前页重拉表格与摘要条
                       （不压 history、不丢 ?open=）。抽屉自己的重拉走另一个事件，见 drawer-content.html。 */-->
                <span hidden data-content-refresh th:attr="hx-get=@{/admin/content}" hx-include="closest form"
                      hx-trigger="admin:content-list-refresh from:body" hx-target="#content-rows" hx-swap="innerHTML"
                      hx-vals="js:{page: (document.querySelector('#content-rows .pager') || {}).getAttribute ? (document.querySelector('#content-rows .pager').getAttribute('data-page') || 0) : 0}"></span>
                <label>
                    <select name="type">
                        <option value="" th:text="#{admin.content.type.all}">全部类型</option>
                        <option value="DAILY" th:selected="${type == 'DAILY'}" th:text="#{admin.content.type.daily}">日常</option>
                        <option value="KNOWLEDGE" th:selected="${type == 'KNOWLEDGE'}" th:text="#{admin.content.type.knowledge}">知识</option>
                        <option value="GROWTH_MOMENT" th:selected="${type == 'GROWTH_MOMENT'}" th:text="#{admin.content.type.growth}">成长瞬间</option>
                    </select>
                </label>
                <label>
                    <input type="number" name="authorId" th:value="${authorId}" min="1" th:placeholder="#{admin.content.authorId}" style="width:120px"/>
                </label>
                <label>
                    <select name="status">
                        <option value="" th:text="#{admin.content.status.all}">全部状态</option>
                        <option value="ONLINE" th:selected="${status == 'ONLINE'}" th:text="#{admin.content.status.online}">上线中</option>
                        <option value="DELETED" th:selected="${status == 'DELETED'}" th:text="#{admin.content.status.deleted}">已下架</option>
                    </select>
                </label>
                <!--/* 🔴 日期范围的口径（2026-08-28，取代互动积分页的两档口径）：
                       · 发布时间 —— 这段时间发的内容质量如何（点赞列 = 至今累计）
                       · 点赞时间 —— 这段时间产生了多少互动（点赞列 = 窗口内的赞数，按它排序） */-->
                <label>
                    <select name="dateBasis">
                        <option value="published" th:selected="${dateBasis != 'liked'}" th:text="#{admin.content.basis.published}">按发布时间</option>
                        <option value="liked" th:selected="${dateBasis == 'liked'}" th:text="#{admin.content.basis.liked}">按点赞时间</option>
                    </select>
                </label>
                <label><input type="date" name="from" th:value="${from}"/></label>
                <label><input type="date" name="to" th:value="${to}"/></label>
                <label>
                    <input type="search" name="q" th:value="${q}" th:placeholder="#{admin.content.searchPlaceholder}" style="width:220px"/>
                </label>
                <!--/* AC5：按物种 + 按推导来源筛选（把某号定位改成 CAT 后，用「来源=账号定位」筛出被批量套上去的内容） */-->
                <label>
                    <select name="species">
                        <option value="" th:text="#{admin.species.all}">全部物种</option>
                        <option th:each="opt : ${speciesOptions}" th:value="${opt}" th:text="${opt}" th:selected="${species == opt}">GENERAL</option>
                    </select>
                </label>
                <label>
                    <select name="speciesSource">
                        <option value="" th:text="#{admin.species.allSources}">全部来源</option>
                        <option th:each="src : ${speciesSources}" th:value="${src}" th:text="${src}" th:selected="${speciesSource == src.name()}">NONE</option>
                    </select>
                </label>
                <!--/* 表头点击排序把值写进这里再提交表单（保留筛选条件） */-->
                <input type="hidden" name="sort" id="content-sort" th:value="${sort}"/>
                <button type="submit" class="btn btn-primary" th:text="#{admin.content.search}">查询</button>
                <!--/* 导出（D-12）：🔴 按钮在筛选表单里，把当前条件原样带走 —— 导出的就是屏幕上这一份。
                       ⚠️ sec:authorize 与控制器 EXPORT_AUTH 逐字一致，否则按钮在、点了 403。
                       ⚠️ 物种两个筛选故意不带：导出列里没有物种，带上会导出一份与文件内容对不上的子集。 */-->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.list_export')" class="btn" data-no-drawer
                   th:href="@{/admin/content/export.csv(type=${type},authorId=${authorId},from=${from},to=${to},status=${status},q=${q},dateBasis=${dateBasis})}"
                   th:text="#{admin.content.exportCsv}">导出 CSV</a>
            </form>

            <div th:fragment="ct-summary" th:replace="~{admin/fragments/content-list :: sumbar(false)}"></div>

            <div th:fragment="ct-table" id="content-rows">
                <div th:replace="~{admin/fragments/content-list :: rows(false)}"></div>
            </div>

            <div th:fragment="ct-drawer" class="drawer-title" th:text="#{admin.v130.content.drawer.title}">内容详情</div>
        </div>

        <!--/* ?open=<postId> 跨页深链兜底（D-23）：admin-drawer.js 的 ?open= 是按当前页 DOM 找 tr 的，
               而 A1 复核队列 / A2 工单 / 暖贴跟进点过来的帖子十有八九不在首页 20 行里 —— 找不到行就静默什么都不发生。
               这里按 id 直接给出抽屉 URL，JS 找不到行时用它兜底（并保留地址栏上的 ?open=，刷新仍能回到同一条）。 */-->
        <span hidden th:if="${open != null}" data-drawer-deeplink data-drawer-res="content"
              th:attr="data-drawer-deeplink=@{/admin/content/{id}/drawer(id=${open})}"></span>

        <!--/* 评论数表头排序：每次点击在 高→低 / 低→高 间切换（写入隐藏 sort 后提交筛选表单，htmx 只刷表格） */-->
        <script>
            function toggleCommentSort(th) {
                var input = document.getElementById('content-sort');
                var next = input.value === 'comments_desc' ? 'comments_asc' : 'comments_desc';
                input.value = next;
                th.querySelector('.sort-arrow').textContent = next === 'comments_desc' ? '▼' : '▲';
                input.form.requestSubmit();
            }
        </script>
    </div>
</div>
</body>
</html>
