<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--/*
  门店进货单列表（商家平台契约第 2、5 节；🛍 商城组，排在 Toko 异常订单后）。
  形态照「送礼记录」（模板 B，noDrawer）：标题 → 说明 → 状态 chips（全部 + 六态计数）→ 单号搜索 → 表格 → 分页。
  行点击不开抽屉，单号是进详情页的链接（详情是独立整页：录入包裹 / 标记送达走整页表单 + PRG）。
  🔒 列表一列 PII 都没有：收货人 / 电话 / 地址只在详情页。门店名是快照（非个人数据）。
  ⚠️ 筛选是整页 GET：chips / 翻页链接必须带全部筛选参数，少一个就会静默丢筛选。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.merchantPo.title}">门店进货单</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='merchantPo',noDrawer=true">
        <div class="wb-title-row"><h1 th:text="#{admin.merchantPo.title}">门店进货单</h1></div>
        <p class="hint" th:text="#{admin.merchantPo.hint}">门店按批发价下的进货单。列表不显示收货信息，请进详情查看。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::po-filters}, ~{::po-chips}, ~{::po-table}, ~{})}">
            <form th:fragment="po-filters" class="filter-bar" method="get" th:action="@{/admin/merchant/purchase-orders}">
                <input type="hidden" name="status" th:value="${status}"/>
                <label class="field"><span th:text="#{admin.merchantPo.search.orderNo}">进货单号</span>
                    <input type="text" name="q" class="inp" th:value="${q}" maxlength="32"/>
                </label>
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.common.filter}">筛选</button>
                <a th:href="@{/admin/merchant/purchase-orders}" class="btn btn-sm"
                   th:text="#{admin.merchantPo.filter.reset}">清空筛选</a>
            </form>

            <!--/* 状态 chips：「全部」+ 六态各自计数（不随单号搜索联动，是全局待办量）；待发货 PAID 高亮成警示色。 */-->
            <div th:fragment="po-chips" class="chips" role="tablist">
                <a class="chip" th:classappend="${status == ''} ? 'chip--on'"
                   th:href="@{/admin/merchant/purchase-orders(q=${q})}">
                    <span th:text="#{admin.merchantPo.filter.all}">全部</span>
                    <span class="tab-count" th:text="${counts.total()}">0</span>
                </a>
                <a th:each="s : ${statuses}" class="chip"
                   th:classappend="${s.name() == status} ? 'chip--on'"
                   th:href="@{/admin/merchant/purchase-orders(status=${s},q=${q})}">
                    <span th:text="#{'admin.merchantPo.status.' + ${s}}">待发货</span>
                    <span class="tab-count" th:classappend="${s.name() == 'PAID' and counts.byStatus().get(s) > 0} ? 'badge badge-warn'"
                          th:text="${counts.byStatus().get(s)}">0</span>
                </a>
            </div>

            <div th:fragment="po-table" th:remove="tag">
                <table th:if="${!#lists.isEmpty(rows)}">
                    <thead>
                    <tr>
                        <th th:text="#{admin.merchantPo.col.orderNo}">进货单号</th>
                        <th th:text="#{admin.merchantPo.col.store}">门店</th>
                        <th class="num" th:text="#{admin.merchantPo.col.goodsAmount}">商品金额</th>
                        <th th:text="#{admin.merchantPo.col.shippingMethod}">运费方式</th>
                        <th th:text="#{admin.merchantPo.col.status}">状态</th>
                        <th class="nowrap" th:text="#{admin.merchantPo.col.createdAt}">下单时间</th>
                        <th class="nowrap" th:text="#{admin.merchantPo.col.paidAt}">付款时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${rows}">
                        <td class="nowrap"><a th:href="@{/admin/merchant/purchase-orders/{t}(t=${r.publicToken})}"
                                              th:text="${r.orderNo}">PO-261021-0042</a></td>
                        <td th:text="${r.storeNameSnapshot}">Toko Budi</td>
                        <td class="num" th:text="${#numbers.formatInteger(r.goodsAmount, 0, 'COMMA')}">1,250,000</td>
                        <td class="nowrap" th:text="#{'admin.merchantPo.shipping.' + ${r.shippingMethod}}">包邮</td>
                        <td class="nowrap">
                            <span class="badge" th:classappend="${r.status.name() == 'PAID'} ? 'badge-warn'
                                     : (${r.status.name() == 'DELIVERED' or r.status.name() == 'COMPLETED'} ? 'badge-ok' : 'badge-neutral')"
                                  th:text="#{'admin.merchantPo.status.' + ${r.status}}">待发货</span>
                        </td>
                        <td class="nowrap" th:text="${@adminTime.wib(r.createdAt)}">2026-10-24 10:00:00 WIB</td>
                        <td class="nowrap" th:text="${@adminTime.wib(r.paidAt)}">—</td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(rows)}">
                    <span class="empty-emoji">📦</span>
                    <p th:text="#{admin.merchantPo.empty}">暂无进货单。</p>
                </div>
                <div class="pager" th:if="${totalPages > 0}">
                    <a th:if="${page > 0}" class="btn btn-sm" th:text="#{admin.audit.prev}"
                       th:href="@{/admin/merchant/purchase-orders(status=${status},q=${q},page=${page - 1})}">上一页</a>
                    <span th:text="#{admin.audit.page(${page + 1}, ${totalPages}, ${totalElements})}">分页</span>
                    <a th:if="${hasNext}" class="btn btn-sm" th:text="#{admin.audit.next}"
                       th:href="@{/admin/merchant/purchase-orders(status=${status},q=${q},page=${page + 1})}">下一页</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
