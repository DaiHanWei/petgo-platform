<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  C2 复购引擎效果（V1.3.0 Story 10.5 AC1，模板 C · tpl-c-report；原 V1.4.0 Story 6.6 AB-13B）。
  🔴 它是裁决 A-16 的唯一依据 —— 口径以服务端业务库为准，后台**不反拉 PostHog API**
     （外部依赖违 NFR-1，且带丢失率与广告拦截偏差）。
  🔴 **本页没有写操作、没有导出**；模板 C 的 data-readonly 标识由壳给出。
  🔴 **没有图表**：Snapshot 里一个日序列都没有，AC1 的口径是「Chart.js 只在有时间序列的区块使用」。
  权限 config.view 或 order.view —— 与毛利 / 周转的 shop.finance_view **不是同一个码**（现状不规整，本 story 不改）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.repurchase.title}">复购引擎效果 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.shop.repurchase.title}">复购引擎效果</h1></div>
        <!--/* ⚠️ 这三段是 AC 的一部分，不是装饰：少了它们，「恒为 0」会被读成埋点坏了，
               「与 PostHog 对不上」会被读成服务端算错。 */-->
        <p class="muted" th:text="#{admin.shop.repurchase.scopeNote}">本看板评的是两条机制，不是三条：驱虫/疫苗周期提醒（FR-108）已挪到 1.2.0。</p>
        <p class="muted" th:text="#{admin.shop.repurchase.zeroNote}">DEWORM / VACCINE 在本版本恒为 0——这是范围决策，不是数据丢失，也不是埋点坏了。</p>
        <p class="muted" th:text="#{admin.shop.repurchase.sourceNote}">口径以服务端业务库为准。PostHog 仅作交叉验证，后台不反拉它的接口。</p>

        <div th:replace="~{admin/fragments/tpl-c-report :: report(~{::rp-range}, ~{::rp-cards}, ~{::rp-detail})}">
            <!--/* 期间切换：htmx 换卡区（主 swap）+ 明细（oob）；页头与只读标识不重绘。 */-->
            <form th:fragment="rp-range" class="filter-bar" data-autosubmit method="get"
                  th:action="@{/admin/shop/repurchase-dashboard}"
                  th:attr="hx-get=@{/admin/shop/repurchase-dashboard}"
                  hx-target="#repurchase-cards" hx-swap="outerHTML" hx-push-url="true">
                <label class="field"><span th:text="#{admin.shop.orders.filter.from}">起始日期</span>
                    <input type="date" name="from" class="inp" th:value="${from}"/>
                </label>
                <label class="field"><span th:text="#{admin.shop.orders.filter.to}">截止日期</span>
                    <input type="date" name="to" class="inp" th:value="${to}"/>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.common.filter}">筛选</button>
            </form>

            <div th:fragment="rp-cards" th:replace="~{admin/fragments/cards-shop-repurchase :: cards}"></div>
            <div th:fragment="rp-detail" th:replace="~{admin/fragments/cards-shop-repurchase :: detail(false)}"></div>
        </div>
    </div>
</div>
</body>
</html>
