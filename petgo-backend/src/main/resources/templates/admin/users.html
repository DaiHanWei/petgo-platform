<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  用户列表（Story 3.1 只读 → V1.3.0 Story 8.1 套模板 B · tpl-b-list，UI 稿 3-1～3-6）。门控 user.view。
  筛选（关键词 + 手机号）→ 摘要条四格 → 表格 → 分页；点行开 480px 五页签抽屉（详情整页已退役）。
  🛡 列表只显示「手机号填了没填」，不显示号码本身；导出召回名单是**独立权限**且必须先选筛选。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.users.title}">用户搜索 · TailTopia 运营</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='user'">
        <h1 th:text="#{admin.users.title}">用户搜索</h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::user-filters}, ~{::user-summary}, ~{::user-table}, ~{::user-drawer})}">
            <!--/* 筛选栏。⚠️ 关键词走**显式「查询」钮**（模板 B 通用规格）：原先是即输即查，
                   每敲一个字发一次请求，删字时还会把刚看到的结果换掉。
                   手机号下拉保留 data-autosubmit（选项就那三个，选完即查是对的）。 */-->
            <!--/* canExport 提成一个变量：三态（可用链接 / 置灰钮 / 提示语）用的是同一个判据，
                   写三遍迟早漂移成两套 —— bug 20260901-469 的成因正是「屏幕一份、文件一份」。 */-->
            <form th:fragment="user-filters" class="filter-bar" data-autosubmit
                  th:with="canExport=${!searched and (phone == 'filled' or phone == 'empty')
                                       and (status == null or status == '')}"
                  th:action="@{/admin/users}" method="get"
                  th:attr="hx-get=@{/admin/users}" hx-target="#users-rows" hx-swap="innerHTML" hx-push-url="true">
                <label class="field">
                    <span th:text="#{admin.v130.users.searchLabel}">关键词</span>
                    <input type="search" name="q" class="inp" th:value="${q}"
                           th:placeholder="#{admin.users.searchPlaceholder}" style="width:280px"/>
                </label>
                <!--/* 状态筛选（Story 8.1 · AC1，B7 规格「筛选：关键词 · 状态」）。
                       下拉就三个选项，选完即查是对的 —— 显式「查询」钮是给文本框的。 */-->
                <label class="field">
                    <span th:text="#{admin.v130.users.statusFilter}">状态</span>
                    <select name="status" class="sel">
                        <option value="" th:text="#{admin.v130.users.statusFilter.any}"
                                th:selected="${status == null or status == ''}">全部</option>
                        <option value="active" th:text="#{admin.users.status.active}"
                                th:selected="${status == 'active'}">正常</option>
                        <option value="deactivated" th:text="#{admin.users.status.deactivated}"
                                th:selected="${status == 'deactivated'}">已停用</option>
                        <option value="deleted" th:text="#{admin.users.status.deleted}"
                                th:selected="${status == 'deleted'}">已注销</option>
                    </select>
                </label>
                <!-- 手机号筛选（Story 11.4 · AB-11A）：供运营挑催填名单。 -->
                <label class="field">
                    <span th:text="#{admin.users.phoneFilter}">手机号</span>
                    <select name="phone" class="sel">
                        <option value="" th:text="#{admin.users.phoneFilter.any}"
                                th:selected="${phone == null or phone == ''}">全部</option>
                        <option value="filled" th:text="#{admin.users.phoneFilter.filled}"
                                th:selected="${phone == 'filled'}">已填写</option>
                        <option value="empty" th:text="#{admin.users.phoneFilter.empty}"
                                th:selected="${phone == 'empty'}">未填写</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.users.search}">查询</button>

                <!-- 🔴 导出是独立权限：把 PII 批量带出系统，风险高一档 -->
                <!-- bug 20260901-469：按钮只在明确选了 已填写/未填写 时可用，phone 原样透传 ——
                     原先「没选就当未填写」的回落，配上翻页丢参，导出的正好是相反的那份名单。 -->
                <!-- ⚠️ 搜索态（q 非空）不给导出：屏幕上是**关键词命中且封顶 50 条**的那批，
                     而导出端点按 AC3 只认 phone、导的是全量 —— 又是「屏幕一份、文件一份」。 -->
                <!-- ⚠️ 状态筛选（Story 8.1）生效时同理不给导出：导出端点按 AC3 **只认 phone 一个参数**
                     （路径/参数逐字不变），它导的是全部状态的人；屏幕上只剩「已停用」而文件里是全量，
                     正是同一类错位。要按状态导，得先把状态切回「全部」。 -->
                <!-- bug 20260901-475：不可用时**置灰而不是消失** —— 整个按钮不见会被读成「功能没了」。 -->
                <a sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.phone_export')"
                   th:if="${canExport}"
                   class="btn btn-sm" data-no-drawer
                   th:href="@{/admin/users/phone-recall.xlsx(phone=${phone})}"
                   th:text="#{admin.users.exportRecall}">导出召回名单</a>
                <button sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.phone_export')"
                        th:unless="${canExport}"
                        type="button" class="btn btn-sm" disabled
                        th:title="#{admin.users.exportNeedsFilter}"
                        th:text="#{admin.users.exportRecall}">导出召回名单</button>
                <span sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.phone_export')"
                      th:unless="${canExport}"
                      class="hint" th:text="#{admin.users.exportNeedsFilter}">
                    选择「已填写 / 未填写」后可导出召回名单
                </span>
                <span class="hint" th:text="#{admin.users.exportNote}"
                      sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('user.phone_export')">
                    名单含已封号账号并标注状态，由运营自行判断。
                </span>
            </form>

            <div th:fragment="user-summary" th:replace="~{admin/fragments/users-list :: sumbar(false)}"></div>

            <div th:fragment="user-table" id="users-rows">
                <div th:replace="~{admin/fragments/users-list :: rows(false)}"></div>
            </div>

            <div th:fragment="user-drawer" class="drawer-title" th:text="#{admin.userdetail.title}">用户详情</div>
        </div>

        <!--/* ?open=<userId> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL
               （搜索态 / 翻过页之后那一行多半不在首屏，B1～B5 同一机制）。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="user"
              th:attr="data-drawer-deeplink=@{/admin/users/{id}/drawer(id=${open})}"></span>
    </div>
</div>
</body>
</html>
