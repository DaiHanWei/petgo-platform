<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  A4 问诊异常工单（V1.3.0 Story 2.6，模板 A · tpl-a-workbench；原 Story 5.1 列表 + 详情两页合一）。
  仅会话元数据（NFR5：绝不含 IM 正文 / AI 上下文 / 媒体）；工单不可删。两态页签 OPEN / RESOLVED（计数）；
  左栏时间倒序每页 20 滚动加载；右栏四区由 fragments/anomaly-panel.html 渲染。两个写端点路径 / 参数 / 权限零变更：
  加备注 htmx 回备注时间线 fragment（局部追加不换条）；标记已处理回 anomaly-done（data-next-id）。🔴 无键盘 ↑/↓（D-14）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.anomalies.title}">问诊异常工单 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-workbench.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.anomalies.title}">问诊异常工单</h1></div>
        <p class="muted" th:text="#{admin.anomalies.note}">兽医被封禁自动生成；仅系统内会话元数据，不触达第三方消息正文。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-a-workbench :: workbench(~{::an-tabs}, ~{}, ~{::an-queue}, ~{::an-detail}, ~{::an-actions})}">
            <div th:fragment="an-tabs" class="tabs" id="anomaly-tabs">
                <a class="tab" th:classappend="${state == 'open'} ? 'tab--on'" th:href="@{/admin/anomalies(state='open')}">
                    <span th:text="#{admin.v130.anomalies.tab.open}">待处理</span>
                    <span class="tab-count" id="anomaly-tab-count-open" th:text="${counts.get('open')}">0</span>
                </a>
                <a class="tab" th:classappend="${state == 'resolved'} ? 'tab--on'" th:href="@{/admin/anomalies(state='resolved')}">
                    <span th:text="#{admin.v130.anomalies.tab.resolved}">已处理</span>
                    <span class="tab-count" id="anomaly-tab-count-resolved" th:text="${counts.get('resolved')}">0</span>
                </a>
            </div>
            <div th:fragment="an-queue" th:replace="~{admin/fragments/anomaly-queue :: list}"></div>
            <div th:fragment="an-detail" th:replace="~{admin/fragments/tpl-a-workbench :: detail-empty}"></div>
            <div th:fragment="an-actions"><span class="muted" th:text="#{admin.v130.review.actions.hint}">操作区随所选单据渲染</span></div>
        </div>
    </div>
</div>
</body>
</html>
