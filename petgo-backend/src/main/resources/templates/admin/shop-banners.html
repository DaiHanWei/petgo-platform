<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  B17 Toko 顶部 Banner（V1.3.0 Story 10.3 AC3 / AC4，模板 B · tpl-b-list + 抽屉；原 2026-08-27 的列表 + 页尾常驻表单）。
  🔴 同一时间只展示一张：App 取「已上架 + 权重最高」。本页可配多条，但只有标着「生效中」的那条用户看得到
     —— 不标出来运营会以为在轮播（本版本根本没有轮播）。三档状态见 fragments/shop-banners-list.html。
  🔴 本版本 banner **纯展示、不可点**，所以没有任何跳转目标字段；也**没有变更历史 / 已删除记录**，页面不承诺可追溯。
  新建 / 编辑收进抽屉（fragments/drawer-shop-banner.html）；抽屉取数复用 GET /admin/shop/banners 本身
  （?create=1 / ?open=<id> + HX-Request），不新开端点。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.banners.title}">Toko 顶部 Banner · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
    <!-- 🔴 抽屉里的上传走 fetch，而 /admin/** 那条过滤链**保留 CSRF** —— 少了这两个 meta 就是 403，
         且会被误读成「权限不够」。⚠️ 不能挪到 layout：业务页只换 body 里那个 div，各页保留自己的 <head>。 -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='shop-banner'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.shop.banners.title}">Toko 顶部 Banner</h1>
            <!-- AC3：「＋新增 Banner」移到筛选栏（本页没有筛选项，就落在标题行右侧的同一位置） -->
            <button th:if="${canEdit}" type="button" class="btn btn-primary btn-sm" data-drawer-res="shop-banner"
                    th:attr="data-drawer-open=@{/admin/shop/banners(create=1)},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    th:text="#{admin.shop.banners.btn.add}">＋ 新增 Banner</button>
        </div>
        <p class="muted" th:utext="#{admin.shop.banners.hint}">同一时间只展示一张。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{}, ~{}, ~{::sb-table}, ~{::sb-drawer})}">
            <div th:fragment="sb-table" id="shop-banner-rows">
                <div th:replace="~{admin/fragments/shop-banners-list :: rows}"></div>
            </div>
            <div th:fragment="sb-drawer" class="drawer-title" th:text="#{admin.shop.banners.section.add}">Banner</div>
        </div>
        <!--/* ?open=<id> 深链兜底：行按钮走 [data-drawer-open]，但从别处带 ?open= 进来时得有个落点。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="shop-banner"
              th:attr="data-drawer-deeplink=@{/admin/shop/banners(open=${open})}"></span>
    </div>
</div>
</body>
</html>
