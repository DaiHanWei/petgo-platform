<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  B19 开封判定判例库（V1.3.0 Story 10.4 AC4，模板 B + 抽屉；原 Story 5.6 的列表 + 页尾常驻表单卡）。
  🔴 页头那句业务定位提示是 **AC 的一部分，不是装饰**（SPEC-24）：判例库是一致性工具不是风控工具，
     骗退风控由 90 日 ≤2 次的频次上限承担，两者不可互相替代 —— 删掉它，客服会把「查过判例」
     当成「查过风险」，而这两件事各自漏掉的是完全不同的一类退货。
  🔴 与 B17 Banner 是**两个不同的路由与数据模型**（UI 稿 09-04 拆帧），不要合页。
  新建收进抽屉（fragments/drawer-shop-precedent.html）；抽屉取数复用 GET 本身（?create=1 + HX-Request），不新开端点。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.precedents.title}">开封判例 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='shop-precedent'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.shop.precedents.title}">开封判例</h1>
            <button th:if="${canAdd}" type="button" class="btn btn-primary btn-sm"
                    data-drawer-res="shop-precedent"
                    th:attr="data-drawer-open=@{/admin/shop/return-precedents(create=1)},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    th:text="#{admin.shop.precedents.btn.add}">沉淀判例</button>
        </div>
        <p class="banner warn" th:text="#{admin.shop.precedents.hint}">判例库是一致性工具，不是风控工具：它解决「同一情形不同客服判得不一样」。骗退风控由 90 日 ≤2 次的频次上限承担，两者不可互相替代——查过判例不等于查过风险。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::pc-filters}, ~{}, ~{::pc-table}, ~{::pc-drawer})}">
            <div th:fragment="pc-filters">
                <!--/* 🔴 **显式查询钮**，不是 data-autosubmit（AC4）：判例检索是「想清楚要查什么再查」，
                       边打字边发请求会在客服还没写完情形描述时反复刷掉他正看着的结果。 */-->
                <form class="filter-bar" th:attr="hx-get=@{/admin/shop/return-precedents}"
                      hx-target="#shop-precedent-rows" hx-swap="innerHTML" hx-push-url="true">
                    <label class="field"><span th:text="#{admin.shop.precedents.col.situation}">情形</span>
                        <input type="search" name="q" class="inp" th:value="${q}" maxlength="100"
                               th:placeholder="#{admin.shop.precedents.searchPlaceholder}"/>
                    </label>
                    <button type="submit" class="btn btn-sm" th:text="#{admin.common.filter}">检索</button>
                </form>
            </div>
            <div th:fragment="pc-table" id="shop-precedent-rows">
                <div th:replace="~{admin/fragments/shop-precedents-list :: rows}"></div>
            </div>
            <div th:fragment="pc-drawer" class="drawer-title"
                 th:text="#{admin.shop.precedents.section.add}">沉淀一条判例</div>
        </div>
    </div>
</div>
</body>
</html>
