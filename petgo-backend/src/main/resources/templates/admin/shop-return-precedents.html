<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!-- 开封判定判例库（V1.4.0 Story 5.6，AB-12D / SPEC-24）。 -->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.precedents.title}">开封判例 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="s-page-head">
            <div class="s-title-wrap">
                <h1 th:text="#{admin.shop.precedents.title}">开封判例</h1>
            </div>
        </div><!-- ⚠️ 这句是 AC 的一部分：判例库是一致性工具，不是风控工具（SPEC-24） -->
        <p class="hint" th:text="#{admin.shop.precedents.hint}">判例库是一致性工具，不是风控工具：它解决「同一情形不同客服判得不一样」。骗退风控由 90 日 ≤2 次的频次上限承担，两者不可互相替代——查过判例不等于查过风险。</p>
        <p th:if="${notice}" class="flash" th:text="${notice}">已保存</p>
        <p th:if="${error}" class="flash error" th:text="${error}">操作失败</p>

        <div class="s-card">
            <div class="s-card-body">
                <form method="get" th:action="@{/admin/shop/return-precedents}" class="filters">
            <input type="search" name="q" th:value="${q}" maxlength="100"
                   th:placeholder="#{admin.shop.precedents.searchPlaceholder}"/>
            <button type="submit" th:text="#{admin.common.filter}">检索</button>
        </form>
            </div>
        </div>

        <div class="s-card">
        <table>
            <thead><tr>
                <th th:text="#{admin.shop.precedents.col.situation}">情形</th>
                <th th:text="#{admin.shop.precedents.col.judged}">判定</th>
                <th th:text="#{admin.shop.precedents.col.rationale}">理由</th>
                <th th:text="#{admin.shop.orders.col.createdAt}">时间</th>
            </tr></thead>
            <tbody>
            <tr th:each="p : ${rows}">
                <td th:text="${p.situation}">外包装已拆但内袋未开</td>
                <td th:text="${p.judgedOpened} ? #{admin.shop.precedents.opened} : #{admin.shop.precedents.notOpened}">不算开封</td>
                <td th:text="${p.rationale}">内袋密封完好，不影响二次销售</td>
                <td th:text="${p.createdAt}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}">
                <td colspan="4" th:text="#{admin.shop.precedents.empty}">暂无判例。</td>
            </tr>
            </tbody>
        </table>
        </div>

        <div class="s-card">
        <h2 th:text="#{admin.shop.precedents.section.add}">沉淀一条判例</h2>
        <form method="post" th:action="@{/admin/shop/return-precedents}">
            <input type="text" name="situation" required maxlength="300"
                   th:placeholder="#{admin.shop.precedents.col.situation}"/>
            <select name="judgedOpened" required>
                <option value="false" th:text="#{admin.shop.precedents.notOpened}">不算开封</option>
                <option value="true" th:text="#{admin.shop.precedents.opened}">算开封</option>
            </select>
            <input type="text" name="rationale" required maxlength="1000"
                   th:placeholder="#{admin.shop.precedents.col.rationale}"/>
            <input type="text" name="evidenceKeys" maxlength="1000"/>
            <button class="btn btn-primary" type="submit" th:text="#{admin.shop.precedents.btn.add}">沉淀判例</button>
        </form>
        </div>
    </div>
</div>
</body>
</html>
