<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<!--/*
  校验预览与确认发布（V1.1.6 Story 13.4 · AB-3K Step 3 → V1.3.0 Story 7.6 模板 E 第 4 步）。

  🔴 **这一页是 13.4 的全部意义**：此前没有校验预览、没有确认入库，**提交即上线** ——
     50 行错 3 行就是 3 条线上真帖，只能逐条去找、逐条下架。
  🔴 7.6 加的是「点行看成帖效果」：表格只答得出「校验过没过」，答不出**内容本身**对不对 ——
     图配错、正文被 Excel 截断、多图顺序反了，只有把卡片画出来才看得见。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.batch.preview.title}">校验预览 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='batchrow'">
        <h1><span th:text="#{admin.batch.preview.title}">校验预览</span>
            <span th:text="' #' + ${batchId}">#0</span></h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-e-steps :: steps(~{::pv-steps}, ~{::pv-body}, ~{::pv-footer})}">
            <ol th:fragment="pv-steps" th:replace="~{admin/fragments/batch-steps :: bar(${batchId}, 3)}"></ol>

            <div th:fragment="pv-body">
                <p class="hint" th:text="#{admin.batch.preview.summary(${passCount}, ${failCount}, ${dupCount})}">
                    通过 0 条 / 未过 0 条 / 疑似重复 0 条</p>

                <!-- 🛡 失败行**不阻塞整批**：通过的行照发，失败行留在草稿里可改后重提。 -->
                <p class="hint" th:text="#{admin.batch.preview.notBlocking}">
                    校验未过的行不会阻塞整批 —— 通过的行照常发布，未过的行留在草稿里，改完再提交一次即可。</p>
                <p class="hint" th:text="#{admin.v130.batch.previewRowHint}">点任意一行看它发出去之后长什么样。</p>

                <table class="preview-table">
                    <thead>
                    <tr><th th:text="#{admin.batch.row.no}">行号</th>
                        <th th:text="#{admin.batch.preview.body}">正文摘要</th>
                        <th th:text="#{admin.batch.preview.images}">图片</th>
                        <th th:text="#{admin.batch.row.author}">发布账号</th>
                        <th th:text="#{admin.batch.row.type}">类型</th>
                        <th th:text="#{admin.batch.row.species}">物种</th>
                        <th th:text="#{admin.batch.row.at}">计划时间</th>
                        <th th:text="#{admin.batch.preview.result}">校验结果</th></tr>
                    </thead>
                    <tbody>
                    <!--/* 🔴 校验不过的行整行标红（AC3）：表格右侧那一列的红字在 8 列宽的表里很容易漏看 */-->
                    <tr th:each="c : ${checks}" th:id="'batch-row-' + ${c.row.id}"
                        th:data-id="${c.row.id}" tabindex="0"
                        th:data-drawer-url="@{/admin/seed-batches/{b}/preview/{r}/drawer(b=${batchId},r=${c.row.id})}"
                        th:classappend="${!c.passes()} ? 'row-bad'">
                        <td th:text="${c.row.rowNo}">0</td>
                        <td th:text="${#strings.abbreviate(c.row.body ?: '—', 40)}">摘要</td>
                        <td>
                            <img th:each="u : ${c.row.imageUrls}" th:src="${u}" alt="" loading="lazy"
                                 style="width:40px;height:40px;object-fit:cover;border-radius:4px;margin-right:4px"/>
                        </td>
                        <td th:text="${c.row.authorUserId} == 0 ? '—' : ${c.row.authorUserId}">—</td>
                        <td th:text="${c.row.contentType}">DAILY</td>
                        <td th:text="${c.row.species} ?: '—'">—</td>
                        <!-- bug 20260901-473：改 WIB 展示 —— 原来直接打印 Instant 是 UTC 原始串，
                             与后台"一律雅加达时间"的约定相悖，运营会按自己的表读错 7 小时。 -->
                        <td th:text="${c.row.scheduledAt != null ? @adminTime.wib(c.row.scheduledAt) : '—'}">—</td>
                        <td>
                            <!-- bug 20260901-473：已发布/已排期的行必须亮明状态 —— 否则它们仍显示 Pass，
                                 而确认发布会跳过它们，运营就会看到「表格 1 条 Pass、汇总 0 条发布」。 -->
                            <span class="badge badge-ok" th:if="${c.row.status.name() == 'PUBLISHED'}"
                                  th:text="#{admin.batch.preview.alreadyPublished}">已发布（本次确认将跳过）</span>
                            <span class="badge" th:if="${c.row.status.name() == 'SCHEDULED'}"
                                  th:text="#{admin.batch.preview.alreadyScheduled}">已排期（本次确认将跳过）</span>
                            <!-- 每条错误都要能对上运营那份表格：素材报文件名、类型报合法取值、账号报原因。 -->
                            <span th:if="${c.passes() and !c.duplicate()
                                           and c.row.status.name() != 'PUBLISHED'
                                           and c.row.status.name() != 'SCHEDULED'}"
                                  th:text="#{admin.batch.preview.pass}">通过</span>
                            <!-- 🔴 去重命中是**提示**不是错误（AC4）：原先是静默跳过，
                                 界面只显示一个跳过条数，运营根本不知道哪一条被吞了。 -->
                            <span class="err" th:if="${c.warns()}"
                                  th:text="#{admin.batch.preview.duplicate}">⚠️ 该账号已发过相同内容</span>
                            <p class="err" th:each="e : ${c.errors}" th:text="${e}">错误</p>
                        </td>
                    </tr>
                    <tr th:if="${checks.isEmpty()}"><td colspan="8"
                            th:text="#{admin.batch.preview.empty}">这个批次还没有内容行</td></tr>
                    </tbody>
                </table>
            </div>

            <div th:fragment="pv-footer" class="stp-actions">
                <a class="btn btn-neutral" th:href="@{/admin/seed-batches/{id}(id=${batchId},step=2)}"
                   th:text="#{admin.v130.batch.prevStep}">← 上一步</a>
                <form method="post" class="inline" th:action="@{/admin/seed-batches/{id}/confirm(id=${batchId})}"
                      th:attr="data-confirm=#{admin.batch.preview.confirmPrompt},data-confirm-args=${passCount}">
                    <!-- 🔴 默认不勾：去重命中在预览里是提示，但"提示了却默认照发"等于没提示。 -->
                    <label><input type="checkbox" name="includeDuplicates" value="true"/>
                        <span th:text="#{admin.batch.preview.includeDuplicates}">重复的也发</span></label>
                    <button type="submit" class="btn btn-primary" th:text="#{admin.batch.preview.confirm}">确认发布</button>
                </form>
            </div>
        </div>

        <!--/* 成帖效果抽屉（独立壳：本页不是模板 B，用 tpl-shared 的同构抽屉） */-->
        <div th:replace="~{admin/fragments/tpl-shared :: drawer('batchrow', ~{::pv-drawer-title})}">
            <div th:fragment="pv-drawer-title" class="drawer-title"
                 th:text="#{admin.v130.batch.drawerTitle}">成帖效果</div>
        </div>

        <!--/* ?open=<rowId> 深链兜底（非 htmx 直达抽屉 URL 时的落点） */-->
        <span hidden th:if="${open != null}" data-drawer-res="batchrow"
              th:attr="data-drawer-deeplink=@{/admin/seed-batches/{b}/preview/{r}/drawer(b=${batchId},r=${open})}"></span>
    </div>
</div>
</body>
</html>
