<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  A8 Toko 异常订单（V1.3.0 Story 10.1 AC3，模板 A · tpl-a-workbench；原 V1.4.0 Story 4.4 的一页卡片流）。
  🔴 **只有一个页签（待处理）**：exceptionCandidates() 是实时计算的候选集（已付款待发货 ∧ 库存不足），
     处置完那一单就离开集合 —— 库里不存在「已处理」这个可查询的集合；造它要新查询甚至新持久化，
     破本 story 的「零后端功能改动」（story T0 重核 ③，AC 偏差已记 Completion Notes）。处置记录在操作审计里。
  右栏三区由 fragments/shop-exception-panel.html 渲染；三个写端点路径 / 参数 / 权限零变更。
  🔒 本页不渲染收件人 PII（同订单列表口径）。无键盘 ↑/↓（D-14）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.exceptions.title}">异常订单 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-workbench.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.shop.exceptions.title}">异常订单</h1></div>
        <p class="muted" th:text="#{admin.v130.shopExceptions.liveHint}">本页是实时候选清单，处置完即离开；处置记录在操作审计里。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-a-workbench :: workbench(~{::se-tabs}, ~{::se-filters}, ~{::se-queue}, ~{::se-detail}, ~{::se-actions})}">
            <!-- 单页签：用公共页签行渲染一格，计数与队列同源（AC4）。 -->
            <div th:fragment="se-tabs" th:replace="~{admin/fragments/tpl-a-state-tabs :: tabs(${stateTabs})}"></div>
            <!-- 无筛选项；这一格只当 ?open=<token> 深链的宿主 -->
            <div th:fragment="se-filters" class="filter-bar"
                 th:attr="data-open=${open},data-open-url=${open != null} ? @{/admin/shop/order-exceptions(open=${open})} : null"></div>
            <div th:fragment="se-queue" th:replace="~{admin/fragments/shop-exception-queue :: list}"></div>
            <div th:fragment="se-detail" th:replace="~{admin/fragments/tpl-a-workbench :: detail-empty}"></div>
            <div th:fragment="se-actions"><span class="muted" th:text="#{admin.v130.review.actions.hint}">操作区随所选单据渲染</span></div>
        </div>
    </div>
</div>
</body>
</html>
