<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  B16 商品管理列表（V1.3.0 Story 10.3，模板 B · tpl-b-list；原 V1.4.0 Story 1.3 AB-10A）。
  摘要条三格（上架 / 未上架 / SKU 总数）→ 筛选栏（品类 · 上架状态，即选即查）→ 表格（权重倒序再 id 倒序、每页 20）。
  🔴 **本页刻意不做抽屉**（AC1）：商品字段二十多个，480px 抽屉装不下；「编辑」跳独立表单页
     `/admin/shop/products/{id}`（该路由**不在退役清单**）。所以 tpl-b-list 传 noDrawer=true ——
     不传的话页面上会留一段永远打不开的抽屉壳。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.products.title}">商品管理 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="noDrawer=true">
        <div class="wb-title-row">
            <h1 th:text="#{admin.shop.products.title}">商品管理</h1>
            <a th:if="${canEdit}" th:href="@{/admin/shop/products/new}" class="btn btn-primary btn-sm"
               th:text="#{admin.shop.products.btn.new}">新建商品</a>
        </div>
        <p class="muted" th:text="#{admin.shop.products.hint}">精选自营商品。新建商品默认未上架。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::sp-filters}, ~{::sp-summary}, ~{::sp-table}, ~{})}">
            <form th:fragment="sp-filters" class="filter-bar" data-autosubmit
                  th:attr="hx-get=@{/admin/shop/products}"
                  hx-target="#shop-product-rows" hx-swap="innerHTML" hx-push-url="true">
                <label class="field"><span th:text="#{admin.shop.col.category}">品类</span>
                    <select name="category" class="sel">
                        <option value="" th:text="#{admin.common.all}">全部</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:selected="${c == filterCategory}"
                                th:text="#{'admin.v130.shopProducts.category.' + ${c}}">MAKANAN</option>
                    </select>
                </label>
                <label class="field"><span th:text="#{admin.shop.col.active}">上架状态</span>
                    <select name="active" class="sel">
                        <option value="" th:text="#{admin.common.all}">全部</option>
                        <option value="true" th:selected="${filterActive == true}" th:text="#{admin.shop.active.yes}">已上架</option>
                        <option value="false" th:selected="${filterActive == false}" th:text="#{admin.shop.active.no}">未上架</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.common.search}">查询</button>
            </form>

            <div th:fragment="sp-summary" th:replace="~{admin/fragments/shop-products-list :: sumbar(false)}"></div>

            <div th:fragment="sp-table" id="shop-product-rows">
                <div th:replace="~{admin/fragments/shop-products-list :: rows(false)}"></div>
            </div>
        </div>

        <p class="hint" th:text="#{admin.shop.delist.hint}">下架只改变可见性：商品立即从 App 所有列表与推荐中消失，但已下单未支付的订单照常履约。</p>
    </div>
</div>
</body>
</html>
