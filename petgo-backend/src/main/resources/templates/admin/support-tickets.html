<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  A5 客服工单（V1.3.0 Story 2.7，模板 A · tpl-a-workbench；原 Story 4.7 列表 + 详情两页合一）。
  三态页签：待处理 / 待联系（需联系且未联系）/ 已结案（计数）；左栏时间倒序每页 20；右栏五区由 fragments/support-panel.html 渲染
  （正文 + 附件 / 联系卡 / 关联订单 / 退款需求判定 / 结案）。四个写端点路径 / 权限零变更（D-36：refund-reject 加必填 reason）；
  关联 / 判定 htmx 回右栏（停留本条），结案回 support-done（data-next-id）。🔴 无键盘 ↑/↓（D-14）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.support.title}">客服工单 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-workbench.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.support.title}">客服工单</h1></div>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-a-workbench :: workbench(~{::sp-tabs}, ~{::sp-filters}, ~{::sp-queue}, ~{::sp-detail}, ~{::sp-actions})}">
            <!-- 页签行：公共片段（Story 2.9 T2） -->
            <div th:fragment="sp-tabs" th:replace="~{admin/fragments/tpl-a-state-tabs :: tabs(${stateTabs})}"></div>
            <!-- 深链 ?open=<ticketToken>（D-23，A6 来源工单回链）：admin-workbench.js 加载时选中该行 / 直接拉 detail -->
            <div th:fragment="sp-filters" class="filter-bar" th:attr="data-open=${open},data-open-url=${open != null} ? @{/admin/support-tickets/{t}/detail(t=${open})} : null"></div>
            <div th:fragment="sp-queue" th:replace="~{admin/fragments/support-queue :: list}"></div>
            <div th:fragment="sp-detail" th:replace="~{admin/fragments/tpl-a-workbench :: detail-empty}"></div>
            <div th:fragment="sp-actions"><span class="muted" th:text="#{admin.v130.review.actions.hint}">操作区随所选单据渲染</span></div>
        </div>

        <script>
        // 页内 JS（Story 2.7）：驳回原因未填 → 驳回钮禁用；关联输入为空 → 关联钮禁用。无 ↑/↓（D-14）。
        (function () {
            function sync(form) {
                var btn = form.querySelector('[data-requires-target]');
                var txt = form.querySelector('[data-requires-text]');
                if (btn && txt) { btn.disabled = !txt.value.trim(); }
            }
            document.addEventListener('input', function (e) {
                var f = e.target && e.target.closest ? e.target.closest('form[data-requires-form]') : null;
                if (f) { sync(f); }
            });
            document.body.addEventListener('htmx:afterSwap', function (e) {
                var t = e.detail && e.detail.target;
                if (t && t.querySelectorAll) { t.querySelectorAll('form[data-requires-form]').forEach(sync); }
            });
        })();
        </script>
    </div>
</div>
</body>
</html>
