<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  B15 Toko 订单履约（V1.3.0 Story 10.2，模板 B · tpl-b-list；原 V1.4.0 Story 4.2/4.3 列表 + 独立详情页两页合一）。
  摘要条三格（待发货 / 在途 / 今日签收 WIB，随筛选联动，单条 COUNT FILTER）→ 筛选栏 → 表格（下单时间倒序、每页 20）
  → 行点击开 480px 抽屉（fragments/drawer-shop-order.html，?open=<token> 深链）。三个写端点路径 / 参数 / 权限零变更。
  🔒 **列表不渲染任何 PII**：收件人姓名 / 电话 / 详细地址只在抽屉里出现（一屏几十行 PII 最容易被整屏截图外传）。
  🔒 按电话搜索是**独立能力**：独立权限位 shop.order_phone_search，无权限时连输入框都不渲染、服务端另有判定、
     每次写审计、搜完不回显号码（AB-11A / NFR-11）——重构后这一整套原样保留。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.orders.title}">电商订单 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='shop-order'">
        <div class="wb-title-row"><h1 th:text="#{admin.shop.orders.title}">电商订单</h1></div>
        <p class="muted" th:text="#{admin.shop.orders.hint}">列表不显示收件人信息。要查看收件地址请打开订单抽屉。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <p th:if="${phoneSearched}" class="hint"
           th:text="#{admin.shop.orders.phoneSearch.audited}">本次按电话搜索已记入操作审计。</p>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::so-filters}, ~{::so-summary}, ~{::so-table}, ~{::so-drawer})}">
            <div th:fragment="so-filters">
                <form class="filter-bar" data-autosubmit th:attr="hx-get=@{/admin/shop/orders}"
                      hx-target="#shop-order-rows" hx-swap="innerHTML" hx-push-url="true">
                    <label class="field"><span th:text="#{admin.shop.orders.col.token}">订单号</span>
                        <input type="text" name="orderToken" class="inp" th:value="${orderToken}" maxlength="32"/>
                    </label>
                    <label class="field"><span th:text="#{admin.shop.orders.col.status}">状态</span>
                        <select name="status" class="sel">
                            <option value="" th:text="#{admin.shop.orders.filter.all}">全部</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s.name() == status}"
                                    th:text="#{'admin.v130.shopOrders.status.' + ${s}}">SHIPPED</option>
                        </select>
                    </label>
                    <label class="field"><span th:text="#{admin.shop.orders.filter.from}">起始日期</span>
                        <input type="date" name="from" class="inp" th:value="${from}"/>
                    </label>
                    <label class="field"><span th:text="#{admin.shop.orders.filter.to}">截止日期</span>
                        <input type="date" name="to" class="inp" th:value="${to}"/>
                    </label>
                    <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.common.filter}">筛选</button>
                </form>
                <!-- 🔒 按电话搜索：独立权限位 + 每次审计（AB-11A / NFR-11）。无权限时【连这张表单都不渲染】。
                     ⚠️ 走**整页 GET**（不挂 hx-get）：这是一次对 PII 的访问，必须留在浏览器历史里可追溯，
                        也避免把号码混进 htmx 的局部刷新参数里被反复重放。 -->
                <form th:if="${canPhoneSearch}" class="filter-bar" method="get" autocomplete="off"
                      th:action="@{/admin/shop/orders}">
                    <label class="field"><span th:text="#{admin.shop.orders.filter.phone}">收件人电话</span>
                        <!-- 🔒 不回显已搜过的号码：回显会把个人数据带进 URL、浏览器历史与访问日志 -->
                        <input type="search" name="phone" class="inp" value="" maxlength="20" autocomplete="off"/>
                    </label>
                    <button type="submit" class="btn btn-neutral btn-sm"
                            th:text="#{admin.shop.orders.btn.phoneSearch}">按电话搜索</button>
                    <span class="hint" th:text="#{admin.shop.orders.phoneSearch.hint}">每次搜索都会写入操作审计。</span>
                </form>
            </div>

            <div th:fragment="so-summary" th:replace="~{admin/fragments/shop-orders-list :: sumbar(false)}"></div>

            <div th:fragment="so-table" id="shop-order-rows">
                <div th:replace="~{admin/fragments/shop-orders-list :: rows(false)}"></div>
            </div>

            <div th:fragment="so-drawer" class="drawer-title" th:text="#{admin.shop.order.detail.title}">订单详情</div>
        </div>
        <!--/* ?open=<token> 跨页深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL。
               A6 来源卡 / A7 退货右栏 / A8 异常右栏都是这么跳过来的，而那一单多半不在首屏那 20 条里。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="shop-order"
              th:attr="data-drawer-deeplink=@{/admin/shop/orders/{t}(t=${open})}"></span>
    </div>
</div>
</body>
</html>
