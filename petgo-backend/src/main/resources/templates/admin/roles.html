<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  D6 角色配置列表（V1.3.0 Story 1.5 → 6.5 套模板 B（列表）；矩阵整页 roles-edit.html 不进抽屉，UI 稿 7-8～7-10）。仅超管（控制器 @PreAuthorize）。
  摘要条：预置角色 4 · 自定义 N · 使用中账号 M；列：角色名称 / 类型 / 权限数 / 使用中账号数 / 操作（编辑权限 → 整页矩阵；自定义可删）。
  端点全部来自 1-5（/admin/roles*），本 story 不加。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.roles.title}">角色配置 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='roles',noDrawer=true">
        <div class="wb-title-row">
            <h1 th:text="#{admin.roles.title}">角色配置</h1>
            <a class="btn btn-primary btn-sm" th:href="@{/admin/roles/new}" th:text="#{admin.roles.create}">＋ 新建角色</a>
        </div>
        <p class="muted" th:text="#{admin.roles.subtitle}">四个预置岗位角色的权限可在此编辑；也可新建自定义角色。变更对该角色下账号重新登录后生效。</p>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{}, ~{::ro-summary}, ~{::ro-table}, ~{})}">
            <div th:fragment="ro-summary" class="sum roles-toolbar" id="roles-summary">
                <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.roles.summary.system}">预置角色</div><div class="sum-value" th:text="${systemCount}">4</div></div>
                <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.roles.summary.custom}">自定义</div><div class="sum-value" th:text="${customCount}">0</div></div>
                <div class="sum-item"><div class="sum-label" th:text="#{admin.v130.roles.summary.accounts}">使用中账号</div><div class="sum-value" th:text="${accountTotal}">0</div></div>
            </div>

            <div th:fragment="ro-table" id="roles-rows">
                <table>
                    <thead>
                    <tr>
                        <th th:text="#{admin.roles.col.name}">角色名称</th>
                        <th th:text="#{admin.roles.col.type}">类型</th>
                        <th th:text="#{admin.roles.col.permissions}">权限数</th>
                        <th th:text="#{admin.roles.col.accounts}">使用中账号数</th>
                        <th th:text="#{admin.roles.col.action}">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${roles}" th:attr="data-id=${r.id}">
                        <td>
                            <span th:if="${r.system()}" th:text="#{${r.nameKey}}">运营专员</span>
                            <span th:unless="${r.system()}" th:text="${r.name}">自定义角色</span>
                            <span class="muted rv-small" th:text="${r.code}">OPERATIONS</span>
                        </td>
                        <td>
                            <span class="badge badge-muted" th:if="${r.system()}" th:text="#{admin.roles.type.system}">系统预置</span>
                            <span class="badge badge-ok" th:unless="${r.system()}" th:text="#{admin.roles.type.custom}">自定义</span>
                        </td>
                        <td th:text="${r.permissionCount}">19</td>
                        <td th:text="${r.accountCount}">3</td>
                        <td class="account-actions-cell">
                            <div class="account-actions">
                                <!-- 编辑权限 → 整页矩阵（不进 480px 抽屉，UI 稿 7-9） -->
                                <a class="btn btn-neutral btn-sm" th:href="@{/admin/roles/{id}/edit(id=${r.id})}"
                                   th:text="${r.system()} ? #{admin.roles.editPermissions} : #{admin.roles.edit}">编辑权限</a>
                                <form class="inline" th:unless="${r.system()}" th:action="@{/admin/roles/{id}/delete(id=${r.id})}" method="post"
                                      th:data-confirm="#{admin.roles.delete.confirm}" th:data-confirm-args="${r.name}">
                                    <button type="submit" class="btn btn-danger btn-sm" th:disabled="${r.accountCount > 0}"
                                            th:title="${r.accountCount > 0} ? #{admin.err.role.inUse(${r.accountCount})} : null" th:text="#{admin.roles.delete}">删除</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
