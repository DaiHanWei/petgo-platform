<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  礼物分类抽屉（V1.5.0 gift-pack Story 1-2 · AB-43，480px 抽屉体 res=giftcat，后台稿 K3 ~ K8）。结构照 drawer-gift.html：
    drawer      — 分类详情：抽屉头（名称 EN + cat-<id> + 状态）+ 编辑表单（无编辑权限 → 只读 + 缺权限说明，K8）
                  + 底部操作条（左：礼物数 +「查看礼物 ›」；右：下线 / 重新上线）
    createForm  — 新建分类（K3：保存在页脚，错误槽紧挨保存）
    afterAction — 编辑 / 上下线成功：抽屉体 oob 重渲染 + toast（分类表由 HX-Trigger 重拉）
  ⚠️ hx-target 一律指带 id 的 #gift-category-drawer-err（AdminBusinessExceptionAdvice 按 HX-Target 回填错误槽，K5）。
  🔴 只下线不删除；分类下还有在线礼物时「下线」disabled + 上方警示色原因（K4），服务端另行校验。可下线时走原生 data-confirm（K6）。
*/-->
<body>
<div th:fragment="drawer" id="gift-category-drawer-panel" class="tag-drawer" th:attr="data-category-id=${c.id}"
     th:with="canEdit=${#authorization.expression('hasRole(''SUPER_ADMIN'') or hasAuthority(''gift.catalog_edit'')')}">

    <section class="card card-full tag-card" data-section="category-head">
        <h2>
            <span th:text="${c.nameEn}">Toys</span>
            <span class="muted" th:text="${c.code()}">cat-3</span>
            <span class="badge" th:classappend="${c.offline()} ? 'badge-muted' : 'badge-ok'"
                  th:text="#{'admin.v140.gift.status.' + ${c.status}}">在线</span>
        </h2>
    </section>

    <section class="card card-full tag-card" data-section="category-edit">
        <form id="giftCategoryEditForm" th:if="${canEdit}" data-gift-category-edit-form
              th:attr="hx-post=@{/admin/gift-catalog/categories/{id}/edit(id=${c.id})}"
              hx-target="#gift-category-drawer-err" hx-swap="innerHTML">
            <div class="cfg-grid-2">
                <label class="field field-full">
                    <span th:text="#{admin.v140.gift.form.nameEn}">名称 EN</span>
                    <input type="text" name="nameEn" class="inp field-full" maxlength="40" required th:value="${c.nameEn}"
                           th:placeholder="#{admin.v150.giftCategory.form.nameEnPh}"/>
                </label>
                <label class="field field-full">
                    <span th:text="#{admin.v140.gift.form.nameId}">名称 ID</span>
                    <input type="text" name="nameId" class="inp field-full" maxlength="40" required th:value="${c.nameId}"
                           th:placeholder="#{admin.v150.giftCategory.form.nameIdPh}"/>
                </label>
            </div>
            <p class="hint" th:text="#{admin.v150.giftCategory.form.nameHint}">App 用户看到的是名称 ID……</p>

            <label class="field field-full">
                <span th:text="#{admin.v140.gift.form.sortOrder}">排序</span>
                <input type="number" name="sortOrder" class="inp" min="0" step="1"
                       th:attr="max=${maxSortOrder}" th:value="${c.sortOrder}"/>
            </label>
            <p class="hint" th:text="#{admin.v140.gift.form.sortOrderHint}">数字小的在前</p>

            <div id="gift-category-drawer-err" class="lst-inline-error" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary" data-gift-category-save th:text="#{admin.v140.gift.save}">保存</button>
        </form>

        <!--/* K8 只读：字段换成只读展示 + 所缺权限 */-->
        <dl class="gift-kv" th:unless="${canEdit}" data-gift-category-readonly>
            <dt th:text="#{admin.v140.gift.col.name}">名称（EN / ID）</dt>
            <dd th:text="${c.nameEn} + ' / ' + ${c.nameId}">Toys / Mainan</dd>
            <dt th:text="#{admin.v140.gift.col.sortOrder}">排序</dt>
            <dd th:text="${c.sortOrder}">30</dd>
        </dl>
        <p class="hint" th:unless="${canEdit}"
           th:text="#{admin.v130.err.forbidden(#{perm.gift.catalog_edit})}">需要「编辑礼物目录」权限</p>
    </section>

    <section class="pl-actions sticky-footer" data-gift-category-actions>
        <span class="muted" data-gift-category-stats>
            <span th:text="#{admin.v150.giftCategory.stats(${c.onlineGifts}, ${c.totalGifts})}">8 个在线礼物 · 共 8 个</span>
            ·
            <a th:href="@{/admin/gift-catalog(tab='gift',category=${c.id})}" data-view-gifts
               th:text="#{admin.v150.giftCategory.viewGifts}">查看礼物 ›</a>
        </span>
        <!--/* K4：在线且有在线礼物 → 原因（警示色）+ 「下线」disabled */-->
        <span class="gift-warn-reason" th:if="${!c.offline() and !c.canOffline()}" data-offline-blocked
              th:text="'ⓘ ' + #{admin.v150.giftCategory.offlineBlocked(${c.onlineGifts})}">还有 8 个在线礼物……</span>
        <form class="inline" th:if="${canEdit}"
              th:attr="hx-post=@{/admin/gift-catalog/categories/{id}/status(id=${c.id})},
                       data-confirm=${c.offline()} ? null : #{admin.v150.giftCategory.offlineConfirm(${c.nameEn})}"
              hx-target="#gift-category-drawer-err" hx-swap="innerHTML">
            <input type="hidden" name="online" th:value="${c.offline()}"/>
            <button type="submit" class="btn btn-sm" th:classappend="${c.offline()} ? '' : 'btn-danger'"
                    th:disabled="${!c.offline() and !c.canOffline()}"
                    th:text="${c.offline()} ? #{admin.v140.gift.online} : #{admin.v140.gift.offline}">下线</button>
        </form>
        <button type="button" class="btn btn-sm" th:classappend="${c.offline()} ? '' : 'btn-danger'" disabled th:unless="${canEdit}"
                th:title="#{admin.v130.err.forbidden(#{perm.gift.catalog_edit})}"
                th:text="${c.offline()} ? #{admin.v140.gift.online} : #{admin.v140.gift.offline}">下线</button>
    </section>

    <script>
        (function () {
            var t = document.querySelector('#giftcat-drawer .drawer-title');
            if (t && t.hasAttribute('data-default-title')) { t.textContent = t.getAttribute('data-default-title'); }
        })();
    </script>
    <script>
        (function () {
            var form = document.querySelector('[data-gift-category-edit-form]');
            if (!form) { return; }
            var save = form.querySelector('[data-gift-category-save]');
            function snapshot() {
                var fd = new FormData(form);
                var out = [];
                fd.forEach(function (v, k) { out.push(k + '=' + v); });
                return out.join('&');
            }
            var initial = snapshot();
            function sync() { if (save) { save.disabled = snapshot() === initial; } }
            form.addEventListener('input', sync);
            form.addEventListener('change', sync);
            sync();
        })();
    </script>
</div>

<!--/* K3 新建分类：名称 EN / ID 并排 → 排序（占位「数字小的在前」）→ 页脚保存 */-->
<div th:fragment="createForm" class="tag-create" id="gift-category-create"
     th:attr="data-drawer-title=#{admin.v150.giftCategory.drawer.newTitle}">
    <form th:attr="hx-post=@{/admin/gift-catalog/categories}" hx-target="#gift-category-drawer-err" hx-swap="innerHTML"
          id="giftCategoryCreateForm">
        <div class="cfg-grid-2">
            <label class="field field-full">
                <span th:text="#{admin.v140.gift.form.nameEn}">名称 EN</span>
                <input type="text" name="nameEn" class="inp field-full" maxlength="40" required
                       th:placeholder="#{admin.v150.giftCategory.form.nameEnPh}"/>
            </label>
            <label class="field field-full">
                <span th:text="#{admin.v140.gift.form.nameId}">名称 ID</span>
                <input type="text" name="nameId" class="inp field-full" maxlength="40" required
                       th:placeholder="#{admin.v150.giftCategory.form.nameIdPh}"/>
            </label>
        </div>
        <p class="hint" th:text="#{admin.v150.giftCategory.form.nameHint}">App 用户看到的是名称 ID……</p>
        <label class="field field-full">
            <span th:text="#{admin.v140.gift.form.sortOrder}">排序</span>
            <input type="number" name="sortOrder" class="inp gift-sort" min="0" step="1" th:attr="max=${maxSortOrder}"
                   th:placeholder="#{admin.v140.gift.form.sortOrderHint}"/>
        </label>
        <div class="gift-create-foot">
            <div id="gift-category-drawer-err" class="lst-inline-error" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary" th:text="#{admin.v140.gift.save}">保存</button>
        </div>
    </form>
    <script>
        (function () {
            var t = document.querySelector('#giftcat-drawer .drawer-title');
            var f = document.getElementById('gift-category-create');
            if (!t || !f) { return; }
            if (!t.hasAttribute('data-default-title')) { t.setAttribute('data-default-title', t.textContent); }
            t.textContent = f.getAttribute('data-drawer-title');
        })();
    </script>
</div>

<th:block th:fragment="afterAction">
    <div id="gift-category-drawer-body-oob" hx-swap-oob="innerHTML:#giftcat-drawer .drawer-body">
        <div th:replace="~{admin/fragments/drawer-gift-category :: drawer}"></div>
    </div>
    <div hx-swap-oob="beforeend:#admin-toast-host">
        <div class="toast" role="status" th:text="${toast}">已保存</div>
    </div>
</th:block>
</body>
</html>
