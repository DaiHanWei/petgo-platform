<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  B5 排期发布页签（V1.3.0 Story 7.5，模板 B · tpl-b-list，UI 稿 2-23～2-24）。
  由 V1.1.6 Story 13.5 的独立页 `content-schedules.html` 迁来 —— 那一页整页已删，
  这里是它唯一的去处（原 `scheduleSection` 片段的替身）。
    tab           — 整个页签体（筛选 + 摘要条 + 表格 + 抽屉壳）
    summary(oob)  — 三格：待发布 · 今日已发（WIB）· 失败
    rows(oob)     — 表格 + 空态 + 分页；oob=true 时摘要条随片段一并换
    row(r)        — 单行（本页没有单行 oob：处置后一律整表重拉，见 afterAction）
    afterAction   — 改时间 / 取消成功：只回一个 toast，表由 HX-Trigger 整表重拉
  🛡 表里**含失败行**：到点失败的行不自动消失、也不自动重试 —— 它留在这里就是为了让运营看见并处理。
  🛡 时间一律 WIB 并在界面上明示（与 11-1 / 11-2 / 11-3、Excel 导入四处一致）。
*/-->
<body>
<th:block th:fragment="tab" th:with="res='schedule'">
    <!--/* 🛡 AC3：时间一律 WIB，且**界面须明示** —— 不写运营就按自己电脑的时区读，整批排期看着都对不上 */-->
    <p class="hint" th:text="#{admin.schedule.wibNote}">
        所有计划时间都按印尼时间（WIB, Asia/Jakarta）解释。</p>

    <!--/* ⚠️ 槽位一律写**全模板名**（不用 ~{::x}）：这段本身是被 seed-batches.html 插进去的片段，
           `::` 在插入语境下指向哪个模板不是一眼能看清的事，写全名就没有这个歧义。 */-->
    <div th:replace="~{admin/fragments/tpl-b-list :: list(
            ~{admin/fragments/schedules-tab :: sched-filters},
            ~{admin/fragments/schedules-tab :: sched-summary},
            ~{admin/fragments/schedules-tab :: sched-table},
            ~{admin/fragments/schedules-tab :: sched-drawer-title})}"></div>

    <!--/* ?open=<id> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL */-->
    <span hidden th:if="${open != null}" data-drawer-res="schedule"
          th:attr="data-drawer-deeplink=@{/admin/content-schedules/{id}/drawer(id=${open})}"></span>
</th:block>

<!--/* 筛选栏。🔴 `authorId` **必须保留** —— Story 12.1「移出发布身份前」的提示带着它跳进来，
       独立页退役后这里是它唯一的落点（AdminPublishIdentityController.SCHEDULE_LIST_PATH）。
       ⚠️ 表单同时给了 method/action（无 JS 时整页 GET 回本页签）与 hx-get（htmx 时只换表格）：
          两条路径参数逐字相同。**不加 hx-push-url** —— 片段地址不是一个页面，推进地址栏刷新就 404。 */-->
<form th:fragment="sched-filters" class="filter-bar" data-autosubmit method="get"
      th:action="@{/admin/seed-batches}"
      th:attr="hx-get=@{/admin/seed-batches/schedules}" hx-target="#schedules-rows" hx-swap="innerHTML">
    <input type="hidden" name="tab" value="schedules"/>
    <!--/* 改时间 / 取消成功 → HX-Trigger admin:schedule-list-refresh：按当前筛选 + 当前页重拉。
           ⚠️ 监听点必须在 #schedules-rows **之外**，否则它会被自己那次 swap 一起换掉。 */-->
    <span hidden data-schedule-refresh th:attr="hx-get=@{/admin/seed-batches/schedules}"
          hx-include="closest form" hx-trigger="admin:schedule-list-refresh from:body"
          hx-target="#schedules-rows" hx-swap="innerHTML"
          hx-vals="js:{page: (document.querySelector('#schedules-rows .pager') || {}).getAttribute ? (document.querySelector('#schedules-rows .pager').getAttribute('data-page') || 0) : 0}"></span>
    <label class="field">
        <span th:text="#{admin.schedule.filterByAuthor}">按发布账号过滤（用户 ID）</span>
        <input type="number" name="authorId" class="inp" th:value="${authorId}"/>
    </label>
    <label class="field">
        <span th:text="#{admin.common.status}">状态</span>
        <select name="status" class="sel">
            <option value="" th:selected="${status == null or status.isEmpty()}"
                    th:text="#{admin.v130.schedules.filter.status.all}">待发布 + 失败</option>
            <option th:each="s : ${statusOptions}" th:value="${s}" th:selected="${status == s.name()}"
                    th:text="#{'admin.v130.schedules.status.' + ${s}}">待发布</option>
        </select>
    </label>
    <label class="field">
        <span th:text="#{admin.v130.schedules.filter.date}">计划日期（WIB）</span>
        <input type="date" name="date" class="inp" th:value="${date}"/>
    </label>
    <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.schedule.filter}">筛选</button>
</form>

<div th:fragment="sched-summary" th:remove="tag">
    <div th:replace="~{admin/fragments/schedules-tab :: sumbar(false)}"></div>
</div>

<div th:fragment="sched-table" id="schedules-rows">
    <div th:replace="~{admin/fragments/schedules-tab :: rows(false)}"></div>
</div>

<div th:fragment="sched-drawer-title" class="drawer-title"
     th:text="#{admin.v130.schedules.drawer.title}">排期详情</div>

<div th:fragment="sumbar(oob)" class="sum" id="schedules-summary" th:attr="hx-swap-oob=${oob} ? 'true' : null">
    <div class="sum-item">
        <div class="sum-label" th:text="#{admin.v130.schedules.summary.pending}">待发布</div>
        <div class="sum-value" th:text="${summary.pending}">0</div>
    </div>
    <div class="sum-item">
        <div class="sum-label" th:text="#{admin.v130.schedules.summary.publishedToday}">今日已发（WIB）</div>
        <div class="sum-value" th:text="${summary.publishedToday}">0</div>
    </div>
    <!--/* 🔴 失败数单独一格并且不隐藏 0：失败行不自动重试，没人看见就永远发不出去 */-->
    <div class="sum-item">
        <div class="sum-label" th:text="#{admin.v130.schedules.summary.failed}">失败</div>
        <div class="sum-value" th:text="${summary.failed}">0</div>
    </div>
    <!--/* 口径说明：不写的话，选了「日期=明天」看到表里 0 行、摘要条仍写「待发布 12」，
           运营会当成 bug 报上来 */-->
    <p class="hint" data-notice="summary-basis" th:text="#{admin.v130.schedules.summary.basis}">
        摘要条是全量口径，不随状态 / 日期筛选变化。</p>
</div>

<th:block th:fragment="rows(oob)">
    <th:block th:if="${oob}"><div th:replace="~{admin/fragments/schedules-tab :: sumbar(true)}"></div></th:block>
    <table th:if="${!#lists.isEmpty(rows)}" class="schedules-table">
        <thead>
        <tr>
            <th th:text="#{admin.schedule.col.body}">内容摘要</th>
            <th th:text="#{admin.v130.schedules.col.author}">发布账号</th>
            <th class="nowrap" th:text="#{admin.schedule.col.at}">计划时间（WIB）</th>
            <th th:text="#{admin.common.status}">状态</th>
            <th th:text="#{admin.v130.schedules.col.error}">失败原因</th>
            <th th:text="#{admin.common.actions}">操作</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="r : ${rows}"><tr th:replace="~{admin/fragments/schedules-tab :: row(${r})}"></tr></th:block>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(rows)}">
        <span class="empty-emoji">🗓️</span>
        <p th:text="#{admin.schedule.empty}">当前没有排期</p>
    </div>

    <!--/* 改时间 / 取消的 422 · 403 落点。**带 id** —— htmx 只在目标带 id 时才发 HX-Target 头，
           而 AdminBusinessExceptionAdvice 按这个头 HX-Retarget（7.1 复审 C1 的教训）。
           无条件渲染：空表时也可能从抽屉发起处置。 */-->
    <div id="schedules-err" class="lst-inline-error" aria-live="polite"></div>

    <div class="pager" th:if="${!#lists.isEmpty(rows)}" th:attr="data-page=${page}">
        <a th:if="${page > 0}" href="#" data-no-drawer hx-target="#schedules-rows" hx-swap="innerHTML"
           th:attr="hx-get=@{/admin/seed-batches/schedules(authorId=${authorId},status=${status},date=${date},page=${page - 1})}"
           th:text="#{admin.audit.prev}">← 上一页</a>
        <span th:text="#{admin.v130.schedules.pager.page(${page + 1})}">第 1 页</span>
        <a th:if="${hasNext}" href="#" data-no-drawer hx-target="#schedules-rows" hx-swap="innerHTML"
           th:attr="hx-get=@{/admin/seed-batches/schedules(authorId=${authorId},status=${status},date=${date},page=${page + 1})}"
           th:text="#{admin.audit.next}">下一页 →</a>
    </div>
</th:block>

<!--/* 单行。点行（非操作区）开抽屉；操作区里是行内编辑态（<details>，不弹层）。 */-->
<table th:remove="tag"><tbody th:remove="tag">
    <tr th:fragment="row(r)" th:id="'schedule-row-' + ${r.id}"
        th:data-id="${r.id}" th:data-drawer-url="@{/admin/content-schedules/{id}/drawer(id=${r.id})}" tabindex="0"
        th:with="failed=${r.status.name() == 'FAILED'},published=${r.status.name() == 'PUBLISHED'}"
        th:classappend="${published} ? 'row-muted'">
        <td th:text="${#strings.abbreviate(r.body ?: '—', 40)}">摘要</td>
        <td class="nowrap" th:with="a=${authors != null} ? ${authors.get(r.authorUserId)} : null">
            <span th:if="${a != null and !a.deleted()}" th:text="${a.nickname()}">昵称</span>
            <span th:if="${a == null or a.deleted()}" th:text="#{admin.contentdetail.deletedUser}">已注销</span>
            <span class="muted">#<span th:text="${r.authorUserId}">0</span></span>
        </td>
        <td class="nowrap">
            <span th:if="${r.scheduledAt != null}"
                  th:text="${#temporals.format(r.scheduledAt, 'yyyy-MM-dd HH:mm', 'Asia/Jakarta')}">时间</span>
            <span th:if="${r.scheduledAt == null}">—</span>
            <span class="muted">WIB</span>
        </td>
        <td class="nowrap">
            <!--/* 🔴 失败行红点：失败不自动重试，靠这一眼被看见 */-->
            <span class="dot" th:classappend="${failed} ? 'dot--hot' : (${published} ? 'dot--done' : 'dot--wait')"></span>
            <span class="badge" th:classappend="${failed} ? 'badge-danger' : (${published} ? 'badge-muted' : 'badge-neutral')"
                  th:text="#{'admin.v130.schedules.status.' + ${r.status.name()}}">待发布</span>
        </td>
        <!--/* 🛡 失败原因要写清"我该怎么办"：账号被移出、审核拦下、宠物档案删了，处置方式完全不同。
               列宽有限 → 截断显示，title 里给完整原文（悬浮看全）。 */-->
        <td class="err sched-error" th:title="${r.errorMessage}"
            th:text="${#strings.abbreviate(r.errorMessage ?: '—', 30)}">—</td>
        <td>
            <!--/* AC3 行内编辑态：点「改时间」当场展开日期时间输入 + 保存 / 取消，**不弹层**。
                   用原生 <details>：无 JS 也能开合，htmx swap 进来也不需要重新绑定。
                   ⚠️ 已发布行只读（终态，内容已经对外可见）；失败行不给改时间入口 ——
                      服务层要求先回工作台修好再重排，这里给个说明比给一个必报错的按钮好。 */-->
            <details class="sched-edit" th:if="${!published and !failed}"
                     sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('virtual_account.manage')">
                <summary th:text="#{admin.schedule.reschedule}">改时间</summary>
                <!--/* ⚠️ 同时给 method/action（无 JS 时整页 PRG 回本页签）与 hx-post：
                       两条路径的端点与参数逐字相同，控制器里那个非 htmx 分支就是为它留的。 */-->
                <form class="sched-edit-form" method="post"
                      th:action="@{/admin/content-schedules/{id}/time(id=${r.id})}"
                      th:attr="hx-post=@{/admin/content-schedules/{id}/time(id=${r.id})}"
                      hx-target="#schedules-err" hx-swap="innerHTML">
                    <input type="hidden" name="authorId" th:value="${authorId}"/>
                    <input type="datetime-local" name="scheduledAt" class="inp" required
                           th:value="${r.scheduledAt != null} ? ${#temporals.format(r.scheduledAt, 'yyyy-MM-dd''T''HH:mm', 'Asia/Jakarta')} : null"/>
                    <span class="muted">WIB</span>
                    <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.common.save}">保存</button>
                    <button type="button" class="btn btn-neutral btn-sm" data-details-close
                            th:text="#{admin.v130.schedules.editClose}">收起</button>
                </form>
            </details>
            <form class="inline" th:if="${!published}" method="post"
                  sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('virtual_account.manage')"
                  th:action="@{/admin/content-schedules/{id}/cancel(id=${r.id})}"
                  th:attr="hx-post=@{/admin/content-schedules/{id}/cancel(id=${r.id})},
                           data-confirm=#{admin.schedule.cancelConfirm}"
                  hx-target="#schedules-err" hx-swap="innerHTML">
                <input type="hidden" name="authorId" th:value="${authorId}"/>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.schedule.cancel}">取消排期</button>
            </form>
            <span class="hint" th:if="${failed}" th:text="#{admin.v130.schedules.failedFixFirst}">
                失败行请回工作台修好再重新提交。</span>
            <span class="hint" th:if="${published}" th:text="#{admin.v130.schedules.publishedReadonly}">已发布，只读。</span>
        </td>
    </tr>
</tbody></table>

<!--/* 处置成功：只回一个 toast。表由 HX-Trigger admin:schedule-list-refresh 按当前筛选整表重拉 ——
       改时间会改变行在表里的位置（按计划时间升序），取消会让这一行离开本表，两种情况原位换行都会骗人。 */-->
<th:block th:fragment="afterAction">
    <div class="toast" role="status" hx-swap-oob="beforeend:#admin-toast-host" th:text="${toast}">已保存</div>
</th:block>
</body>
</html>
