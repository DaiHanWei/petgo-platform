<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  C1 对账四张核对卡（V1.3.0 Story 10.2 AC4）。字段**现状原样**，一个都不少：
    ① 订单（订单数 / 实付合计 / PawCoin 段 / QRIS 段 / 两段之和 = 实付 校验行）
    ② 运费（收取合计 / 其中被 PawCoin 抵扣）
    ③ 退款（已退合计 / 其中 PawCoin 段 / 现金净流入）
    ④ 赠币（本期发放 / 本期消费 / 其中赠币核销额近似）
  🔴 ①「两段之和 = 实付」不平 → **整卡红框**（现状只有一行文字变色，一屏数字里根本注意不到）。
     四张卡里只有 ① 有校验行 —— 另外三张现状就没有可判平的等式，不硬造一个。
  期间切换 htmx 只换这一块（cards），页头与只读标识不重绘。
-->
<body>
<div th:fragment="cards" class="cards" id="recon-cards">
    <!-- ① 订单 -->
    <section class="card card-kpi recon-card" th:classappend="${!r.segmentsBalance()} ? 'card-alert'">
        <h2 th:text="#{admin.v130.shopRecon.card.orders}">订单</h2>
        <table>
            <tr><th th:text="#{admin.shop.recon.col.orders}">订单数</th>
                <td th:text="${#numbers.formatInteger(r.orderCount(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.total}">实付合计</th>
                <td th:text="${#numbers.formatInteger(r.totalAmount(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.coin}">PawCoin 段</th>
                <td th:text="${#numbers.formatInteger(r.coinSegment(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.cash}">QRIS 段</th>
                <td th:text="${#numbers.formatInteger(r.cashSegment(), 0, 'COMMA')}">0</td></tr>
            <tr class="recon-check"><th th:text="#{admin.shop.recon.col.balanced}">两段之和 = 实付</th>
                <td><span class="badge" th:classappend="${r.segmentsBalance()} ? 'badge-ok' : 'badge-danger'"
                          th:text="${r.segmentsBalance()} ? #{admin.shop.recon.balanced} : #{admin.shop.recon.unbalanced}">是</span></td></tr>
        </table>
        <p class="banner err" th:unless="${r.segmentsBalance()}"
           th:text="#{admin.v130.shopRecon.unbalancedAlert}">两段之和与实付合计对不上，对账本身出了问题。</p>
    </section>

    <!-- ② 运费。🔴🔴 FR-100A 规则 3：被 PawCoin 抵扣的运费必须单独可拆 -->
    <section class="card card-kpi recon-card">
        <h2 th:text="#{admin.shop.recon.section.shipping}">运费</h2>
        <table>
            <tr><th th:text="#{admin.shop.recon.col.shippingCharged}">收取运费合计</th>
                <td th:text="${#numbers.formatInteger(r.shippingCharged(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.shippingByCoin}">其中：被 PawCoin 抵扣</th>
                <td th:text="${#numbers.formatInteger(r.shippingPaidByCoin(), 0, 'COMMA')}">0</td></tr>
        </table>
        <p class="hint" th:text="#{admin.shop.recon.shippingHint}">运费是平台向承运商支付的真实现金支出。</p>
    </section>

    <!-- ③ 退款 -->
    <section class="card card-kpi recon-card">
        <h2 th:text="#{admin.shop.recon.section.refund}">退款</h2>
        <table>
            <tr><th th:text="#{admin.shop.recon.col.refundTotal}">已退合计</th>
                <td th:text="${#numbers.formatInteger(r.refundedTotal(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.refundCoin}">其中：PawCoin 段</th>
                <td th:text="${#numbers.formatInteger(r.refundedCoin(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.netCash}">现金净流入</th>
                <td th:text="${#numbers.formatInteger(r.netCash(), 0, 'COMMA')}">0</td></tr>
        </table>
    </section>

    <!-- ④ 赠币。⚠️ S-12 折中：不做钱包侧批次分层，只给近似 -->
    <section class="card card-kpi recon-card">
        <h2 th:text="#{admin.shop.recon.section.bonus}">赠币</h2>
        <table>
            <tr><th th:text="#{admin.shop.recon.col.bonusIssued}">本期赠币发放</th>
                <td th:text="${#numbers.formatInteger(r.bonusIssued(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.coinSpent}">本期 PawCoin 消费</th>
                <td th:text="${#numbers.formatInteger(r.coinSpent(), 0, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.shop.recon.col.bonusRedeemed}">其中：赠币核销额（近似）</th>
                <td th:text="${#numbers.formatInteger(r.bonusRedeemedApprox(), 0, 'COMMA')}">0</td></tr>
        </table>
        <p class="hint err" th:text="#{admin.shop.recon.bonusHint}">⚠️「赠币核销额」是近似值。</p>
    </section>
</div>
</body>
</html>
