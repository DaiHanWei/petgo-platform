<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  A4 标记已处理成功 fragment（V1.3.0 Story 2.6 AC5，AD-9）：根元素 data-next-id（admin-workbench.js 自动下一条 / 空则右栏空态）；
  oob：被处理行删除（anomaly-row-<id>）、两态计数替换、toast 到 #admin-toast-host。HX-Trigger 由 Controller 写。
-->
<body>
<div th:fragment="done" class="an-done" data-done th:data-next-id="${nextId}">
    <div class="toast" role="status" hx-swap-oob="beforeend:#admin-toast-host" th:text="${message}">已处理</div>
    <div class="empty empty--queue" th:if="${#strings.isEmpty(nextId)}">
        <span class="empty-emoji">🎉</span>
        <p th:text="#{admin.v130.empty.queue}">队列已清空</p>
    </div>
    <li th:id="'anomaly-row-' + ${removedId}" hx-swap-oob="delete"></li>
    <span id="anomaly-tab-count-open" class="tab-count" hx-swap-oob="true" th:text="${counts.get('open')}">0</span>
    <span id="anomaly-tab-count-resolved" class="tab-count" hx-swap-oob="true" th:text="${counts.get('resolved')}">0</span>
</div>
</body>
</html>
