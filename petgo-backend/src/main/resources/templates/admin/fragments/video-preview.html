<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  专题线 video Story 3.3：后台视频帖预览（内容抽屉 drawer-content、审核详情 review-detail 共用）。
  src / poster 都是 PostMediaResolver#resolveForAdmin 投影出的签名地址（AD-8 forAdmin，私有 / 审核中 / 已下架都能播）。
  ⚠️ 签名 URL 只进页面，不进日志。poster 为空时 th:poster 不输出该属性。
*/-->
<body>
<div th:fragment="player(videoUrl, posterUrl)" class="rv-video" data-video-preview>
    <span class="badge badge-muted" th:text="#{admin.video.badge}">视频</span>
    <video controls preload="metadata" playsinline style="display:block;max-width:100%;max-height:480px;background:#000;margin-top:6px"
           th:src="${videoUrl}" th:poster="${posterUrl}"
           th:text="#{admin.video.unsupported}">当前浏览器无法播放该视频。</video>
</div>
</body>
</html>
