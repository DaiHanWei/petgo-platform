<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  B21 未成功请求抽屉（V1.3.0 Story 9.2 · AC1，480px 抽屉体 res=failed，UI 稿 6-8）。
  完整字段 + **三个独立动作**。三个写端点 POST {id}/note|follow-up|archive 逐字不变。
  🔴 三个动作是三件事，不是一件事的三种叫法（UI 稿 6-8 代码核实）：
     跟进 = 状态推进标记（无参数）；归档 = 移出活动区（SYSTEM_FAILURE 必须先跟进）；
     备注 = 可选自由文本。**不要合成一个「处理」下拉** —— 合起来之后，
     「我只是想记一句话」和「我要把它归档」会共用一次点击。
  ⚠️ hx-target 指**带 id 的** #failed-drawer-err：htmx 只在目标带 id 时才发 HX-Target 头。
*/-->
<body>
<div th:fragment="drawer" id="failed-drawer-panel" class="tag-drawer" th:attr="data-failed-id=${r.id}">

    <section class="card card-full tag-card" data-section="failed-fields">
        <h3 th:text="#{admin.v130.failed.drawer.title}">未成功请求</h3>
        <table class="ud-table">
            <tr><th th:text="#{admin.failed.col.token}">请求</th>
                <td class="mono" th:text="${r.requestToken}">tok</td></tr>
            <tr><th th:text="#{admin.common.userId}">用户 ID</th><td th:text="${r.userId}">1</td></tr>
            <tr><th th:text="#{admin.failed.col.submitted}">提交</th>
                <td class="nowrap" th:text="${@adminTime.wib(r.submittedAt)}">-</td></tr>
            <tr><th th:text="#{admin.failed.col.cancelled}">取消</th>
                <td class="nowrap" th:text="${@adminTime.wib(r.cancelledAt)}">-</td></tr>
            <tr><th th:text="#{admin.failed.col.reason}">原因</th>
                <td><span class="badge" th:classappend="${r.systemFailure} ? 'badge-danger' : 'badge-info'"
                          th:text="#{'admin.failed.reason.' + ${r.cancelReason.name()}}">原因</span></td></tr>
            <!--/* 🔴 「当时在线兽医数」是判断掉单原因的关键：0 表示压根没人能接，
                   非 0 才需要去查为什么没接上。 */-->
            <tr><th th:text="#{admin.failed.col.online}">当时在线兽医</th>
                <td th:text="${r.onlineVetCount}">0</td></tr>
            <tr><th th:text="#{admin.failed.col.followed}">跟进</th>
                <td><span class="badge" th:classappend="${r.followedUp} ? 'badge-ok' : 'badge-neutral'"
                          th:text="${r.followedUp} ? #{admin.failed.yes} : #{admin.failed.no}">否</span></td></tr>
            <tr><th th:text="#{admin.v130.failed.drawer.archivedAt}">归档时间</th>
                <td class="nowrap" th:text="${@adminTime.wib(r.archivedAt)}">—</td></tr>
        </table>
        <!--/* 有会话 id 时给一条去取证的路（B22 页内深链，新开标签，与 Story 2.6 对齐）。 */-->
        <p class="hint" th:if="${r.sessionId != null}">
            <a th:href="@{/admin/consult-sessions(open=${r.sessionId})}" target="_blank" rel="noopener"
               data-no-drawer th:text="#{admin.v130.failed.drawer.toSession}">去取证（历史会话）</a>
        </p>
    </section>

    <section class="card card-full tag-card" data-section="failed-actions">
        <h3 th:text="#{admin.common.actions}">操作</h3>

        <!--/* ① 备注：可选自由文本，随时可改（参数名 note 逐字不变）。 */-->
        <form th:attr="hx-post=@{/admin/failed-requests/{id}/note(id=${r.id})}"
              hx-target="#failed-drawer-err" hx-swap="innerHTML">
            <label class="field field-full">
                <span th:text="#{admin.failed.col.note}">备注</span>
                <input type="text" name="note" class="inp field-full" th:value="${r.note}"/>
            </label>
            <button type="submit" class="btn btn-neutral btn-sm"
                    th:text="#{admin.failed.saveNote}">保存备注</button>
        </form>

        <hr class="section-line"/>

        <!--/* ② 跟进：无参数的状态推进标记。已跟进后置灰（再点一次没有意义，也不会有反馈）。 */-->
        <form th:unless="${r.followedUp}"
              th:attr="hx-post=@{/admin/failed-requests/{id}/follow-up(id=${r.id})}"
              hx-target="#failed-drawer-err" hx-swap="innerHTML">
            <button type="submit" class="btn btn-primary btn-sm"
                    th:text="#{admin.failed.followUp}">标记跟进</button>
        </form>
        <button type="button" class="btn btn-primary btn-sm" disabled th:if="${r.followedUp}"
                th:title="#{admin.v130.failed.alreadyFollowedUp}"
                th:text="#{admin.failed.followUp}">标记跟进</button>

        <!--/* ③ 归档：移出活动区。
               🔴 SYSTEM_FAILURE 未跟进时**前置禁用并注明**（防呆）：服务层照旧会拒（422 落进
                  下面的错误槽），但让人点完再看报错，等于让他猜「缺什么」。
               ⚠️ 这里的禁用是**体验**，不是安全边界 —— 服务端那道判定一个字没动。 */-->
        <th:block th:unless="${r.archivedAt != null}">
            <form th:if="${!r.systemFailure or r.followedUp}"
                  th:attr="hx-post=@{/admin/failed-requests/{id}/archive(id=${r.id})}"
                  hx-target="#failed-drawer-err" hx-swap="innerHTML"
                  th:data-confirm="#{admin.v130.failed.archiveConfirm}">
                <button type="submit" class="btn btn-neutral btn-sm"
                        th:text="#{admin.failed.archive}">归档</button>
            </form>
            <th:block th:if="${r.systemFailure and !r.followedUp}">
                <button type="button" class="btn btn-neutral btn-sm" disabled
                        th:title="#{admin.v130.failed.archiveNeedsFollowUp}"
                        th:text="#{admin.failed.archive}">归档</button>
                <p class="hint" data-notice="failed-archive-blocked"
                   th:text="#{admin.v130.failed.archiveNeedsFollowUp}">系统故障必须先标记跟进才能归档。</p>
            </th:block>
        </th:block>
        <p class="hint" th:if="${r.archivedAt != null}" data-notice="failed-archived"
           th:text="#{admin.v130.failed.alreadyArchived}">已归档。</p>

        <div id="failed-drawer-err" class="lst-inline-error" aria-live="polite"></div>
    </section>
</div>

<!--/* 处置成功：抽屉体 oob + toast；列表由 HX-Trigger 的 admin:failed-request-list-refresh
       按当前页签整表重拉。
       ⚠️ 不做单行 oob：归档会把这一行从「活动」移走 —— 原位换行会留下一张骗人的表。 */-->
<th:block th:fragment="afterAction">
    <div id="failed-drawer-body-oob" hx-swap-oob="innerHTML:#failed-drawer .drawer-body">
        <div th:replace="~{admin/fragments/drawer-failed-request :: drawer}"></div>
    </div>
    <!--/* 🔴 toast 多包一层：htmx 的 `beforeend:` oob 搬的是**子节点**，直接写在 .toast 上
           落进宿主的只有裸文本（无样式、armToast 找不到元素 → 永不消失）。 */-->
    <div hx-swap-oob="beforeend:#admin-toast-host">
        <div class="toast" role="status" th:text="${toast}">已处理</div>
    </div>
</th:block>
</body>
</html>
