<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  B3 顶置抽屉（V1.3.0 Story 7.3 AC3～AC6，480px 抽屉体 res=pin，UI 稿 2-11～2-13）。两种渲染：
    drawer     — 详情态：坑位内容预览（顶置=帖子快照 / 推广=卡面预览）+ 时间设置（行内可编辑）+ 操作条
    createForm — 新建态：坑位 / 类型二选 / 内容选择器（搜索 + 分页 + 300ms 防抖）/ 推广卡片字段 / 起止时间
  ⚠️ 三个 POST 的路径与参数逐字不变（slot / objectType / contentId / promoImageUrl / promoImageFile /
     promoTitle / promoLinkUrl / startsAt / endsAt）—— 本 story 只是把表单从页尾搬进抽屉。
  ⚠️ hx-target 一律指**带 id 的** #pin-drawer-err：htmx 只在目标带 id 时才发 HX-Target 头，
     而 AdminBusinessExceptionAdvice 按这个头 HX-Retarget（7.1 复审 C1 的教训）。重叠冲突的 422 就落这里。
  🔴 时间输入旁必须有「WIB」字样：不写运营就按自己电脑的时区填，整批排期偏移。
  🔴 已结束的排期只读（editable=false）。
*/-->
<body>
<div th:fragment="drawer" class="pin-drawer" th:attr="data-pin-id=${d.row.id}"
     th:with="r=${d.row},canManage=${#authorization.expression('hasRole(''SUPER_ADMIN'') or hasAuthority(''content.pin_manage'')')}">
    <div class="banner warn" th:if="${warn}" th:text="${warn}">卡片图比例超出展示区间</div>

    <!--/* ① 坑位内容预览 */-->
    <section class="card card-full pin-card" data-section="pin-preview">
        <h2>
            <span th:text="${d.promo()} ? #{admin.pins.type.promo} : #{admin.pins.type.content}">类型</span>
            <span class="muted">#<span th:text="${r.id}">1</span></span>
            <span class="badge"
                  th:classappend="${r.ended()} ? 'badge-muted' : (${r.phase.name() == 'ACTIVE'} ? 'badge-ok' : 'badge-neutral')"
                  th:text="${r.ended()} ? #{admin.pins.phase.ended}
                           : (${r.phase.name() == 'ACTIVE'} ? #{admin.pins.phase.active} : #{admin.pins.phase.pending})">状态</span>
            <span class="badge badge-warn" th:if="${r.contentGone and !d.promo()}" th:text="#{admin.pins.contentGone}">内容失效未生效</span>
        </h2>
        <div class="pin-preview">
            <img th:if="${d.promo()} ? ${d.promoImage != null} : ${d.postImage != null}"
                 th:src="${d.promo()} ? ${d.promoImage} : ${d.postImage}" alt="" loading="lazy" data-lightbox class="rv-img"/>
            <div>
                <p class="pl-desc" th:text="${r.summary} ?: #{admin.v130.pins.preview.gone}">内容摘要 / 卡片标题</p>
                <!--/* 顶置内容：作者 + 直接跳 B1 抽屉看全文 */-->
                <p class="muted rv-small" th:unless="${d.promo()}">
                    <span th:if="${!d.authorDeleted and d.authorName != null}" th:text="${d.authorName}">作者</span>
                    <span th:if="${d.authorDeleted or d.authorName == null}" th:text="#{admin.contentdetail.deletedUser}">已注销</span>
                    <a th:if="${r.contentId != null}" data-no-drawer target="_blank" rel="noopener"
                       th:href="@{/admin/content(open=${r.contentId})}" th:text="#{admin.v130.pins.preview.openContent}">去内容管理 ↗</a>
                </p>
                <!--/* 推广卡片：跳转目标建卡时本就允许留空 */-->
                <p class="muted rv-small" th:if="${d.promo()}">
                    <a th:if="${d.promoLink != null}" th:href="${d.promoLink}" target="_blank" rel="noopener"
                       data-no-drawer th:text="${d.promoLink}">跳转目标</a>
                    <span th:if="${d.promoLink == null}" th:text="#{admin.v130.pins.preview.noLink}">（无跳转目标）</span>
                </p>
            </div>
        </div>
    </section>

    <!--/* ② 时间设置（行内可编辑）：端点与参数就是 11.1 的 {id}/edit */-->
    <section class="card card-full pin-card" data-section="pin-window">
        <h3 th:text="#{admin.pins.window}">生效时间（WIB）</h3>
        <form class="pin-window-form" th:if="${r.editable() and canManage}"
              th:attr="hx-post=@{/admin/content-pins/{id}/edit(id=${r.id})}"
              hx-target="#pin-drawer-err" hx-swap="innerHTML">
            <input type="datetime-local" name="startsAt" class="inp"
                   th:value="${#temporals.format(r.startsAt, 'yyyy-MM-dd''T''HH:mm', 'Asia/Jakarta')}" required/>
            <input type="datetime-local" name="endsAt" class="inp"
                   th:value="${#temporals.format(r.endsAt, 'yyyy-MM-dd''T''HH:mm', 'Asia/Jakarta')}" required/>
            <span class="muted">WIB</span>
            <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.pins.edit}">改时间</button>
        </form>
        <p class="muted" th:unless="${r.editable()}">
            <span th:text="${#temporals.format(r.startsAt, 'yyyy-MM-dd HH:mm', 'Asia/Jakarta')}">开始</span>
            –
            <span th:text="${#temporals.format(r.endsAt, 'yyyy-MM-dd HH:mm', 'Asia/Jakarta')}">结束</span>
            <span class="muted">WIB</span>
        </p>
        <p class="hint" th:unless="${canManage}" th:text="#{admin.v130.err.forbidden(#{perm.content.pin_manage})}">需要「编辑顶置配置」权限</p>
    </section>

    <div id="pin-drawer-err" class="lst-inline-error" aria-live="polite"></div>

    <!--/* ③ 操作条 */-->
    <section class="pl-actions sticky-footer" data-pin-actions>
        <form class="inline" th:if="${r.editable() and canManage}"
              th:attr="hx-post=@{/admin/content-pins/{id}/terminate(id=${r.id})},data-confirm=#{admin.pins.terminateConfirm}"
              hx-target="#pin-drawer-err" hx-swap="innerHTML">
            <button type="submit" class="btn btn-danger btn-sm" th:text="#{admin.pins.terminate}">提前结束</button>
        </form>
        <!--/* 只读权限：按钮渲染成禁用态并注明缺哪个权限（AC5）—— 整块空白会让人以为「这条没有操作」 */-->
        <button type="button" class="btn btn-danger btn-sm" disabled th:unless="${canManage}"
                th:title="#{admin.v130.err.forbidden(#{perm.content.pin_manage})}"
                th:text="#{admin.pins.terminate}">提前结束</button>
        <span class="hint" th:if="${r.ended()}" th:text="#{admin.v130.pins.endedReadonly}">已结束的排期只读。</span>
    </section>
</div>

<!--/* 新建顶置表单（AC4）：字段与 POST /admin/content-pins 的参数逐字不变；multipart（卡片图本地上传） */-->
<div th:fragment="createForm" class="pin-create" id="pin-create">
    <form th:attr="hx-post=@{/admin/content-pins}" hx-encoding="multipart/form-data"
          hx-target="#pin-drawer-err" hx-swap="innerHTML" id="pinCreateForm"
          th:action="@{/admin/content-pins}" method="post" enctype="multipart/form-data">
        <h3 th:text="#{admin.pins.new}">新建顶置</h3>
        <input type="hidden" name="slot" th:value="${slot}"/>
        <label class="field field-full">
            <span th:text="#{admin.pins.objectType}">类型</span>
            <select name="objectType" id="pinObjectType" class="sel">
                <option value="CONTENT" th:text="#{admin.pins.type.content}">顶置已发布内容</option>
                <option value="PROMO" th:text="#{admin.pins.type.promo}">推广卡片</option>
            </select>
        </label>

        <!--/* 内容型：选择器（只列公开内容，搜索 300ms 防抖 + 分页；大结果集不可平铺——1.2.0 既有要求） */-->
        <fieldset id="pinContentFields">
            <legend th:text="#{admin.pins.pickContent}">选择内容</legend>
            <p class="hint" th:text="#{admin.pins.pickHint}">只列可公开展示的内容。</p>
            <input type="search" name="q" class="inp field-full" th:placeholder="#{admin.pins.pickSearch}"
                   hx-get="/admin/content-pins/pick" hx-target="#pinCandidates"
                   hx-trigger="keyup changed delay:300ms, search"/>
            <div id="pinCandidates">
                <div th:replace="~{admin/content-pins :: candidates}"></div>
            </div>
        </fieldset>

        <!--/* 推广卡片型 */-->
        <fieldset id="pinPromoFields">
            <legend th:text="#{admin.pins.type.promo}">推广卡片</legend>
            <label class="field field-full">
                <span th:text="#{admin.pins.promoUpload}">卡片图（本地上传）</span>
                <input type="file" name="promoImageFile" id="pinPromoImageFile" accept="image/jpeg,image/png,image/webp"/>
            </label>
            <!--/* 🔴 尺寸要求常驻在控件旁：后端没有硬校验、页面不写要求，运营只能靠猜 */-->
            <p class="hint" th:text="#{admin.pins.promoImageSpec}">JPG / PNG / WebP，≤ 10MB；比例 0.75–1.34 不裁切。</p>
            <label class="field field-full">
                <span th:text="#{admin.pins.promoImage}">或填图片 URL</span>
                <input type="url" name="promoImageUrl" id="pinPromoImageUrl" class="inp field-full"/>
            </label>
            <!--/* 🔴 比例警告：卡片在 Feed 里就是一张普通内容卡，同样受 0.75~1.34 的 clamp + cover 裁切约束。
                   在浏览器里量 naturalWidth/naturalHeight —— URL 与本地文件都量，不用先上传、也不用服务端抓图。 */-->
            <img id="pinPromoProbe" alt="" hidden/>
            <p class="banner warn" id="pinAspectWarn" hidden></p>
            <label class="field field-full">
                <span th:text="#{admin.pins.promoTitle}">卡片标题</span>
                <input type="text" name="promoTitle" class="inp field-full"/>
            </label>
            <label class="field field-full">
                <span th:text="#{admin.pins.promoLink}">跳转目标（可空）</span>
                <input type="url" name="promoLinkUrl" class="inp field-full"/>
            </label>
        </fieldset>

        <label class="field field-full">
            <span th:text="#{admin.pins.window}">生效时间（WIB）</span>
            <input type="datetime-local" name="startsAt" class="inp" required/>
            <input type="datetime-local" name="endsAt" class="inp" required/>
            <!--/* 🛡 WIB 字样必须在输入框旁：不写运营就按自己电脑的时区填，整批排期偏移 */-->
            <span class="muted">WIB</span>
        </label>
        <!--/* ⚠️ err 槽放在提交钮**正上方**：这张表单很长（类型 + 候选列表 + 推广字段 + 时间），
               422（重叠 / 缺必填）落在表单顶部时早已滚出 480px 抽屉的视口 */-->
        <div id="pin-drawer-err" class="lst-inline-error" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary" th:text="#{admin.pins.save}">保存</button>
    </form>

    <!--/* 类型切换与比例预警：原页尾脚本原样搬进抽屉（htmx 会执行 swap 进来的 <script>，
           每次打开新建抽屉都重新绑定，不需要额外的 re-init 钩子）。i18n 文案仍走 th:inline。 */-->
    <script th:inline="javascript">
        /*<![CDATA[*/
        (function () {
            var typeSel = document.getElementById('pinObjectType');
            var contentFs = document.getElementById('pinContentFields');
            var promoFs = document.getElementById('pinPromoFields');
            function sync() {
                var promo = typeSel.value === 'PROMO';
                contentFs.hidden = promo;
                promoFs.hidden = !promo;
            }
            if (typeSel) { typeSel.addEventListener('change', sync); sync(); }

            var urlInput = document.getElementById('pinPromoImageUrl');
            var probe = document.getElementById('pinPromoProbe');
            var warn = document.getElementById('pinAspectWarn');
            var fileInput = document.getElementById('pinPromoImageFile');
            var TPL = /*[[#{admin.pins.aspectWarn}]]*/ '';
            var SIDES = /*[[#{admin.pins.aspectCropSides}]]*/ '';
            var TB = /*[[#{admin.pins.aspectCropTopBottom}]]*/ '';
            function fmt(t, a, b) { return String(t).replace('{0}', a).replace('{1}', b); }
            function probeSrc(src) {
                warn.hidden = true;
                if (!src) { return; }
                probe.onload = function () {
                    var ratio = probe.naturalWidth / probe.naturalHeight;
                    if (ratio >= 0.75 && ratio <= 1.34) { warn.hidden = true; return; }
                    var pct, how;
                    if (ratio > 1.34) {
                        pct = Math.round((1 - 1.34 / ratio) / 2 * 100);
                        how = fmt(SIDES, pct, '');
                    } else {
                        pct = Math.round((1 - ratio / 0.75) / 2 * 100);
                        how = fmt(TB, pct, '');
                    }
                    warn.textContent = fmt(TPL, ratio.toFixed(2), how);
                    warn.hidden = false;   // 🛡 只警告，不阻止提交
                };
                probe.onerror = function () { warn.hidden = true; };
                probe.src = src;
            }
            if (urlInput && probe && warn) {
                urlInput.addEventListener('change', function () { probeSrc(urlInput.value); });
            }
            if (fileInput && probe && warn) {
                fileInput.addEventListener('change', function () {
                    var f = fileInput.files && fileInput.files[0];
                    probeSrc(f ? URL.createObjectURL(f) : '');
                });
            }
        })();
        /*]]>*/
    </script>
</div>

<!--/* 处置 / 新建成功：抽屉体 oob + toast；列表由 HX-Trigger admin:pin-list-refresh 整表重拉
       （新建的行页面上还没有，oob 插不进去；摘要条与状态筛选也都要跟着变） */-->
<th:block th:fragment="afterAction">
    <div id="pin-drawer-body-oob" hx-swap-oob="innerHTML:#pin-drawer .drawer-body">
        <div th:replace="~{admin/fragments/drawer-content-pin :: drawer}"></div>
    </div>
    <div class="toast" role="status" hx-swap-oob="beforeend:#admin-toast-host" th:text="${toast}">已保存</div>
</th:block>
</body>
</html>
