<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  B19 开封判例列表片段（V1.3.0 Story 10.4 AC4）。
  rows — 判例表 + 空态；done — 沉淀成功（整表重拉 + toast + 关抽屉）。
  🔴 判定是**枚举语义**（算开封 / 不算开封）不是布尔显示：这两个词决定了一笔退货能不能退钱，
     必须走 key，不能在模板里拼 true/false。
-->
<body>
<th:block th:fragment="rows">
    <table th:if="${!#lists.isEmpty(rows)}">
        <thead><tr>
            <th th:text="#{admin.shop.precedents.col.situation}">情形</th>
            <th th:text="#{admin.shop.precedents.col.judged}">判定</th>
            <th th:text="#{admin.shop.precedents.col.rationale}">理由</th>
            <th th:text="#{admin.shop.orders.col.createdAt}">时间</th>
        </tr></thead>
        <tbody>
        <tr th:each="p : ${rows}">
            <td th:text="${p.situation}">外包装已拆但内袋未开</td>
            <td>
                <span class="badge" th:classappend="${p.judgedOpened} ? 'badge-warn' : 'badge-ok'"
                      th:text="${p.judgedOpened} ? #{admin.shop.precedents.opened} : #{admin.shop.precedents.notOpened}">不算开封</span>
            </td>
            <td th:text="${p.rationale}">内袋密封完好，不影响二次销售</td>
            <td th:text="${@adminTime.wib(p.createdAt)}">-</td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(rows)}">
        <span class="empty-emoji">⚖️</span>
        <!--/* 🔴 空态分两种：检索无结果 ≠ 判例库是空的。混成一句的话，客服搜不到就以为
               「这里还没人沉淀过」，转头自己拍一个判定 —— 而那正是判例库要防的事。 */-->
        <p th:if="${#strings.isEmpty(q)}" th:text="#{admin.shop.precedents.empty}">暂无判例。</p>
        <p th:unless="${#strings.isEmpty(q)}"
           th:text="#{admin.v130.shopPrecedents.noMatch(${q})}">没有匹配的判例。</p>
    </div>
</th:block>

<!--
  沉淀成功。🔴 列表走 **oob**：抽屉表单的 hx-target 是抽屉体（4xx 要落在运营正看着的地方），
  主 swap 指不到表格上。整表重拉 —— 判例按时间倒序，新沉淀的那条落在第一行，没有「被点的那一行」可换。
  ⚠️ 重拉的是**不带检索词**的全量：刚沉淀的那条多半不匹配运营此刻的检索词，
     按 q 重拉会得到「保存成功了但列表里找不到它」——最像失败的一种成功。
-->
<th:block th:fragment="done">
    <!--/* toast 必须多包一层：`beforeend:` oob 搬的是子节点，直接写在 .toast 上落进宿主的只有裸文本。 */-->
    <div hx-swap-oob="beforeend:#admin-toast-host">
        <div class="toast" role="status" th:text="${message}">已保存</div>
    </div>
    <div id="shop-precedent-rows" hx-swap-oob="true">
        <div th:replace="~{admin/fragments/shop-precedents-list :: rows}"></div>
    </div>
</th:block>
</body>
</html>
