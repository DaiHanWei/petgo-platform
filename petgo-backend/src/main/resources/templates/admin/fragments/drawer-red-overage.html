<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  B14 红色超额抽屉（V1.3.0 Story 8.5 · AC4，480px 抽屉体 res=red，UI 稿 4-5）。
  RED 分诊历史 + 人工标记。唯一写端点 POST {userId}/review(status, note) 逐字不变。
  🔴 历史**只列任务 id / 状态 / 时间**：症状文本、AI 解析、图片都是健康数据，不进后台展示
     （架构 §Enforcement；理由见 RedTaskRow 的注释）。
  ⚠️ hx-target 指**带 id 的** #red-drawer-err：htmx 只在目标带 id 时才发 HX-Target 头。
*/-->
<body>
<div th:fragment="drawer" id="red-drawer-panel" class="tag-drawer" th:attr="data-user-id=${r.userId}"
     th:with="canEdit=${#authorization.expression('hasRole(''SUPER_ADMIN'') or hasAuthority(''risk.edit'')')}">

    <!--/* ① 观测量。 */-->
    <section class="card card-full tag-card" data-section="red-overview">
        <h3 th:text="#{admin.v130.redOverage.drawer.overview}">观测</h3>
        <table class="ud-table">
            <tr><th th:text="#{admin.common.userId}">用户 ID</th><td th:text="${r.userId}">0</td></tr>
            <tr><th th:text="#{admin.redOverage.col.redCount}">RED 计数</th><td th:text="${r.redCount}">0</td></tr>
            <tr><th th:text="#{admin.redOverage.col.reviewStatus}">复核态</th>
                <td th:text="${r.reviewStatus == ''} ? #{admin.v130.redOverage.unmarked}
                             : (${r.reviewStatus == 'TO_VERIFY'} ? #{admin.redOverage.status.toVerify}
                                                                : #{admin.redOverage.status.resolved})">未标记</td></tr>
            <tr><th th:text="#{admin.common.note}">备注</th><td th:text="${r.note} ?: '—'">—</td></tr>
        </table>
        <!--/* 🔴 这句不可删：本页不做任何自动处置。不写的话，「待核查」会被读成
               「系统已经把这个人限制住了，等你确认」——实际什么都没发生。 */-->
        <p class="hint"><b th:text="#{admin.redOverage.hint.noAuto}">系统不做任何自动拦截/限流/封禁</b><span
                th:text="#{admin.redOverage.hint.manual}">——是否处置由人工判断。</span></p>
    </section>

    <!--/* ② RED 分诊历史（只读）。 */-->
    <section class="card card-full tag-card" data-section="red-history">
        <h3 th:text="#{admin.v130.redOverage.drawer.history}">红色评级历史</h3>
        <table th:if="${!#lists.isEmpty(history)}" class="ud-table">
            <thead><tr>
                <th th:text="#{admin.v130.redOverage.drawer.taskId}">任务</th>
                <th th:text="#{admin.common.status}">状态</th>
                <th class="nowrap" th:text="#{admin.common.time}">时间</th>
            </tr></thead>
            <tbody>
            <tr th:each="t : ${history}">
                <td class="nowrap muted" th:text="${t.taskId}">0</td>
                <td class="nowrap"><code th:text="${t.status}">DONE</code></td>
                <td class="nowrap" th:text="${@adminTime.wib(t.createdAt)}">t</td>
            </tr>
            </tbody>
        </table>
        <p class="hint" th:if="${#lists.isEmpty(history)}"
           th:text="#{admin.redOverage.empty}">暂无 RED 分诊记录</p>
        <!--/* 🔴 明说「这里不展示症状」：不写的话，运营会以为是数据没查出来，转头去问工程要，
               而工程给不了 —— 这是刻意的边界，不是缺口。 */-->
        <p class="hint" data-notice="red-no-health-data"
           th:text="#{admin.v130.redOverage.drawer.noHealthData}">按健康数据边界，此处不展示症状描述与解析结果。</p>
    </section>

    <!--/* ③ 人工标记。 */-->
    <section class="card card-full tag-card" data-section="red-review">
        <h3 th:text="#{admin.redOverage.btn.mark}">标记</h3>

        <!--/* 🔴 门控用 risk.edit，与端点的 @PreAuthorize(EDIT_AUTH) 逐字一致。
               ⚠️ 整页那版写的是 risk.view —— 典型的「按钮在、点了 403」：
                  只有查看权限的人看得到这张表单，一提交拿到的是 403。 */-->
        <form th:if="${canEdit}"
              th:attr="hx-post=@{/admin/red-overage/{u}/review(u=${r.userId})}"
              hx-target="#red-drawer-err" hx-swap="innerHTML">
            <label class="field">
                <span th:text="#{admin.redOverage.col.reviewStatus}">复核态</span>
                <select name="status" class="sel">
                    <option value="TO_VERIFY" th:selected="${r.reviewStatus == 'TO_VERIFY'}"
                            th:text="#{admin.redOverage.status.toVerify}">待核查</option>
                    <option value="RESOLVED" th:selected="${r.reviewStatus == 'RESOLVED'}"
                            th:text="#{admin.redOverage.status.resolved}">已处理</option>
                </select>
            </label>
            <label class="field field-full">
                <span th:text="#{admin.common.note}">备注</span>
                <input type="text" name="note" class="inp field-full" maxlength="255"
                       th:value="${r.note}"/>
            </label>
            <button type="submit" class="btn btn-neutral btn-sm"
                    th:text="#{admin.redOverage.btn.mark}">标记</button>
        </form>
        <th:block th:unless="${canEdit}">
            <button type="button" class="btn btn-neutral btn-sm" disabled
                    th:title="#{admin.v130.err.forbidden(#{perm.risk.edit})}"
                    th:text="#{admin.redOverage.btn.mark}">标记</button>
            <p class="hint" th:text="#{admin.v130.err.forbidden(#{perm.risk.edit})}">需要「风控处置」权限</p>
        </th:block>

        <div id="red-drawer-err" class="lst-inline-error" aria-live="polite"></div>
    </section>
</div>

<!--/* 标记成功：抽屉体 oob + 列表那一行 oob + 摘要条 oob + toast。
       ⚠️ 不整表重拉：标记不会让行换位置（表按 RED 计数降序）。
       🔴 摘要条的「待核查用户数」会变，所以行 oob 之外**还要**换摘要条。
       🔴 外壳必须是**真的** <table hidden>，不能 th:remove="tag"：响应不以 `<tr` 开头时
          htmx 走通用解析，裸 <tr>/<td> 会被 HTML 解析器丢掉（8.2 踩过）。 */-->
<th:block th:fragment="afterAction">
    <div id="red-drawer-body-oob" hx-swap-oob="innerHTML:#red-drawer .drawer-body">
        <div th:replace="~{admin/fragments/drawer-red-overage :: drawer}"></div>
    </div>
    <table hidden><tbody>
        <tr th:replace="~{admin/fragments/red-overage-list :: row(${row}, true)}"></tr>
    </tbody></table>
    <div th:replace="~{admin/fragments/red-overage-list :: sumbar(true)}"></div>
    <!--/* 🔴 toast 多包一层：htmx 的 `beforeend:` oob 搬的是**子节点**，直接写在 .toast 上
           落进宿主的只有裸文本（无样式、armToast 找不到元素 → 永不消失）。外层这个 div 会被丢掉。 */-->
    <div hx-swap-oob="beforeend:#admin-toast-host">
        <div class="toast" role="status" th:text="${toast}">已标记</div>
    </div>
</th:block>
</body>
</html>
