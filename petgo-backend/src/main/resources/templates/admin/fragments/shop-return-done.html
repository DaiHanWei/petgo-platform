<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  A7 处置成功 fragment（V1.3.0 Story 10.1 AC2，AD-9）：根元素 data-next-id（同页签下一条；空则右栏空态）+ data-done；
  oob：被处理行删除（shop-return-row-<token>）、五页签计数替换、toast 到 #admin-toast-host。
  ⚠️ data-next-id 为空串时 Thymeleaf 会整个去掉该属性，所以 data-done 必须在 —— admin-workbench.js 靠它认清空态。
-->
<body>
<div th:fragment="done" class="sr-done" data-done th:data-next-id="${nextId}">
    <!--/* 🔴 toast 必须**多包一层**：htmx 的 `beforeend:` oob 搬的是这个元素的**子节点**，
           直接把 hx-swap-oob 写在 .toast 上，落进宿主的只有一段裸文本 —— 没有样式、
           admin-core.js 的 armToast 也找不到它，于是永远不消失。外层这个 div 会被丢掉。
           （Story 10.2 复审查出；仓库里二十来处旧写法同病，见 drawer-consult-order.html 的说明。） */-->
    <div hx-swap-oob="beforeend:#admin-toast-host">
        <div class="toast" role="status" th:text="${message}">已处理</div>
    </div>
    <th:block th:if="${#strings.isEmpty(nextId)}"><div th:replace="~{admin/fragments/tpl-a-empty :: queueEmpty('shop-returns', null)}"></div></th:block>
    <li th:id="'shop-return-row-' + ${removedToken}" hx-swap-oob="delete"></li>
    <span th:each="t : ${tabs}" th:id="'shop-return-tab-count-' + ${t}" class="tab-count" hx-swap-oob="true"
          th:text="${counts.get(t)}">0</span>
</div>
</body>
</html>
