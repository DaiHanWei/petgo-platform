<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  A8 左栏队列（V1.3.0 Story 10.1 AC3）。list = 整个 <ul>；rows = 行。
  行两行式：① 订单号 + 状态色点；② 异常摘要（缺货行数）+ 商品数 + 下单时间（WIB）。默认时间升序（先进先出）。
  🔒 本页不渲染收件人 PII（同订单列表口径）。
  ⚠️ **没有翻页哨兵**：候选集是实时计算的（已付款待发货 ∧ 库存不足），一次取 100 条封顶；
     单量低（S-3 明说 SKU ≤ 30、手工处置完全可行），滚动加载在这里只会把"实时"这件事弄复杂。
-->
<body>
<ul th:fragment="list" class="q-list" id="shop-exception-queue">
    <th:block th:replace="~{admin/fragments/shop-exception-queue :: rows}"></th:block>
</ul>

<th:block th:fragment="rows">
    <li th:if="${#lists.isEmpty(orders)}" class="q-empty">
        <div th:replace="~{admin/fragments/tpl-a-empty :: queueEmpty('shop-order-exceptions', null)}"></div>
    </li>
    <th:block th:each="o : ${orders}"><li th:replace="~{admin/fragments/shop-exception-queue :: row(${o})}"></li></th:block>
</th:block>

<ul th:remove="tag">
    <li th:fragment="row(o)" class="q-row"
        th:id="'shop-exception-row-' + ${o.publicToken}" th:data-id="${o.publicToken}"
        th:data-detail-url="@{/admin/shop/order-exceptions(open=${o.publicToken})}"
        th:attr="hx-get=@{/admin/shop/order-exceptions(open=${o.publicToken})}"
        hx-target=".wb-detail-body" hx-swap="innerHTML" tabindex="0">
        <span class="q-title">
            <span class="dot dot--hot"></span>
            <span th:text="${o.publicToken}">ord</span>
        </span>
        <span class="q-meta">
            <span th:text="#{admin.v130.shopExceptions.summary}">库存不足，发不出货</span>
            <span th:text="#{admin.v130.shopExceptions.lines(${#lists.size(linesByToken.get(o.publicToken))})}">N 件商品</span>
            <span th:text="${@adminTime.wib(o.createdAt)}">时间</span>
        </span>
    </li>
</ul>
</body>
</html>
