<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  通用服务端确认弹层（V1.3.4 后台返工清单 §2 · UI 稿 G3 / G4；AB-31 I8 复用输入确认形态）。
  模型：${cm}（com.tailtopia.admin.shared.web.AdminConfirmModal）。宿主：页面上的 <div id="confirm-host">，
  端点以 HX-Retarget #confirm-host + innerHTML 换进来，data-autoopen 由 admin-core.js 在 swap 后 showModal。

  🔴 为什么不是浏览器 confirm()：G4 要「手动输入新版本号才放行」，原生框做不到；G3 要逐字段复述 + 按字段提醒，
     且文案 / 新旧值只有服务端算得准（页面可能已过期）。
  ⚠️ 提交表单的 hx-target 指向弹层内部的 #confirm-modal-err（同 publish-identity-confirm）：422 / 403 回来时弹层不消失、
     原因就写在弹层里。成功路径由端点发 admin:confirm-close 收起弹层，并自己 HX-Retarget 到要刷新的区块。
  🛡 输入确认：确认钮初始 disabled，admin-core.js [data-typed-confirm] 在输入值 === data-expected 时才放开；
     服务端仍按提交上来的 ${cm.typedName} 自己比一次（前端禁用只是体验）。
*/-->
<body>
<dialog th:fragment="modal" class="modal cm-modal" id="confirm-modal" data-autoopen="true"
        th:attr="aria-labelledby='confirm-modal-title'">
    <div class="modal-head">
        <h3 id="confirm-modal-title" th:text="${cm.title}"></h3>
        <button type="button" class="modal-close" data-close-dialog th:attr="aria-label=#{admin.confirm.close}">✕</button>
    </div>
    <form class="cm-form" th:attr="hx-post=@{${cm.actionPath}}" hx-target="#confirm-modal-err" hx-swap="innerHTML">
        <div class="modal-body">
            <div class="cm-banner" role="alert" th:if="${cm.danger != null}" th:classappend="${cm.warnBanner} ? 'cm-banner-warn'" th:text="${cm.danger}"></div>
            <div class="cm-diff" th:unless="${#lists.isEmpty(cm.diffs)}" data-confirm-diff-list>
                <div class="cm-diff-line" th:each="d : ${cm.diffs}"><span th:text="#{admin.confirm.diffLabel(${d.label})}">字段：</span><s th:text="${#strings.isEmpty(d.oldValue)} ? #{admin.confirm.emptyValue} : ${d.oldValue}"></s><span class="cm-arrow" aria-hidden="true">→</span><b th:text="${#strings.isEmpty(d.newValue)} ? #{admin.confirm.emptyValue} : ${d.newValue}"></b></div>
            </div>
            <p class="cm-note" th:if="${cm.note != null}" th:text="${cm.note}"></p>
            <label class="cm-typed" th:if="${cm.typed()}">
                <span class="cm-typed-prompt" th:utext="${cm.typedPromptHtml}"></span>
                <input class="inp cm-typed-input" type="text" autocomplete="off" spellcheck="false" maxlength="40"
                       th:name="${cm.typedName}" autofocus data-typed-confirm th:attr="data-expected=${cm.typedExpected}"/>
            </label>
            <input type="hidden" th:each="h : ${cm.hidden}" th:name="${h.key}" th:value="${h.value}"/>
            <div id="confirm-modal-err" class="lst-inline-error" aria-live="polite"></div>
        </div>
        <div class="modal-foot">
            <button type="button" class="btn btn-neutral cm-cancel" data-close-dialog th:text="#{admin.confirm.cancel}">取消</button>
            <button type="submit" th:class="${cm.dangerButton} ? 'btn btn-danger' : 'btn btn-primary'"
                    th:disabled="${cm.typed()}" th:attr="data-typed-confirm-submit=${cm.typed()} ? 'true' : null"
                    th:text="${cm.confirmLabel}"></button>
        </div>
    </form>
</dialog>
</body>
</html>
