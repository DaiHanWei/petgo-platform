<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  运营弹窗列表片段（V1.3.4 AB-30）。rows — 表格 + 空态；done — 处置成功（整表 oob + toast）。
  列：缩略图 · 名称 · 状态（启用 / 停用）+ 阶段（未开始 / 进行中 / 已结束，由时间窗现算）· 时间窗（WIB）·
      优先级 · 人群 · 频次 · 跳转。
  🔴 阶段与 App 候选过滤同一份判定（ScheduleWindow），只有「启用 + 进行中」的才可能弹出 ——
     两个徽标并排显示，运营才分得清「我启用了为什么没弹」是没到时间还是已过期。
-->
<body>
<th:block th:fragment="rows">
    <table th:if="${!#lists.isEmpty(popups)}" class="opsp-table">
        <thead><tr>
            <th th:text="#{admin.opsPopups.col.image}">图片</th>
            <th th:text="#{admin.opsPopups.col.name}">名称</th>
            <th th:text="#{admin.opsPopups.col.status}">状态</th>
            <th th:text="#{admin.opsPopups.col.window}">时间窗（WIB）</th>
            <th class="s-col-num" th:text="#{admin.opsPopups.col.priority}">优先级</th>
            <th th:text="#{admin.opsPopups.col.audience}">人群</th>
            <th th:text="#{admin.opsPopups.col.frequency}">频次</th>
            <th th:text="#{admin.opsPopups.col.target}">跳转</th>
            <th class="s-col-act" th:text="#{admin.common.actions}">操作</th>
        </tr></thead>
        <tbody>
        <tr th:each="p : ${popups}" th:id="'ops-popup-row-' + ${p.token}">
            <td>
                <!-- 与 App 同一套换算；拼不出 URL（CDN 未配）显示提示而不是裂图 -->
                <img th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" alt="" class="opsp-thumb"/>
                <span th:if="${p.imageUrl == null}" class="err" th:text="#{admin.opsPopups.urlUnresolved}">图片地址拼不出来</span>
                <div th:if="${p.hasEnImage}" class="muted opsp-sub" th:text="#{admin.opsPopups.hasEnImage}">另有英文图</div>
            </td>
            <td th:text="${p.name}">双十一大促</td>
            <td>
                <span class="badge" th:classappend="${p.active} ? 'badge-ok' : 'badge-muted'"
                      th:text="${p.active} ? #{admin.opsPopups.status.ACTIVE} : #{admin.opsPopups.status.DISABLED}">停用</span>
                <span class="badge" th:classappend="${p.phase == 'ACTIVE'} ? 'badge-info'
                         : (${p.phase == 'PENDING'} ? 'badge-warn' : 'badge-neutral')"
                      th:text="#{'admin.opsPopups.phase.' + ${p.phase}}">进行中</span>
            </td>
            <td class="opsp-window">
                <span th:text="${@adminTime.fmt(p.startsAt)}">2026-11-01 00:00</span>
                <span class="muted">→</span>
                <span th:if="${p.endsAt != null}" th:text="${@adminTime.fmt(p.endsAt)}">2026-11-12 00:00</span>
                <span th:if="${p.endsAt == null}" class="muted" th:text="#{admin.opsPopups.noEnd}">长期有效</span>
            </td>
            <td class="s-col-num" th:text="${p.priority}">0</td>
            <td>
                <span th:text="#{'admin.opsPopups.audience.' + ${p.audience}}">全部用户</span>
                <div th:if="${p.audience != 'ALL'}" class="muted opsp-sub"
                     th:text="#{admin.opsPopups.newUserDaysShort(${p.newUserDays})}">分界 7 天</div>
            </td>
            <td th:text="#{'admin.opsPopups.frequency.' + ${p.frequency}}">每人一次</td>
            <td th:insert="~{admin/fragments/ops-target-fields :: summary(${p.targetType}, ${p.targetValue})}"></td>
            <td class="s-col-act">
                <!-- 只读账号也能点开看详情（抽屉里全部禁用、无保存钮）；写操作按钮只给 config.edit -->
                <button type="button" class="btn btn-sm btn-neutral" data-drawer-res="ops-popup"
                        th:attr="data-drawer-open=@{/admin/ops-popups(open=${p.token})}"
                        th:text="${canEdit} ? #{admin.opsPopups.btn.edit} : #{admin.opsPopups.btn.view}">编辑</button>
                <form class="inline" th:if="${canEdit and !p.active}"
                      th:attr="hx-post=@{/admin/ops-popups/{t}/activate(t=${p.token})}"
                      hx-target="#ops-popup-row-error" hx-swap="innerHTML">
                    <button class="btn btn-sm btn-primary" type="submit"
                            th:text="#{admin.opsPopups.btn.activate}">启用</button>
                </form>
                <form class="inline" th:if="${canEdit and p.active}"
                      th:attr="hx-post=@{/admin/ops-popups/{t}/deactivate(t=${p.token})},data-confirm=#{admin.opsPopups.confirmDeactivate}"
                      hx-target="#ops-popup-row-error" hx-swap="innerHTML">
                    <button class="btn btn-sm btn-neutral" type="submit"
                            th:text="#{admin.opsPopups.btn.deactivate}">停用</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(popups)}">
        <span class="empty-emoji">🪧</span>
        <p th:text="#{admin.opsPopups.empty}">还没有配置任何运营弹窗。</p>
    </div>
</th:block>

<!--
  处置成功。列表走 oob：抽屉表单的 hx-target 是抽屉里的错误槽，行按钮的 hx-target 是列表上方的 #ops-popup-row-error，
  主 swap 都落不到表格上 —— 列表一律由下面这段 oob 换掉。整表重拉：改优先级会改变行序。
  主 swap 内容为空：行按钮成功时顺带清掉上次的行内报错；🔴 行按钮不指向抽屉体 —— 那会清掉运营正在另一条上编辑的抽屉。
-->
<th:block th:fragment="done">
    <!--/* toast 必须多包一层：`beforeend:` oob 搬的是子节点。 */-->
    <div hx-swap-oob="beforeend:#admin-toast-host">
        <div class="toast" role="status" th:text="${message}">已保存</div>
    </div>
    <div id="ops-popup-rows" hx-swap-oob="true">
        <div th:replace="~{admin/fragments/ops-popups-list :: rows}"></div>
    </div>
</th:block>
</body>
</html>
