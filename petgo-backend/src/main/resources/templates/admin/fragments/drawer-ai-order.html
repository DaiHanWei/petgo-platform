<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  B11 AI 订单抽屉（V1.3.0 Story 8.4 · AC4，480px 抽屉体 res=ai-order，UI 稿 4-2）。
  整页 ai-order-detail.html 的九行原样平移。
  🔴 **全只读，一个操作按钮都没有**：AI 是一次性解锁，无退款 / 分成 / 待核查入口。
     那句提示不可删 —— 运营在订单抽屉里找退款是最自然的反应。
*/-->
<body>
<div th:fragment="drawer" id="ai-order-drawer-panel" class="tag-drawer"
     th:attr="data-order-token=${order.orderToken}">
    <section class="card card-full tag-card" data-section="ai-order-snapshot">
        <table class="ud-table">
            <tr><th th:text="#{admin.common.orderNo}">订单号</th><td class="nowrap" th:text="${order.orderToken}">tok</td></tr>
            <tr><th th:text="#{admin.common.userId}">用户 ID</th><td th:text="${order.userId}">0</td></tr>
            <tr><th th:text="#{admin.aiOrderDetail.triageTaskId}">分诊任务 ID</th><td th:text="${order.triageTaskId}">0</td></tr>
            <tr><th th:text="#{admin.common.amount}">金额</th><td th:text="${#numbers.formatInteger(order.amount, 1, 'COMMA')}">0</td></tr>
            <tr><th th:text="#{admin.common.channel}">渠道</th><td><code th:text="${order.payChannel}">QRIS</code></td></tr>
            <tr><th th:text="#{admin.aiOrderDetail.paymentIntent}">支付意图</th>
                <td class="nowrap" th:text="${order.paymentIntentToken} ?: '—'">—</td></tr>
            <tr><th th:text="#{admin.common.status}">状态</th><td><code th:text="${order.status}">COMPLETED</code></td></tr>
            <tr><th th:text="#{admin.common.paidAt}">成交时间</th><td class="nowrap" th:text="${@adminTime.wib(order.paidAt)}">—</td></tr>
            <tr><th th:text="#{admin.common.createdAt}">创建时间</th><td class="nowrap" th:text="${@adminTime.wib(order.createdAt)}">t</td></tr>
        </table>
        <p class="hint" data-notice="ai-no-refund" th:text="#{admin.aiOrderDetail.hint.noRefund}">
            AI 一次性解锁，无退款/分成入口。</p>
    </section>
</div>
</body>
</html>
