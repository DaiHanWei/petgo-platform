<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  运营位「跳转目标」表单块（V1.3.4 AB-30 运营弹窗 / AB-31 运营通知共用）。
  五种类型 NONE / PRODUCT / CATEGORY / APP_PAGE / EXTERNAL，与 OpsTargetPolicy 同一套；服务端校验在 AdminOpsTargetValidator。
  用法：th:replace="~{admin/fragments/ops-target-fields :: fields('f-opsp')}"（参数 = 元素 id 前缀，一页内不撞号）。
  需要宿主 model：form（含 targetType / targetValue）、targetTypes、categories（ProductCategory）、appPages（OpsAppPage）。
  🔴 切换类型只是显隐（data-show-when，admin-core.js）：隐藏的那几格同时 disabled 不提交，
     所以「NONE」时根本没有 targetValue 字段，四个同名 targetValue 也只有可见的那一个生效。
  🔴 CATEGORY / APP_PAGE 只给下拉不让手填：值必须是枚举名，手填大小写一错就永远跳不过去。
  文案键沿用 AB-30 落地时的 admin.opsPopups.*（两页同一套说法）。
-->
<body>
<th:block th:fragment="fields(idp)">
    <div class="s-form-row">
        <label class="s-label s-req" th:for="${idp + '-ttype'}" th:text="#{admin.opsPopups.form.targetType}">跳转类型</label>
        <div class="s-ctl">
            <select th:id="${idp + '-ttype'}" class="inp" name="targetType" data-show-switch>
                <option th:each="t : ${targetTypes}" th:value="${t}"
                        th:selected="${form.targetType == t.name()}"
                        th:text="#{'admin.opsPopups.targetType.' + ${t}}">不跳转</option>
            </select>
        </div>
    </div>
    <div class="s-form-row" data-show-when="targetType:PRODUCT" th:hidden="${form.targetType != 'PRODUCT'}">
        <label class="s-label s-req" th:for="${idp + '-tproduct'}" th:text="#{admin.opsPopups.form.targetProduct}">商品 token</label>
        <div class="s-ctl">
            <input th:id="${idp + '-tproduct'}" type="text" class="inp" name="targetValue" maxlength="32"
                   th:value="${form.targetType == 'PRODUCT'} ? ${form.targetValue} : ''"
                   th:disabled="${form.targetType != 'PRODUCT'}"/>
            <p class="hint" th:text="#{admin.opsPopups.form.targetProductHint}">填商品的 token；商品须存在且在售。</p>
        </div>
    </div>
    <div class="s-form-row" data-show-when="targetType:CATEGORY" th:hidden="${form.targetType != 'CATEGORY'}">
        <label class="s-label s-req" th:for="${idp + '-tcat'}" th:text="#{admin.opsPopups.form.targetCategory}">商品分类</label>
        <div class="s-ctl">
            <select th:id="${idp + '-tcat'}" class="inp" name="targetValue" th:disabled="${form.targetType != 'CATEGORY'}">
                <option th:each="c : ${categories}" th:value="${c}"
                        th:selected="${form.targetType == 'CATEGORY' and form.targetValue == c.name()}"
                        th:text="#{'admin.v130.shopProducts.category.' + ${c}}">主粮</option>
            </select>
        </div>
    </div>
    <div class="s-form-row" data-show-when="targetType:APP_PAGE" th:hidden="${form.targetType != 'APP_PAGE'}">
        <label class="s-label s-req" th:for="${idp + '-tpage'}" th:text="#{admin.opsPopups.form.targetAppPage}">App 页面</label>
        <div class="s-ctl">
            <select th:id="${idp + '-tpage'}" class="inp" name="targetValue" th:disabled="${form.targetType != 'APP_PAGE'}">
                <option th:each="g : ${appPages}" th:value="${g}"
                        th:selected="${form.targetType == 'APP_PAGE' and form.targetValue == g.name()}"
                        th:text="#{'admin.opsPopups.appPage.' + ${g}}">首页</option>
            </select>
        </div>
    </div>
    <div class="s-form-row" data-show-when="targetType:EXTERNAL" th:hidden="${form.targetType != 'EXTERNAL'}">
        <label class="s-label s-req" th:for="${idp + '-text'}" th:text="#{admin.opsPopups.form.targetExternal}">外部链接</label>
        <div class="s-ctl">
            <input th:id="${idp + '-text'}" type="url" class="inp" name="targetValue" maxlength="512" placeholder="https://"
                   th:value="${form.targetType == 'EXTERNAL'} ? ${form.targetValue} : ''"
                   th:disabled="${form.targetType != 'EXTERNAL'}"/>
        </div>
    </div>
</th:block>

<!--/* 只读展示：类型 + 值（列表单元格 / 只读详情共用）。t = 类型名字符串，v = 值。 */-->
<th:block th:fragment="summary(t, v)">
    <span th:text="#{'admin.opsPopups.targetType.' + ${t}}">不跳转</span>
    <div th:switch="${t}" class="opsp-sub">
        <span th:case="'CATEGORY'" th:text="#{'admin.v130.shopProducts.category.' + ${v}}">主粮</span>
        <span th:case="'APP_PAGE'" th:text="#{'admin.opsPopups.appPage.' + ${v}}">首页</span>
        <span th:case="'PRODUCT'" class="s-mono" th:text="${v}">token</span>
        <span th:case="'EXTERNAL'" class="s-mono opsp-url" th:text="${v}" th:title="${v}">https://</span>
    </div>
</th:block>
</body>
</html>
