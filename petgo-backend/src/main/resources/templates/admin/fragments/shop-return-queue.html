<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  A7 左栏队列（V1.3.0 Story 10.1 AC1）。list = 整个 <ul>；rows = 行 + 翻页哨兵。
  行两行式：① 申请编号 + 退货类型标签 + 状态色点；② 订单号 + 行数（整单退标记）+ 申请时间（WIB）。
  默认时间升序（先进先出），每页 20 滚动加载。🔒 队列不渲染收件人 PII（沿用列表页口径）。
  状态色点语义（story Dev Notes）：🔵 待审核 / 质检中 · 🟡 待寄回 / 退款中（等外部）· 🔴 退款失败 · ⚪ 终态。
  ⚠️ 翻页哨兵打回 GET /admin/shop/returns（带 HX-Request 返本片段的 rows）——**不新开 /queue 端点**（AB-19A）。
-->
<body>
<ul th:fragment="list" class="q-list" id="shop-return-queue" th:attr="data-tab=${tab}">
    <th:block th:replace="~{admin/fragments/shop-return-queue :: rows}"></th:block>
</ul>

<th:block th:fragment="rows">
    <li th:if="${queue.isEmpty() and page == 0}" class="q-empty">
        <div th:replace="~{admin/fragments/tpl-a-empty :: queueEmpty('shop-returns', ${tab == 'closed'} ? #{admin.v130.shopReturns.empty.closed} : null)}"></div>
    </li>
    <th:block th:each="r : ${queue.content}"><li th:replace="~{admin/fragments/shop-return-queue :: row(${r})}"></li></th:block>
    <li th:if="${queue.hasNext()}" class="q-more" hx-swap="outerHTML" hx-trigger="revealed"
        th:attr="hx-get=@{/admin/shop/returns(tab=${tab},type=${type},full=${full},page=${page + 1})}">
        <span class="muted" th:text="#{admin.v130.review.more}">加载更多…</span>
    </li>
</th:block>

<ul th:remove="tag">
    <li th:fragment="row(r)" class="q-row"
        th:id="'shop-return-row-' + ${r.publicToken}" th:data-id="${r.publicToken}"
        th:data-detail-url="@{/admin/shop/returns/{t}(t=${r.publicToken},type=${type},full=${full})}"
        th:attr="hx-get=@{/admin/shop/returns/{t}(t=${r.publicToken},type=${type},full=${full})}"
        hx-target=".wb-detail-body" hx-swap="innerHTML" tabindex="0">
        <span class="q-title">
            <!-- 状态色点：🔴 退款失败 · 🟡 待寄回 / 退款中（等外部）· 🔵 待审核 / 质检中 · ⚪ 终态。
                 ⚠️ 刻意不放在 fragment 根元素的 th:with 上：那一层能不能看见 fragment 形参（r）
                    取决于 Thymeleaf 的属性优先级，踩错就是整页 500，而这一条走的是子元素、必然拿得到。 -->
            <span class="dot" th:classappend="${r.status.name() == 'REFUND_FAILED'} ? 'dot--hot'
                     : (${r.status.name() == 'AWAIT_SHIPBACK' or r.status.name() == 'REFUNDING'} ? 'dot--wait'
                     : (${r.status.name() == 'PENDING_REVIEW' or r.status.name() == 'INSPECTING'} ? 'dot--todo' : 'dot--done'))"></span>
            <span th:text="${r.publicToken}">tok</span>
            <span class="badge badge-neutral" th:text="#{'admin.v130.shopReturns.type.' + ${r.returnType}}">类型</span>
        </span>
        <span class="q-meta">
            <span th:text="${orderTokens.get(r.publicToken)} ?: '—'">ord</span>
            <!-- lineCounts 对队列里的每一行都必有值（populateQueue 逐行放），所以参数里不再套 ?:
                 —— 在 #{key(...)} 的参数位置里嵌 elvis 是容易踩解析坑的写法，而这里根本用不着。 -->
            <span th:text="#{admin.v130.shopReturns.lines(${lineCounts.get(r.publicToken)})}">N 行</span>
            <span class="badge badge-warn" th:if="${r.fullReturn}" th:text="#{admin.v130.shopReturns.fullReturn}">整单退</span>
            <span th:text="${@adminTime.wib(r.createdAt)}">时间</span>
        </span>
    </li>
</ul>
</body>
</html>
