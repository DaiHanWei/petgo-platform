<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  模板 A · 统一复核工作台壳（V1.3.0 Story 2.3b，AD-11；首个消费者 Story 2.4 A1）。
  槽位契约 workbench(tabsSlot, filtersSlot, queueSlot, detailSlot, actionsSlot)（形参带 Slot 后缀：Thymeleaf fragment 形参是局部变量、
  会遮蔽页面 model 里同名的 tabs / filters / queue 属性——Story 2.4 复审实际踩过，整页渲染 500）：
    tabs    — 页签行（.tabs > .tab[.tab--on] + 紫计数 .tab-count）
    filters — 筛选行（form[data-autosubmit]）
    queue   — 左栏队列 <ul class="q-list">，每行 <li class="q-row" data-id data-detail-url hx-get hx-target=".wb-detail-body">
    detail  — 右栏详情体（初始可为空态）
    actions — 右栏底部处置按钮组（hx-post + hx-indicator；成功响应根元素带 data-next-id 触发自动下一条）
  行为：左栏固定 360px / 右栏 min-width 720px；<1024px 切两屏（.wb--narrow + data-pane 切换，admin-workbench.js）；
  队列空态默认「队列已清空 🎉」（admin.v130.empty.queue）；**无键盘 ↑/↓**（D-14）。
  调用方 th:replace="~{admin/fragments/tpl-a-workbench :: workbench(~{::tabs}, ~{::filters}, ~{::queue}, ~{::detail}, ~{::actions})}"
-->
<body>
<div class="wb" th:fragment="workbench(tabsSlot, filtersSlot, queueSlot, detailSlot, actionsSlot)" data-workbench>
    <div class="wb-head">
        <div class="wb-tabs" th:replace="${tabsSlot} ?: ~{}"></div>
        <div class="wb-filters" th:replace="${filtersSlot} ?: ~{}"></div>
    </div>
    <div class="wb-body">
        <section class="wb-queue" data-pane="queue">
            <div class="wb-queue-body">
                <div th:replace="${queueSlot} ?: ~{admin/fragments/tpl-a-workbench :: queue-empty}"></div>
            </div>
        </section>
        <section class="wb-detail" data-pane="detail">
            <div class="wb-detail-body" id="wb-detail-body">
                <div th:replace="${detailSlot} ?: ~{admin/fragments/tpl-a-workbench :: detail-empty}"></div>
            </div>
            <div class="wb-actions" id="wb-actions">
                <div th:replace="${actionsSlot} ?: ~{}"></div>
            </div>
        </section>
    </div>
    <p id="admin-inline-error" class="wb-inline-error" aria-live="polite"></p>
</div>

<!-- 空态三件套（UI 稿 9-5）：队列真空态 / 详情未选中 / 搜索无结果 -->
<div th:fragment="queue-empty" class="empty empty--queue"><span class="empty-emoji">🎉</span>
    <p th:text="#{admin.v130.empty.queue}">队列已清空</p></div>
<div th:fragment="detail-empty" class="empty empty--detail"><span class="empty-emoji">👈</span>
    <p th:text="#{admin.v130.empty.detail}">从左侧队列选一条开始处理</p></div>
<div th:fragment="search-empty" class="empty empty--search"><span class="empty-emoji">🔍</span>
    <p th:text="#{admin.v130.empty.search}">没有匹配的结果，试试放宽筛选</p></div>
</body>
</html>
