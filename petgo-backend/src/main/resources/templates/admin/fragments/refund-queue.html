<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  A6 左栏队列（V1.3.0 Story 2.8 AC1）。list = 整个 <ul>；rows = 行 + 翻页哨兵。
  行两行式：① 退款单号 + 渠道标签 + 状态点；② 金额 / 净额 + 当前段 + 时间（WIB）。判定 / 审批 / 打款段先进先出。
-->
<body>
<ul th:fragment="list" class="q-list" id="refund-queue" th:attr="data-stage=${stage}">
    <th:block th:replace="~{admin/fragments/refund-queue :: rows}"></th:block>
</ul>

<th:block th:fragment="rows">
    <li th:if="${queue.isEmpty() and page == 0}" class="q-empty">
        <div class="empty empty--queue"><span class="empty-emoji">🎉</span>
            <p th:text="${stage == 'closed'} ? #{admin.v130.refunds.empty.closed} : #{admin.v130.empty.queue}">队列已清空</p>
        </div>
    </li>
    <th:block th:each="r : ${queue.content}"><li th:replace="~{admin/fragments/refund-queue :: row(${r}, false)}"></li></th:block>
    <li th:if="${queue.hasNext()}" class="q-more" hx-swap="outerHTML" hx-trigger="revealed"
        th:attr="hx-get=@{/admin/refunds/queue(stage=${stage},page=${page + 1})}">
        <span class="muted" th:text="#{admin.v130.review.more}">加载更多…</span>
    </li>
</th:block>

<ul th:remove="tag">
    <li th:fragment="row(r, oob)" class="q-row" th:hx-swap-oob="${oob} ? 'true' : null"
        th:id="'refund-row-' + ${r.refundToken}" th:data-id="${r.refundToken}"
        th:data-detail-url="@{/admin/refunds/{t}/detail(t=${r.refundToken})}"
        th:attr="hx-get=@{/admin/refunds/{t}/detail(t=${r.refundToken})}"
        hx-target=".wb-detail-body" hx-swap="innerHTML" tabindex="0">
        <span class="q-title">
            <span class="dot" th:classappend="${r.terminal()} ? (${r.rejected()} ? 'dot--hot' : 'dot--done') : 'dot--todo'"></span>
            <span th:text="${r.refundToken}">tok</span>
            <span class="badge badge-neutral" th:if="${r.payChannel != null}" th:text="${r.payChannel}">QRIS</span>
        </span>
        <span class="q-meta">
            <span th:text="${#numbers.formatInteger(r.orderAmount, 0, 'COMMA')} + ' / ' + (${r.payoutFilled()} ? ${#numbers.formatInteger(r.netAmount, 0, 'COMMA')} : '—')">0 / —</span>
            <span class="badge" th:classappend="${r.rejected()} ? 'badge-danger' : (${r.terminal()} ? 'badge-ok' : 'badge-warn')"
                  th:text="${r.rejected()} ? #{admin.v130.refunds.rejected} : #{'admin.v130.refunds.stage.' + ${r.stage}}">段</span>
            <span th:text="${@adminTime.wib(r.createdAt)}">时间</span>
        </span>
    </li>
</ul>
</body>
</html>
