<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  顶置管理（V1.1.6 Story 11.1 · AB-10A → V1.3.0 Story 7.3 套模板 B · tpl-b-list，UI 稿 2-11～2-13）。
  本页是「已交付机制的开关」：排期写入、同坑位重叠校验、生效判定、下架联动都在 Story 4.1 随 ContentPinService 落地。
  筛选（坑位 + 状态）→ 摘要条三格 → 表格（生效时间倒序、每页 20）→ 分页；点行开 480px 抽屉；
  「＋新建顶置」右上按钮 → 同一抽屉装新建表单（原先常驻页尾的那份，字段与端点参数逐字不变）。
  🛡 坑位按「一个下拉」渲染：表里 slot 是普通列、无 CHECK 约束，将来新增坑位只多一个取值。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.pins.title}">顶置管理 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='pin'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.pins.title}">顶置管理</h1>
            <button type="button" class="btn btn-primary btn-sm"
                    th:attr="data-drawer-open=@{/admin/content-pins/new/drawer(slot=${slot})},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    data-drawer-res="pin"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('content.pin_manage')"
                    th:text="#{admin.pins.new}">＋ 新建顶置</button>
        </div>
        <p class="muted" th:text="#{admin.pins.subtitle}">配置首页 Feed 坑位。时间一律按 WIB 解释。</p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::pin-filters}, ~{::pin-summary}, ~{::pin-table}, ~{::pin-drawer})}">
            <form th:fragment="pin-filters" class="filter-bar" data-autosubmit th:action="@{/admin/content-pins}" method="get"
                  th:attr="hx-get=@{/admin/content-pins}" hx-target="#pins-rows" hx-swap="innerHTML" hx-push-url="true">
                <!--/* 抽屉内新建 / 改时间 / 提前结束成功 → HX-Trigger admin:pin-list-refresh：
                       按当前筛选 + 当前页重拉表格与摘要条（新建的行只能靠整表重拉才会出现） */-->
                <span hidden data-pin-refresh th:attr="hx-get=@{/admin/content-pins}" hx-include="closest form"
                      hx-trigger="admin:pin-list-refresh from:body" hx-target="#pins-rows" hx-swap="innerHTML"
                      hx-vals="js:{page: (document.querySelector('#pins-rows .pager') || {}).getAttribute ? (document.querySelector('#pins-rows .pager').getAttribute('data-page') || 0) : 0}"></span>
                <label class="field">
                    <span th:text="#{admin.pins.slot}">坑位</span>
                    <select name="slot" class="sel">
                        <option th:each="s : ${slots}" th:value="${s}" th:text="${s}" th:selected="${s == slot}">HOME_FEED</option>
                    </select>
                </label>
                <label class="field">
                    <span th:text="#{admin.pins.phase}">状态</span>
                    <select name="status" class="sel">
                        <option value="" th:selected="${status == null or status.isEmpty()}" th:text="#{admin.v130.pins.filter.status.all}">全部状态</option>
                        <option th:each="p : ${phases}" th:value="${p}" th:selected="${status == p}"
                                th:text="${p == 'ACTIVE'} ? #{admin.pins.phase.active} : (${p == 'PENDING'} ? #{admin.pins.phase.pending} : #{admin.pins.phase.ended})">生效中</option>
                    </select>
                </label>
            </form>

            <div th:fragment="pin-summary" th:replace="~{admin/fragments/pins-list :: sumbar(false)}"></div>

            <div th:fragment="pin-table" id="pins-rows">
                <div th:replace="~{admin/fragments/pins-list :: rows(false)}"></div>
            </div>

            <div th:fragment="pin-drawer" class="drawer-title" th:text="#{admin.v130.pins.drawer.title}">顶置详情</div>
        </div>

        <!--/* ?open=<id> 跨页深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL（与 B1 / B2 同一机制） */-->
        <span hidden th:if="${open != null}" data-drawer-res="pin"
              th:attr="data-drawer-deeplink=@{/admin/content-pins/{id}/drawer(id=${open})}"></span>
    </div>

    <!--/* 内容候选（HTMX 局部，GET /admin/content-pins/pick 的返回体）。分页：候选集接近全量内容，不可平铺。
           🔴 2026-09-02：必须留在 content 片段**之外**（外层 th:replace 之内）——
           定义在 content 里的话，整页渲染时片段本体会在页面底部再游离渲染一遍。 */-->
    <div th:fragment="candidates" th:remove="tag">
        <p class="muted" th:if="${#lists.isEmpty(candidates)}" th:text="#{admin.pins.pickEmpty}">没有可顶置的公开内容。</p>
        <label th:each="c : ${candidates}" class="pick-row">
            <input type="radio" name="contentId" th:value="${c.id}"/>
            <span th:text="${c.id}">1</span>
            <span th:text="#{'admin.contentType.' + ${c.type}}">Moment</span>
            <span th:text="${c.summary}">摘要</span>
            <span class="muted" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd', 'Asia/Jakarta')}">日期</span>
        </label>
    </div>
</div>
</body>
</html>
