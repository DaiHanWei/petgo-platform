<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  礼物目录（V1.4.0 ③ gift Story 3.1 · AB-35，UI 稿 L1 ~ L7；⚙️ 配置与安全组）。页面形态照「用户标签」页（模板 B）：
  标题行（+「新建礼物」）→ 说明 → 送礼 QRIS 最低金额配置行 → 摘要条三格 → 筛选栏 → 表格；点行开 480 抽屉，行内无按钮。
  🔴 只下线不物理删除：没有删除按钮、没有删除端点（AD-1）。
  🔴 改价 / 改名 / 换图 / 下线都不碰订单与礼物墙（下单快照，AD-2 / AD-3）。
  ⚠️ 下线用浏览器原生 confirm（抽屉底部 data-confirm）；QRIS 最低金额用服务端确认弹层（#confirm-host，decision-log ③）。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.v140.gift.title}">礼物目录</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag" th:with="res='gift'">
        <div class="wb-title-row">
            <h1 th:text="#{admin.v140.gift.title}">礼物目录</h1>
            <!--/* 只读用户不渲染（L7，用户标签现状）；sec:authorize 与 Controller EDIT_AUTH 逐字一致。
                   V1.5.0 gift-pack Story 1-2：主按钮随页签切换「新建礼物 / 新建分类」（data-gtab-show，下方脚本切 hidden）。 */-->
            <button type="button" class="btn btn-primary btn-sm" data-gtab-show="gift" th:hidden="${tab != 'gift'}"
                    th:attr="data-drawer-open=@{/admin/gift-catalog/new/drawer},data-drawer-autoopen=${openCreate} ? 'true' : null"
                    data-drawer-res="gift"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('gift.catalog_edit')"
                    th:text="#{admin.v140.gift.new}">＋ 新建礼物</button>
            <button type="button" class="btn btn-primary btn-sm" data-gtab-show="category" th:hidden="${tab != 'category'}"
                    th:attr="data-drawer-open=@{/admin/gift-catalog/categories/new/drawer}"
                    data-drawer-res="giftcat"
                    sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('gift.catalog_edit')"
                    th:text="#{admin.v150.giftCategory.new}">新建分类</button>
        </div>
        <p class="muted" th:text="#{admin.v140.gift.subtitle}">App 送礼面板里的礼物。</p>

        <!--/* V1.5.0 gift-pack Story 1-2：页签「礼物 / 分类」（照 growth.html 的 .tabs / tab--on / data-gtab，纯前端切换） */-->
        <div class="tabs" role="tablist" data-gift-tabs>
            <button type="button" class="tab" role="tab" data-gtab="gift" th:classappend="${tab == 'gift'} ? 'tab--on'"
                    th:attr="aria-selected=${tab == 'gift'}" th:text="#{admin.v150.giftCategory.tab.gifts}">礼物</button>
            <button type="button" class="tab" role="tab" data-gtab="category" th:classappend="${tab == 'category'} ? 'tab--on'"
                    th:attr="aria-selected=${tab == 'category'}" th:text="#{admin.v150.giftCategory.tab.categories}">分类</button>
        </div>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <!--/* 页面级遮罩放在两个页签 section 之前：admin-drawer.js 只取第一个 [data-drawer-mask]，
               不能落在被 hidden 的 section 里（code review #4）。 */-->
        <div class="drawer-mask" hidden data-drawer-mask></div>

        <section data-gtab-panel="gift" th:hidden="${tab != 'gift'}">

        <!--/* 送礼 QRIS 最低金额配置行（AC8 / UI L1 · L6）：「修改」行内展开 → 服务端确认弹层 */-->
        <div th:replace="~{admin/fragments/gift-qris-line :: line}"></div>

        <!--/* UI L1 顺序：配置行 → 摘要条三格 → 筛选 → 表格。摘要条放在模板 B 外面（模板 B 的槽位是筛选在前），
               id=gift-summary 不变，列表刷新的 oob 照样命中。 */-->
        <div th:replace="~{admin/fragments/gift-catalog-list :: sumbar(false)}"></div>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::gift-filters}, ~{}, ~{::gift-table}, ~{::gift-drawer})}">
            <form th:fragment="gift-filters" class="filter-bar gift-fbar" data-autosubmit th:action="@{/admin/gift-catalog}" method="get"
                  th:attr="hx-get=@{/admin/gift-catalog}" hx-target="#gift-rows" hx-swap="innerHTML" hx-push-url="true">
                <!--/* 抽屉内新建 / 编辑 / 上下线成功 → HX-Trigger admin:gift-catalog-list-refresh：
                       🔴 必须 hx-include 筛选表单（closest form），否则刷新会丢筛选（用户标签页没有筛选，不能照抄静态 URL）。 */-->
                <span hidden data-gift-refresh th:attr="hx-get=@{/admin/gift-catalog}" hx-include="closest form"
                      hx-trigger="admin:gift-catalog-list-refresh from:body" hx-target="#gift-rows" hx-swap="innerHTML"></span>
                <!--/* V1.5.0 gift-pack Story 1-2：筛选栏最前「全部分类」（列全部分类含已下线），参数 category */-->
                <select name="category" class="sel" th:attr="aria-label=#{admin.v150.giftCategory.field}">
                    <option value="" th:selected="${fCategory == null}" th:text="#{admin.v150.giftCategory.filter.all}">全部分类</option>
                    <option th:each="c : ${allCategories}" th:value="${c.id}" th:selected="${fCategory == c.id}"
                            th:text="${c.nameEn} + ' / ' + ${c.nameId}">Snacks / Camilan</option>
                </select>
                <!--/* UI L1：筛选为不带标签的下拉（.fbar）；首项「全部××」+ aria-label 承担字段名。 */-->
                <select name="price" class="sel" th:attr="aria-label=#{admin.v140.gift.col.price}">
                    <option value="" th:selected="${fPrice == null}" th:text="#{admin.v140.gift.filter.allPrices}">全部价格</option>
                    <option th:each="p : ${priceOptions}" th:value="${p}" th:selected="${fPrice == p}"
                            th:text="'Rp' + ${#numbers.formatInteger(p, 1, 'COMMA')}">Rp1,000</option>
                </select>
                <select name="kind" class="sel" th:attr="aria-label=#{admin.v140.gift.col.kind}">
                    <option value="" th:selected="${fKind == null}" th:text="#{admin.v140.gift.filter.allKinds}">全部类型</option>
                    <option th:each="k : ${kinds}" th:value="${k}" th:selected="${fKind == k}"
                            th:text="#{'admin.v140.gift.kind.' + ${k}}">普通</option>
                </select>
                <select name="status" class="sel" th:attr="aria-label=#{admin.v140.gift.col.status}">
                    <option value="" th:selected="${fStatus == null}" th:text="#{admin.v140.gift.filter.allStatuses}">全部状态</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:selected="${fStatus == s}"
                            th:text="#{'admin.v140.gift.status.' + ${s}}">在线</option>
                </select>
            </form>

            <div th:fragment="gift-table" id="gift-rows">
                <div th:replace="~{admin/fragments/gift-catalog-list :: rows(false)}"></div>
            </div>

            <div th:fragment="gift-drawer" class="drawer-title" th:text="#{admin.v140.gift.drawer.detailTitle}">礼物详情</div>
        </div>
        </section>

        <!--/* V1.5.0 gift-pack Story 1-2 · K1 / K2：分类页签（说明 → 表格；点行开 480 抽屉 res=giftcat，行内无按钮） */-->
        <section data-gtab-panel="category" th:hidden="${tab != 'category'}" th:with="res='giftcat'">
            <p class="muted" th:text="#{admin.v150.giftCategory.intro}">决定 App 送礼面板里普通礼物怎么分组……</p>
            <!--/* 不再套第二个 tpl-b-list（会重复 #admin-inline-error、多一个遮罩）：自建 [data-list] 容器 + tpl-shared 抽屉壳
                   （行点击按 closest [data-list] 找本区 .drawer → res=giftcat）。 */-->
            <div class="lst" data-list>
                <div class="lst-table">
                    <div id="gift-category-rows" th:attr="hx-get=@{/admin/gift-catalog/categories/fragment}"
                         hx-trigger="admin:gift-category-list-refresh from:body" hx-swap="innerHTML">
                        <div th:replace="~{admin/fragments/gift-category-list :: rows}"></div>
                    </div>
                </div>
                <th:block th:replace="~{admin/fragments/tpl-shared :: drawer('giftcat', ~{::giftcat-drawer})}">
                    <div th:fragment="giftcat-drawer" class="drawer-title" th:text="#{admin.v150.giftCategory.drawer.detailTitle}">分类详情</div>
                </th:block>
            </div>
        </section>

        <!--/* ?open=<id> 深链兜底（admin-drawer.js 先按当前页找行，找不到就用这里给的 URL）。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="gift"
              th:attr="data-drawer-deeplink=@{/admin/gift-catalog/{id}/drawer(id=${open})}"></span>

        <!--/* 服务端确认弹层宿主（QRIS 最低金额 · UI L6；fragments/confirm-modal.html 以 HX-Retarget 换进来） */-->
        <div id="confirm-host"></div>

        <script>
            (function () {
                var root = document.querySelector('[data-gift-tabs]');
                if (!root) { return; }
                root.addEventListener('click', function (e) {
                    var btn = e.target.closest('[data-gtab]');
                    if (!btn) { return; }
                    var name = btn.getAttribute('data-gtab');
                    root.querySelectorAll('[data-gtab]').forEach(function (b) {
                        var on = b === btn;
                        b.classList.toggle('tab--on', on);
                        b.setAttribute('aria-selected', String(on));
                    });
                    document.querySelectorAll('[data-gtab-panel]').forEach(function (p) {
                        p.hidden = p.getAttribute('data-gtab-panel') !== name;
                    });
                    document.querySelectorAll('[data-gtab-show]').forEach(function (b) {
                        b.hidden = b.getAttribute('data-gtab-show') !== name;
                    });
                });
            })();
        </script>
    </div>
</div>
</body>
</html>
