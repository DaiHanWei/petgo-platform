<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.seed.title}">种子内容发布 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <!-- 🔴 上传走 fetch，而 /admin/** 那条过滤链**保留 CSRF** —— 少了这两个 meta
         就是 403，且会被误读成"权限不够"。表单提交有 Thymeleaf 自动带的隐藏域，
         fetch 没有，必须自己从这里取。 -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <!-- admin.js：data-confirm / 条件式二次确认 / 图片上传控件（Story 12.2）。
         htmx：切换发布账号时换掉宠物下拉（AC4）。 -->
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.seed.title}">发布种子内容</h1>
        <p class="ok" th:if="${publishedId}">
            <span th:text="#{admin.seed.published.prefix}">已发布，内容 ID：</span><span th:text="${publishedId}">0</span><span th:text="#{admin.seed.published.suffix}">（与用户内容混排，无特殊标记）。</span>
        </p>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <!--/* 模板 E 单步壳（V1.3.0 Story 7.6 · AC1）：本页只有一步，套壳是为了与批量工作台
               视觉一致（同一套步骤条 + 吸底提交条）。页内原先的「逐行批量发布」「Excel 导入并发布」
               两个区块已删 —— 那条轻量批量路径**没有预览、提交即上线**，50 行错 3 行就是 3 条线上真帖；
               能力由 /admin/seed-batches 的四步流完整承载（建批次 → 素材 → 录内容 → 预览确认）。 */-->
        <div th:replace="~{admin/fragments/tpl-e-steps :: steps(~{::seed-steps}, ~{::seed-body}, ~{::seed-footer})}">
            <ol th:fragment="seed-steps" class="step-bar">
                <li class="step step--on" th:text="#{admin.v130.seed.step.single}">单条发布</li>
            </ol>

            <div th:fragment="seed-body">
                <form id="seedPostForm" th:action="@{/admin/seed-post}" th:object="${seedPostForm}" method="post"
                      data-seed-form
                      th:attr="data-real-identity-confirm=#{admin.publishIdentity.realConfirm}">
                    <div th:if="${#fields.hasGlobalErrors()}">
                        <p class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}">错误</p>
                    </div>

                    <!-- ===== 发布账号（V1.1.6 Story 12.2 · AC1）=====
                         此前这一页**根本没有账号选择控件**：作者写死为"登录后台账号所关联的
                         官方作者身份"。防呆走 12-1 的共用片段，四条行为一份实现。 -->
                    <div th:replace="~{admin/fragments/publish-identity-select :: identity-select(${publishIdentities}, 'seedAuthorUserId', 'authorUserId', @{/admin/seed-post/pets}, '#seedPetSelect', null)}"></div>
                    <p class="err" th:if="${#fields.hasErrors('authorUserId')}" th:errors="*{authorUserId}">账号错误</p>

                    <!-- ===== 关联物种（V1.1.6 Story 14.1 · AC4）=====
                         🔴 挂在「发布账号」选择器**之后**（AC4 明写位置）。
                         默认跟随所选账号的账号物种定位；运营可当场覆盖。
                         🛡 **运营手动改过之后就不再被自动跟随覆盖** ——
                            切个账号把他刚选的值冲掉，是最容易让人发错的那种"贴心"。
                         🔴 选的是运营真实账号时默认**留空**：它有真实宠物档案，
                            让算法读档案比让运营猜一个准确。 -->
                    <label class="field" for="seedSpecies" th:text="#{admin.seed.species}">关联物种</label>
                    <select id="seedSpecies" name="species" class="field-full" data-species-follow>
                        <option value="" th:text="#{admin.seed.species.none}">留空（由算法按作者宠物档案推导）</option>
                        <option th:each="sp : ${speciesOptions}" th:value="${sp}" th:text="${sp}">GENERAL</option>
                    </select>
                    <p class="hint" th:text="#{admin.seed.species.hint}">
                        默认跟随所选发布账号的「账号物种定位」；改过之后就不再自动跟随。</p>

                    <label class="field" for="type" th:text="#{admin.seed.type}">内容类型</label>
                    <!-- ⚠️ 取值是**代码枚举** DAILY / GROWTH_MOMENT / KNOWLEDGE（AC6）。
                         PRD 里写的 MOMENT 在代码里不存在：产品口语的 "Moment" = DAILY、
                         "Diary" = GROWTH_MOMENT。单条发布是 GROWTH_MOMENT 的**唯一入口**，
                         这里搞反枚举等于把成长日历入口做没了。 -->
                    <select id="type" th:field="*{type}" class="field-full">
                        <option th:each="t : ${types}" th:value="${t}" th:text="#{'admin.contentType.' + ${t}}">类型</option>
                    </select>
                    <p class="err" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">类型错误</p>

                    <label class="field" for="text" th:text="#{admin.seed.text}">正文（≤1000 字）</label>
                    <textarea id="text" th:field="*{text}" maxlength="1000"></textarea>
                    <p class="err" th:if="${#fields.hasErrors('text')}" th:errors="*{text}">正文错误</p>

                    <!-- ===== 图片（AC2/AC3）=====
                         默认路径是**上传**；「粘贴图片 URL」折叠起来作兜底 ——
                         运营手上确实存在已有 CDN 链接的素材，完全砍掉会制造新的绕路。 -->
                    <label class="field" th:text="#{admin.seed.images.upload}">图片（≤9 张，单张 ≤10MB）</label>
                    <div data-seed-uploader
                         th:attr="data-upload-url=@{/admin/seed-post/images},
                                  data-msg-cover=#{admin.seed.images.cover},
                                  data-msg-first=#{admin.seed.images.firstDecidesHeight},
                                  data-msg-limit=#{admin.seed.images.limit},
                                  data-msg-remove=#{admin.seed.images.remove},
                                  data-msg-uploading=#{admin.seed.images.uploading},
                                  data-msg-failed=#{admin.seed.upload.failed},
                                  data-msg-expired=#{admin.seed.upload.sessionExpired},
                                  data-max-bytes=${uploadMaxBytes},
                                  data-msg-too-large=#{admin.seed.upload.tooLarge(${uploadMaxMb})}">
                        <input type="file" data-seed-file accept="image/jpeg,image/png,image/webp" multiple/>
                        <p class="hint" th:text="#{admin.seed.images.pasteHint}">也可以直接 Ctrl+V 粘贴图片。缩略图可拖拽排序，第一张是封面。</p>
                        <p class="hint" data-seed-status></p>
                        <div class="seed-thumbs" data-seed-thumbs></div>
                        <!-- 首图决定整帖容器高度（AC3 最后一条）。只在 >1 张时才提 ——
                             单图时说这句是噪音。 -->
                        <p class="hint" data-seed-first-note hidden
                           th:text="#{admin.seed.images.firstDecidesHeight}">第一张图决定整帖的容器高度。</p>
                    </div>
                    <!-- 这两个隐藏字段才是提交给服务端的东西：URL 与尺寸**同序等长**。 -->
                    <textarea id="imageUrlsRaw" th:field="*{imageUrlsRaw}" hidden></textarea>
                    <textarea id="imageSizesRaw" th:field="*{imageSizesRaw}" hidden></textarea>

                    <details class="seed-url-fallback">
                        <summary th:text="#{admin.seed.images.urlFallback}">粘贴图片 URL（兜底）</summary>
                        <p class="hint" th:text="#{admin.seed.images.urlFallbackHint}">每行一个公开桶 URL。填在这里的 URL 会追加到上传的图片之后。</p>
                        <textarea data-seed-url-fallback rows="3"></textarea>
                    </details>

                    <label class="field" for="petId" th:text="#{admin.seed.pet}">绑定宠物</label>
                    <!-- HTMX：切换发布账号 → 换掉这一块（AC4）。 -->
                    <div th:replace="~{admin/fragments/seed-pet-select :: options}"></div>

                </form>
            </div>

            <!--/* ⚠️ 提交钮在吸底条里、表单在上面 —— 用 form="seedPostForm" 关联。
                   HTML5 的 form 属性提交的仍是那张表单，submit 事件照常从表单冒泡，
                   admin-core.js 的「选了真实账号才二次确认」钩子不受影响。 */-->
            <div th:fragment="seed-footer">
                <button type="submit" form="seedPostForm" class="btn btn-primary form-submit"
                        th:text="#{admin.seed.submit}">发布</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
