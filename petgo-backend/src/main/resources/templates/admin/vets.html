<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  兽医账号管理（Story 5.1 + 2.2 → V1.3.0 Story 9.1a 套模板 B · tpl-b-list，UI 稿 6-1～6-4）。
  9.1a 的改动是页面组织：行内「编辑 / 重置密码 / 封禁」三列移进抽屉、加摘要条四格、
  在线态与最后在线并入（整页 vet-online / vet-edit 已删，D-11 / D-23）。
  五个写端点的路径 / 参数 / @PreAuthorize 逐字未动。
  🔴 开户仍是**模态框**不是抽屉（UI 稿 6-3 明写「照抄代码原实现」）：校验失败 / 成功都整页重渲染
     并重开弹窗，这条 PRG 链子没动，只套新视觉。
  护栏：明文密码仅提交一次，绝不回显；列表绝不含 passwordHash。门控 @PreAuthorize(vet.view)。
*/-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.vets.title}">兽医账号 · TailTopia 运营</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <!--/* ⚠️ res 设在这一层，不能写在下面那个带 th:replace 的 div 上（优先级 100 vs 600，
           同标签时 th:with 被静默丢弃 —— 见 AdminTemplateStructureTest 的守门）。 */-->
    <div th:fragment="content" th:remove="tag" th:with="res='vet'">
        <h1 th:text="#{admin.vets.title}">兽医账号</h1>

        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>
        <div class="banner err" th:if="${expiryStats != null and (expiryStats.expiringSoon() > 0 or expiryStats.expired() > 0)}"
             th:text="#{admin.vets.expiryWarn(${expiryStats.expiringSoon()}, ${expiryStats.expired()})}">资质预警</div>

        <!--/* 开户成功：初始密码**仅本次可见**（后端不存明文，UI 稿 6-4）。
               🔴 常驻醒目提示 + 复制钮，不是 toast：toast 会自己消失，而这是唯一的获取窗口。 */-->
        <div class="banner ok" th:if="${createdVetId != null}" data-notice="vet-created">
            <p><span th:text="#{admin.vets.created.prefix}">已创建兽医账号（id=</span><span
                    th:text="${createdVetId}">0</span><span th:text="#{admin.vets.created.suffix}">）。</span></p>
            <th:block th:if="${createdVetPassword != null}">
                <p th:text="#{admin.v130.vets.password.issued}">初始密码（仅本次可见，请立即记录并线下交付）：</p>
                <code id="vet-created-password" th:text="${createdVetPassword}">xxxxxxxx</code>
                <button type="button" class="btn btn-neutral btn-sm" data-no-drawer
                        data-copy-target="#vet-created-password"
                        th:text="#{admin.v130.vets.password.copy}">复制</button>
                <p class="hint" th:text="#{admin.v130.vets.password.recorded}">关闭后无法再次查看（后端不保存明文）。</p>
                <button type="button" class="btn btn-neutral btn-sm" data-dismiss-secret data-no-drawer
                        th:text="#{admin.v130.vets.password.close}">我已记录</button>
            </th:block>
        </div>

        <!--/* 兽医开户弹窗。校验失败时后端置 createVetModalOpen → data-autoopen 载入即重开、回显错误。 */-->
        <dialog id="createVetDialog" class="modal" th:attr="data-autoopen=${createVetModalOpen}">
            <div class="modal-head">
                <h3 th:text="#{admin.vets.create}">开户</h3>
                <button type="button" class="modal-close" data-close-dialog aria-label="Close">&times;</button>
            </div>
            <form th:action="@{/admin/vets}" th:object="${createVetForm}" method="post">
                <div class="modal-body">
                    <!--/* 全局/业务错误（如邮箱已被占用，来自 AppException → binding.reject） */-->
                    <p class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}">错误</p>
                    <label class="field" th:text="#{admin.vets.displayName}">兽医昵称</label>
                    <input type="text" th:field="*{displayName}" class="field-full" maxlength="64" required/>
                    <p class="err" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">昵称错误</p>
                    <label class="field" th:text="#{admin.vets.loginEmail}">登录邮箱</label>
                    <input type="email" th:field="*{username}" class="field-full" maxlength="64" required/>
                    <p class="err" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">邮箱错误</p>
                    <label class="field" th:text="#{admin.vets.contactPhone}">联系手机号</label>
                    <input type="text" th:field="*{contactPhone}" class="field-full"/>
                    <p class="err" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}">手机号错误</p>
                    <label class="field" th:text="#{admin.vets.password}">初始密码（≥8 位，仅本次可见）</label>
                    <input type="password" th:field="*{password}" class="field-full" minlength="8" required/>
                    <p class="err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">密码错误</p>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-neutral" data-close-dialog
                            th:text="#{admin.vets.cancel}">取消</button>
                    <button type="submit" class="btn btn-primary" th:text="#{admin.vets.submit.create}">创建</button>
                </div>
            </form>
        </dialog>

        <div th:replace="~{admin/fragments/tpl-b-list :: list(~{::vet-filters}, ~{::vet-summary}, ~{::vet-table}, ~{::vet-drawer})}">
            <!--/* 筛选栏：三个下拉 data-autosubmit（只作用于 <select>）+ 关键词配显式「查询」钮。
                   ⚠️ 参数名 accountStatus / qualStatus / online / q 逐字未动 —— 改名会让运营存的书签失效。 */-->
            <form th:fragment="vet-filters" id="vet-filters-form" th:action="@{/admin/vets}" method="get"
                  hx-get="/admin/vets" hx-target="#vet-rows" hx-swap="innerHTML" data-autosubmit>
                <label class="field"><span th:text="#{admin.vets.filter.account}">账号状态</span>
                    <select name="accountStatus" class="sel">
                        <option value="" th:text="#{admin.vets.filter.all}">全部</option>
                        <option th:each="s : ${vetStatuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s.name() == accountStatus}">ACTIVE</option>
                    </select>
                </label>
                <label class="field"><span th:text="#{admin.vets.filter.qual}">资质状态</span>
                    <select name="qualStatus" class="sel">
                        <option value="" th:text="#{admin.vets.filter.all}">全部</option>
                        <option th:each="s : ${qualStatuses}" th:value="${s}"
                                th:text="#{'admin.qual.' + ${s.name()}}"
                                th:selected="${s.name() == qualStatus}">CERTIFIED</option>
                    </select>
                </label>
                <label class="field"><span th:text="#{admin.vets.filter.online}">在线</span>
                    <select name="online" class="sel">
                        <option value="" th:text="#{admin.vets.filter.all}">全部</option>
                        <option value="ONLINE" th:text="#{admin.vets.online.ONLINE}" th:selected="${online == 'ONLINE'}">在线</option>
                        <option value="OFFLINE" th:text="#{admin.vets.online.OFFLINE}" th:selected="${online == 'OFFLINE'}">离线</option>
                    </select>
                </label>
                <label class="field"><span th:text="#{admin.vets.filter.search}">搜索姓名/邮箱</span>
                    <input type="search" name="q" class="inp" th:value="${q}"/>
                </label>
                <!--/* 评分排序 + 问诊时间段：原「评分查看」总览页的两样东西并进来（AC3 / D-46）。
                       🛡 整块随 rating.view 显隐 —— 服务端也不装那份数据（不是这里藏起来）。
                       ⚠️ 排序**默认为空 = 保持原顺序**：默认按均分重排会让运营每次打开列表都发现
                          行序变了，而他找人靠的是记住位置。
                       ⚠️ 排序值用 snake_case（`avg_desc` …）：这是服务层一直以来的常量，
                          也是退役那页发出去的链接里的拼法（运营存了书签）。 */-->
                <th:block th:if="${canSeeRatings}">
                <label class="field"><span th:text="#{admin.v130.vets.filter.sort}">排序</span>
                    <select name="sort" class="sel">
                        <option value="" th:text="#{admin.v130.vets.filter.sortDefault}">默认</option>
                        <option value="avg_desc" th:selected="${sort == 'avg_desc' or sort == 'avgDesc'}"
                                th:text="#{admin.ratingOverview.sort.avgDesc}">均分高→低</option>
                        <option value="avg_asc" th:selected="${sort == 'avg_asc' or sort == 'avgAsc'}"
                                th:text="#{admin.ratingOverview.sort.avgAsc}">均分低→高</option>
                        <option value="volume_desc" th:selected="${sort == 'volume_desc' or sort == 'volumeDesc'}"
                                th:text="#{admin.ratingOverview.sort.volumeDesc}">问诊量多→少</option>
                    </select>
                </label>
                <!--/* 🔴 两处口径必须写在标签上，否则这个筛选会被读成另一个意思：
                       ① 按 **UTC** 日界算（从退役的总览页原样搬来），与本页其它时间的 WIB 差 7 小时；
                       ② 筛的是**问诊发生的时间**（会话 created_at），不是「评价写下的时间」——
                          9/1 的问诊 9/20 才补评，按「9/15–9/30」查是查不到它的；
                       ③ 它**只影响评分那三个数**，不减少行。不说明的话，运营设完发现「一行都没少」，
                          会以为筛选坏了。 */-->
                <label class="field"><span th:text="#{admin.v130.vets.filter.ratedRange}">问诊时间段（UTC）</span>
                    <input type="date" name="from" class="inp" th:value="${from}"/>
                    <input type="date" name="to" class="inp" th:value="${to}"/>
                    <span class="muted">UTC</span>
                </label>
                <p class="hint" data-notice="vets-rating-range-scope"
                   th:text="#{admin.v130.vets.filter.ratedRangeNote}">只影响评分列，不减少行。</p>
                </th:block>
                <!--/* 🔴 关键词走**显式「查询」钮**，不再 keyup 即搜：边打字边发请求会在
                       「王」这一个字上就把表刷成几十行，运营还没打完就已经看花了。 */-->
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{admin.payments.btn.search}">查询</button>
                <a th:href="@{/admin/vets}" class="btn btn-sm" data-no-drawer
                   th:text="#{admin.payments.btn.reset}">清空筛选</a>
                <!--/* ＋开户在筛选栏最右（AC1 / UI 稿 6-1）。
                       与 POST /admin/vets 的 @PreAuthorize 同款门控：无 vet.create 的 STAFF 不见此按钮。 */-->
                <button type="button" class="btn btn-primary btn-sm" data-open-dialog="createVetDialog" data-no-drawer
                        sec:authorize="hasRole('SUPER_ADMIN') or hasAuthority('vet.create')"
                        th:text="#{admin.vets.create}">＋开户</button>
            </form>

            <div th:fragment="vet-summary" th:replace="~{admin/fragments/vets-list :: sumbar(false)}"></div>

            <div th:fragment="vet-table" id="vet-rows">
                <div th:replace="~{admin/fragments/vets-list :: rows(false)}"></div>
            </div>

            <div th:fragment="vet-drawer" class="drawer-title" th:text="#{admin.v130.vets.drawer.title}">兽医详情</div>
        </div>

        <!--/* 抽屉里处置成功后整表重拉。
               🔴 hx-include 指向筛选表单本体（不是把值烤进 URL）：筛选走 htmx 局部 swap，
                  烤进去的串在换过筛选之后就是旧的，刷新会把表悄悄跳回上一次的筛选集
                  （8.3 复审踩过这个坑）。hx-include 读的是**请求那一刻**的表单值。 */-->
        <span hidden id="vets-refresh"
              hx-get="/admin/vets" hx-include="#vet-filters-form"
              hx-trigger="admin:vet-list-refresh from:body"
              hx-target="#vet-rows" hx-swap="innerHTML"></span>

        <!--/* ?open=<id> 深链兜底：admin-drawer.js 先按当前页找行，找不到就用这里给的 URL。 */-->
        <span hidden th:if="${open != null}" data-drawer-res="vet"
              th:attr="data-drawer-deeplink=@{/admin/vets/{id}/drawer(id=${open})}"></span>
    </div>
</div>
</body>
</html>
