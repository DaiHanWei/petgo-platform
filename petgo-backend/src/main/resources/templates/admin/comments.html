<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  评论内容管理（Story 9.9）→ V1.3.0 Story 4.1 升级为两页签：「评论巡查」（原列表，功能 / 端点 / 权限不变，fragments/comments-inspect）
  ｜「帖子评论分布」（AB-20A ①，fragments/comments-distribution，htmx 局部切换 #comments-tab-body，不整页刷新）。
  模型：tab = inspect | distribution；页签一需 comments，页签二需 filter / rows / summary …（由 AdminCommentDistributionController 提供）。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.comments.title}">评论管理 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
    <script defer th:src="@{/admin/admin-drawer.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <h1 th:text="#{admin.comments.title}">评论管理</h1>
        <div class="banner ok" th:if="${notice}" th:text="${notice}">ok</div>
        <div class="banner err" th:if="${error}" th:text="${error}">err</div>

        <!--/* 常驻页签条（4.1 AC1）：V1.3.0 Story 7.2 抽成 fragments/comments-tabs —— 4.1 与 7.2 的合并冲突点只剩这一行 */-->
        <div th:replace="~{admin/fragments/comments-tabs :: tabs}"></div>

        <div id="comments-tab-body" role="tabpanel">
            <th:block th:if="${tab == 'distribution'}"><div th:replace="~{admin/fragments/comments-distribution :: body}"></div></th:block>
            <th:block th:unless="${tab == 'distribution'}"><div th:replace="~{admin/fragments/comments-inspect :: body}"></div></th:block>
        </div>

        <script>
        // Story 4.1：页签切换后同步页签高亮；「去评论」按钮（Story 4.2 接入抽屉端点）→ 打开模板 B 抽屉（res=post）。
        (function () {
            // 422/403 行内 err 不清空页签体：分布页签内的请求把 HX-Target 改到 #admin-inline-error（advice 按它 HX-Retarget），
            // 成功响应仍按元素自己的 hx-target 换 #comments-tab-body（HX-Target 头只影响错误落点）。
            document.body.addEventListener('htmx:configRequest', function (e) {
                var el = e.detail && e.detail.elt;
                // 抽屉（模板 B 的 #post-drawer 在 #comments-distribution 里）内的请求按元素自己的 hx-target 落错误（4.2 评论区 #vc-error），不改头
                if (el && el.closest && el.closest('#comments-distribution') && !el.closest('.drawer')) { e.detail.headers['HX-Target'] = 'admin-inline-error'; }
            });
            // 选「≤ N」但 N 还没填：拦下 data-autosubmit 的即选即查，聚焦 N，等「查询」钮
            document.addEventListener('submit', function (e) {
                var f = e.target;
                if (!f || !f.matches || !f.matches('form[data-distribution-filter]')) { return; }
                var count = f.querySelector('select[name=count]');
                var n = f.querySelector('input[name=n]');
                if (count && n && count.value === 'custom' && !n.value.trim()) { e.preventDefault(); n.focus(); }
            }, true);
            document.body.addEventListener('htmx:afterSwap', function (e) {
                var t = e.detail && e.detail.target;
                if (!t || t.id !== 'comments-tab-body') { return; }
                var on = !!t.querySelector('#comments-distribution');
                document.querySelectorAll('.comments-tabs .tab').forEach(function (a) {
                    var isDist = a.hasAttribute('hx-get');
                    a.classList.toggle('tab--on', isDist === on);
                    // ⚠️ aria-selected 是服务端按 ${tab} 算死的，而页签二是 htmx 局部切换、不整页刷新 ——
                    //    不在这里一起同步，读屏用户拿到的就是与视觉相反的状态（Story 7.2 复审 C2）。
                    a.setAttribute('aria-selected', String(isDist === on));
                });
            });
            // ===== Story 4.2 抽屉评论区：身份未选或内容为空 → 发布禁用；剩余字数；搜昵称；展开其他物种；10 分钟内已评软提示（首次拦一次）
            function vcSync(form) {
                var sel = form.querySelector('[data-vc-identity]');
                var body = form.querySelector('[data-vc-body]');
                var btn = form.querySelector('[data-vc-submit]');
                var rem = form.querySelector('[data-vc-remaining]');
                if (body && rem) {
                    var left = Math.max(0, 200 - body.value.length);
                    // 模板只从服务端渲染的初始文案建一次（数字换成 {0}），之后每次都用模板替换（复审：第二次起曾显示字面 {0}）
                    if (!rem.getAttribute('data-tpl')) { rem.setAttribute('data-tpl', rem.textContent.replace(/\d+/, '{0}')); }
                    rem.textContent = rem.getAttribute('data-tpl').replace('{0}', String(left));
                }
                if (btn) { btn.disabled = !(sel && sel.value && body && body.value.trim()); }
            }
            function vcFilter(form) {
                var q = (form.querySelector('[data-vc-search]') || {}).value || '';
                var showAll = !!(form.querySelector('[data-vc-show-all]') || {}).checked;
                var others = form.querySelector('[data-vc-others]');
                if (others) { others.hidden = !showAll; }
                form.querySelectorAll('[data-vc-identity] option[value]:not([value=""])').forEach(function (o) {
                    o.hidden = q && o.textContent.toLowerCase().indexOf(q.toLowerCase()) < 0;
                });
            }
            ['input', 'change'].forEach(function (ev) {
                document.addEventListener(ev, function (e) {
                    var form = e.target && e.target.closest ? e.target.closest('form[data-vc-form]') : null;
                    if (!form) { return; }
                    if (e.target.hasAttribute('data-vc-search') || e.target.hasAttribute('data-vc-show-all')) { vcFilter(form); }
                    if (e.target.hasAttribute('data-vc-identity')) { form.removeAttribute('data-vc-acked'); var w = form.querySelector('[data-vc-recent-warn]'); if (w) { w.hidden = true; } }
                    vcSync(form);
                });
            });
            // outerHTML 换掉 #vc-composer 后 detail.target 仍是旧节点（htmx 1.9.12），一律在文档里找当前挂着的评论区表单初始化
            function vcInitAll() {
                document.querySelectorAll('form[data-vc-form]').forEach(function (f) { vcFilter(f); vcSync(f); });
            }
            document.body.addEventListener('htmx:afterSwap', vcInitAll);
            document.body.addEventListener('htmx:oobAfterSwap', vcInitAll);
            // D-20 软提示：该身份 10 分钟内评过本帖 → 首次点「发布」只提示，再点即发（不弹层、不拦截）
            document.body.addEventListener('htmx:confirm', function (e) {
                var form = e.detail && e.detail.elt && e.detail.elt.closest ? e.detail.elt.closest('form[data-vc-form]') : null;
                if (!form) { return; }
                var sel = form.querySelector('[data-vc-identity]');
                var recent = (form.getAttribute('data-recent-ids') || '').split(',').filter(Boolean);
                if (sel && recent.indexOf(sel.value) >= 0 && !form.hasAttribute('data-vc-acked')) {
                    e.preventDefault();
                    form.setAttribute('data-vc-acked', '1');
                    var w = form.querySelector('[data-vc-recent-warn]');
                    if (w) { w.hidden = false; }
                }
            });
            document.addEventListener('click', function (e) {
                var b = e.target && e.target.closest ? e.target.closest('button[data-post-id][data-drawer-url]') : null;
                if (!b || b.disabled) { return; }
                if (window.Admin && Admin.drawer && typeof Admin.drawer.open === 'function') {
                    Admin.drawer.open(b.getAttribute('data-drawer-url'), { res: 'post', rowEl: b.closest('tr') });
                }
            });
        })();
        </script>
    </div>
</div>
</body>
</html>
