<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  C3 销售与毛利（V1.3.0 Story 10.5 AC2，模板 C · tpl-c-report；原 V1.4.0 Story 8.1 AB-13A）。
  🔒 **全页商业敏感**，独立权限位 shop.finance_view —— 进得来就看得到全部成本数字
     （AC2「本页整体门控，不再细分」）。
  🔴 **本页没有写操作、没有导出**；只读标识由模板 C 的壳给出。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.margin.title}">销售与毛利 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.shop.margin.title}">销售与毛利</h1></div>
        <p class="muted" th:text="#{admin.shop.margin.hint}">成本按下单那一刻的进货价快照算——用现在的进货价算不出当时的毛利。数据源是业务库，不是分析平台。</p>

        <div th:replace="~{admin/fragments/tpl-c-report :: report(~{::mg-range}, ~{::mg-cards}, ~{::mg-detail})}">
            <form th:fragment="mg-range" class="filter-bar" data-autosubmit method="get"
                  th:action="@{/admin/shop/margin}" th:attr="hx-get=@{/admin/shop/margin}"
                  hx-target="#margin-cards" hx-swap="outerHTML" hx-push-url="true">
                <label class="field"><span th:text="#{admin.shop.orders.filter.from}">起始日期</span>
                    <input type="date" name="from" class="inp" th:value="${from}"/>
                </label>
                <label class="field"><span th:text="#{admin.shop.orders.filter.to}">截止日期</span>
                    <input type="date" name="to" class="inp" th:value="${to}"/>
                </label>
                <label class="field"><span th:text="#{admin.shop.col.category}">品类</span>
                    <select name="category" class="sel">
                        <option value="" th:text="#{admin.shop.orders.filter.all}">全部品类</option>
                        <!--/* 走 key 而不是直接铺 MAKANAN / OBAT_VITAMIN：切 ID 后那些词连英文都不是
                               （Story 11.2 的枚举欠账清单里这一条就是本页）。 */-->
                        <option th:each="c : ${categories}" th:value="${c}"
                                th:text="#{'admin.v130.shopProducts.category.' + ${c.name()}}"
                                th:selected="${c.name() == category}">主粮</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.common.filter}">筛选</button>
            </form>

            <div th:fragment="mg-cards" th:replace="~{admin/fragments/cards-shop-margin :: cards}"></div>
            <div th:fragment="mg-detail" th:replace="~{admin/fragments/cards-shop-margin :: detail(false)}"></div>
        </div>
    </div>
</div>
</body>
</html>
