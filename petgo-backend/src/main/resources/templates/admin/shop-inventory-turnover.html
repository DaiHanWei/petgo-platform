<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  C4 库存周转与滞销（V1.3.0 Story 10.5 AC3，模板 C · tpl-c-report；原 V1.4.0 Story 8.2 AB-13C）。
  🔒 含按进货价的库存金额，走 shop.finance_view。
  🔴 **本页没有写操作、没有导出**；只读标识由模板 C 的壳给出。
  🔴 「建议动作」列必须保留：只报「滞销」而不说怎么办，运营还是不会动。
-->
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.shop.turnover.title}">库存周转 · TailTopia 运营后台</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
    <link rel="stylesheet" th:href="@{/admin/admin-shop.css}"/>
    <script defer th:src="@{/admin/admin-core.js}"></script>
</head>
<body>
<div th:replace="~{admin/layout :: page(~{::content})}">
    <div th:fragment="content" th:remove="tag">
        <div class="wb-title-row"><h1 th:text="#{admin.shop.turnover.title}">库存周转与滞销</h1></div>
        <p class="muted" th:text="#{admin.shop.turnover.hint}">库存金额按进货价算——那是资金占用的直接读数。按售价算会把还没赚到的毛利也算成压着的钱。</p>

        <div th:replace="~{admin/fragments/tpl-c-report :: report(~{::tv-range}, ~{::tv-cards}, ~{::tv-detail})}">
            <form th:fragment="tv-range" class="filter-bar" data-autosubmit method="get"
                  th:action="@{/admin/shop/inventory-turnover}"
                  th:attr="hx-get=@{/admin/shop/inventory-turnover}"
                  hx-target="#turnover-cards" hx-swap="outerHTML" hx-push-url="true">
                <label class="field"><span th:text="#{admin.shop.turnover.col.window}">统计窗口（天）</span>
                    <input type="number" name="days" class="inp" min="1" th:value="${staleDays}"/>
                </label>
                <button type="submit" class="btn btn-neutral btn-sm" th:text="#{admin.common.filter}">筛选</button>
            </form>

            <div th:fragment="tv-cards" th:replace="~{admin/fragments/cards-shop-turnover :: cards}"></div>
            <div th:fragment="tv-detail" th:replace="~{admin/fragments/cards-shop-turnover :: detail(false)}"></div>
        </div>
    </div>
</div>
</body>
</html>
