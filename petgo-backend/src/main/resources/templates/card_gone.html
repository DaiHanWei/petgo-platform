<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--/* 失效页同样 noindex；对「不存在/删除/注销」三态统一响应，不泄漏 token 曾否存在（防枚举）。
         ⚠️ V1.1.6 Story 1.3 重做时必须保留。 */-->
    <meta name="robots" content="noindex,nofollow"/>
    <title>TailTopia</title>

    <!--/* ⚠️ 本页被**两条链路共用**：宠物名片（CardPageController）与里程碑分享
         （MilestoneSharePageController）。改动会同时影响两处，两条都要验。

         ⚠️ **本页只能是单语的（印尼语），这不是漏做。**
         里程碑分享页本身是双语的（按 share.getLocale()，即分享者分享时快照的语言），
         但「失效」意味着 token 查不到任何记录 —— 拿不到 locale，无从按语言渲染。
         也不要改用 Accept-Language 补救：那会让同一条失效链接在不同人手机上显示不同语言，
         与「三态统一响应」的防枚举口径相冲。 */-->

    <!--/* 字体与 card.html 同一套（V1.1.6 Story 1.2 引入），失效页与正常页视觉连续。 */-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --v:#845EC9; --v3:#6C48AE; --vt:#F8F2FF;
            --gold:#F6A609; --ink:#2E2A45; --ink2:#544864; --muted:#9690A6;
            --paper:#FFFCF4;
            --font:'Poppins',system-ui,sans-serif;
            --display:'Archivo','Poppins',system-ui,sans-serif;
            --hand:'Caveat',cursive;
        }
        * { box-sizing:border-box; }
        html, body { margin:0; padding:0; height:100%; }
        body { background:var(--paper); color:var(--ink); font-family:var(--font);
            line-height:1.5; -webkit-font-smoothing:antialiased; }

        .paper { min-height:100%; max-width:440px; margin:0 auto;
            padding:14px 16px calc(96px + env(safe-area-inset-bottom, 0px));
            display:flex; flex-direction:column; }
        .top { margin-bottom:6px; }
        .top .mark { height:22px; display:block; opacity:.9; }

        .state { flex:1; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:0 30px 84px; text-align:center; }

        .corners { position:relative; width:146px; height:146px; margin:0 auto; }
        .corner { position:absolute; width:34px; height:34px; border:0 solid #CFC6DF; }
        .corner.tl { left:0; top:0; border-left-width:9px; border-top-width:9px; border-top-left-radius:3px; }
        .corner.tr { right:0; top:0; border-right-width:9px; border-top-width:9px; border-top-right-radius:3px; }
        .corner.bl { left:0; bottom:0; border-left-width:9px; border-bottom-width:9px; border-bottom-left-radius:3px; }
        .corner.br { right:0; bottom:0; border-right-width:9px; border-bottom-width:9px; border-bottom-right-radius:3px; }
        .residue { position:absolute; left:50%; top:-13px; width:64px; height:20px; margin-left:-32px;
            background:rgba(246,166,9,.2); transform:rotate(-3deg);
            -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3px,#000 calc(100% - 3px),transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3px,#000 calc(100% - 3px),transparent 100%); }

        .stitle { font-family:var(--display); font-variation-settings:'wdth' 104,'wght' 800;
            font-size:23px; line-height:1.18; letter-spacing:-.015em; color:var(--ink);
            margin-top:26px; text-wrap:balance; }
        .ssub { font-size:13px; line-height:1.6; color:var(--ink2); margin-top:10px; text-wrap:pretty; }

        .ctabar { position:fixed; left:0; right:0; bottom:0; z-index:20;
            padding:26px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            background:linear-gradient(to top, var(--paper) 46%, rgba(255,252,244,.92) 68%, rgba(255,252,244,0)); }
        .ctainner { max-width:440px; margin:0 auto; text-align:center; }
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto;
            border:none; border-radius:999px; height:50px; padding:0 30px; font-size:14.5px;
            font-weight:700; font-family:var(--font); cursor:pointer; white-space:nowrap;
            text-decoration:none; background:var(--vt); color:var(--v3);
            box-shadow:0 1px 2px rgba(108,72,174,.08), 0 4px 12px rgba(108,72,174,.12),
                0 12px 24px rgba(108,72,174,.08);
            transition:scale 180ms cubic-bezier(.2,0,0,1); }
        .btn:active { scale:.96; }

        @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
    </style>
</head>
<body>
<div class="paper">
    <div class="top"><img class="mark" src="/brand/logo.svg" alt="TailTopia"/></div>

    <div class="state">
        <div class="corners">
            <div class="residue"></div>
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
        </div>
        <div class="stitle">Halaman ini<br/>sudah tidak ada</div>
        <!--/* ⚠️ 文案刻意用「或」把两种原因糊在一起 —— 防枚举：不得让访客分辨出
             「这个 token 从来不存在」还是「存在过但已删除/注销」。改文案时不要加原因说明。 */-->
        <div class="ssub">Paspor hewan ini sudah dihapus atau tautannya tidak berlaku lagi.</div>
    </div>
</div>

<div class="ctabar">
    <div class="ctainner">
        <a class="btn" th:href="${downloadUrl}">Jelajahi hewan lain</a>
    </div>
</div>
</body>
</html>
