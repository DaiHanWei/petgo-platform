<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <!-- 分享页对外但不进搜索引擎索引（与名片 /p、里程碑 /m、单条内容 /c 同范式，强制 noindex）。 -->
    <meta name="robots" content="noindex,nofollow"/>
    <title th:text="${ogTitle}">TailTopia</title>

    <!--/* 🔴 Open Graph：本页**有** og:image —— 这是对名片页 /p 与里程碑页 /m
           「不放预览图」那条边界的**有意例外**（Story 1.10 · AC4 · AD-5）。

           那两页的图是**宠物与主人的私人照片**，交给第三方平台抓取并长期缓存不合适。
           场所照片不同：它拍的是一家店的门口、座位区、菜单 —— 不含个人与宠物隐私，
           而这页的全部意义就是"发到 WhatsApp 群里让朋友一眼看到这地方长什么样"。
           没有预览图，那条链接在群里就是一行蓝字。

           ⚠️ **这不是漏做，不要"顺手统一"成不放图。** 要改回去先回 AD-5 改口径。

           🔴 但是：`ogImage` 只在**有已过审的照片**时才有值（AC5，2026-09-15 拍板）。
           社交平台会主动抓取并**缓存**预览图 —— 审核放行前就给图，等于任何人都能造个场所、
           传张违规图、把链接甩进群；等运营下架时，预览卡已经躺在几百个聊天记录里，
           而且不随下架消失。**H5 页面会变，预览卡不会，这是两个东西。**
           判定在 PlaceSharePageController：取的是 **og_eligible** 的照片，
           那比"对外可见"更严 —— 三方 RISKY / DEGRADED 的图照样在 App 里展示（先发后审），
           但拿不到 og 资格。展示是一回事，交给社交平台永久缓存是另一回事。 */-->
    <meta property="og:type" content="place"/>
    <meta property="og:title" th:content="${ogTitle}"/>
    <meta property="og:description" th:content="${ogDescription}"/>
    <meta property="og:image" th:if="${hasOgImage}" th:content="${ogImage}"/>
    <meta name="twitter:card" th:content="${hasOgImage} ? 'summary_large_image' : 'summary'"/>
    <meta name="twitter:title" th:content="${ogTitle}"/>
    <meta name="twitter:description" th:content="${ogDescription}"/>
    <meta name="twitter:image" th:if="${hasOgImage}" th:content="${ogImage}"/>

    <style>
        :root { --ink: #2E2A45; --ink2: #544864; --muted: #9690A6; --violet: #845EC9; --tint: #F8F2FF; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
            background: var(--tint); color: var(--ink);
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
        }
        .wrap { width: 100%; max-width: 480px; padding: 20px 16px 120px; }
        .brand { height: 22px; margin-bottom: 14px; }
        .card { background: #fff; border-radius: 18px; overflow: hidden;
                box-shadow: 0 8px 24px rgba(46,42,69,.10); }
        .hero { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; }
        .heroph { width: 100%; aspect-ratio: 4 / 3; background: #EFE9F8;
                  display: flex; align-items: center; justify-content: center; font-size: 34px; }
        .pad { padding: 16px; }
        .invite { font-size: 12.5px; color: var(--violet); font-weight: 700; }
        .name { font-size: 20px; font-weight: 800; margin-top: 4px; line-height: 1.3; }
        .type { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .tag { font-size: 11px; font-weight: 700; color: var(--violet);
               border: 1px solid #E2D6F5; border-radius: 999px; padding: 4px 9px; }
        .desc { font-size: 14.5px; line-height: 1.6; margin-top: 12px; white-space: pre-wrap;
                word-break: break-word; color: var(--ink2); }
        .addr { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px;
                background: #F6F2FB; border-radius: 12px; padding: 11px 12px; }
        .addrtext { font-size: 13px; color: var(--ink2); flex: 1; word-break: break-word; }
        .copy { font-size: 12px; font-weight: 700; color: var(--violet); background: none;
                border: 0; padding: 4px 2px; cursor: pointer; flex: none; }
        .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; }
        .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
        .ctabar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
                  background: linear-gradient(180deg, rgba(248,242,255,0) 0%, var(--tint) 34%); }
        .ctainner { max-width: 448px; margin: 0 auto; }
        .btn { display: block; text-align: center; text-decoration: none;
               background: var(--violet); color: #fff; font-size: 15px; font-weight: 700;
               padding: 15px 18px; border-radius: 14px;
               box-shadow: 0 8px 22px rgba(132,94,201,.34); }
        .ctahint { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 8px; }
        .note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 14px; }
    </style>
</head>
<body>
<!--/* 🛡 页面上**没有**通往标记人主页 / 评论区 / 其它场所的任何链接：
       这是一条分享出去的地点信息，不是一个可浏览的入口。唯一的出口是底部 CTA。 */-->
<div class="wrap">
    <!--/* ⚠️ 用 /brand/logo.svg —— 后端 static/brand/ 里**只有这一个**文件。
         `wordmark_brand.svg` 只存在于 App 的 assets 里，写它就是每页顶上一个裂图
         （content_share.html 至今是这个状态）。 */-->
    <img class="brand" src="/brand/logo.svg" alt="TailTopia"/>

    <div class="card">
        <img class="hero" th:if="${hasImages}" th:src="${images[0]}" alt=""/>
        <div class="heroph" th:unless="${hasImages}">🐾</div>
        <div class="pad">
            <div class="invite">Temanmu mengajak kamu nongkrong di sini!</div>
            <div class="name" th:text="${placeName}">—</div>
            <div class="type" th:if="${typeLabel}" th:text="${typeLabel}">—</div>

            <div class="tags" th:if="${hasTags}">
                <span class="tag" th:each="t : ${tagLabels}" th:text="${t}">—</span>
            </div>

            <div class="desc" th:if="${hasDescription}" th:text="${description}">—</div>

            <!--/* 文字地址可复制（AC3）。⚠️ 平台不做地理编码 —— 它是一行纯展示的字符串（AD-1 Rule 5）。 */-->
            <div class="addr">
                <span>📍</span>
                <span class="addrtext" id="addrText" th:text="${addressText}">—</span>
                <button class="copy" id="copyAddr" type="button">Salin</button>
            </div>

            <!--/* 其余照片缩略（首图已在 hero 里）。 */-->
            <div class="thumbs" th:if="${photoCount > 1}">
                <img th:each="img, s : ${images}" th:if="${s.index > 0 and s.index < 5}"
                     th:src="${img}" alt=""/>
            </div>
        </div>
    </div>

    <div class="note">Dibagikan dari TailTopia 🐾</div>
</div>

<div class="ctabar">
    <div class="ctainner">
        <a class="btn" id="ctaPrimary" th:href="${downloadUrl}"
           th:attr="data-ios=${iosUrl},data-android=${androidUrl},data-deeplink=${deeplink}"
           th:text="${downloadCta}">Buka di aplikasi</a>
        <div class="ctahint">Gratis di App Store &amp; Google Play</div>
    </div>
</div>

<script th:inline="none">
  // 地址一键复制（AC3）。降级：不支持 clipboard API 就选中文本，让用户自己长按复制。
  (function () {
    var btn = document.getElementById('copyAddr');
    var txt = document.getElementById('addrText');
    if (!btn || !txt) { return; }
    btn.addEventListener('click', function () {
      var value = txt.textContent || '';
      function done() { btn.textContent = 'Tersalin'; setTimeout(function () { btn.textContent = 'Salin'; }, 1600); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done, function () { select(); });
      } else { select(); }
      function select() {
        var r = document.createRange();
        r.selectNodeContents(txt);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
    });
  })();

  // 唤起链（AC6）—— **逐条照抄 card.html 的那套**，不要另发明一个计时方案：
  //   Android: (1) 深链 -> (2) market:// -> (3) Play 网页
  //   iOS:     (1) 深链 -> (2) App Store
  //   桌面:     直接下载页
  // 判"唤起成功"靠 pagehide：页面在守卫计时器触发前被隐藏 = App 接管了。
  // ⚠️ 安卓侧还要 AndroidManifest 里有 `tailtopia://place` 的 intent-filter，
  //    少那一条 **唤起必失败，而所有测试照样绿**（深链是系统行为）。
  //    仓库里 `test/deeplink_manifest_test.dart` 就是为这件事写的。
  (function () {
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);

    function toMarket(webUrl) {
      return webUrl.replace('https://play.google.com/store/apps/details', 'market://details');
    }
    function go(url) { window.location.href = url; }
    function guard(fn, ms) {
      var t = setTimeout(fn, ms);
      window.addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
      return t;
    }

    var el = document.getElementById('ctaPrimary');
    if (!el) { return; }
    el.addEventListener('click', function (e) {
      e.preventDefault();
      var deep = el.dataset.deeplink;
      var androidWeb = el.dataset.android;
      var ios = el.dataset.ios;

      if (isAndroid || isIOS) {
        if (isAndroid) {
          guard(function () {
            guard(function () { go(androidWeb); }, 700);
            go(toMarket(androidWeb));
          }, 900);
        } else {
          guard(function () { go(ios); }, 900);
        }
        go(deep);
      } else {
        go(el.href);
      }
    });
  })();
</script>
</body>
</html>
